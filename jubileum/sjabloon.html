<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Eén jaar, geteld</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,300;1,9..144,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --papier: #f6efe2;
  --papier-donker: #ece2cf;
  --inkt: #2f2b28;
  --inkt-zacht: #6d655d;
  --lijn: #d9ccb5;
  --tan: #b8875a;
  --tan-zacht: #e3c9a8;
  --serif: "Fraunces", Georgia, "Times New Roman", serif;
  --hand: "Caveat", "Bradley Hand", "Segoe Print", cursive;
  --sans: "Inter", system-ui, -apple-system, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--papier);
  color: var(--inkt);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.5;
  background-image:
    radial-gradient(circle at 20% 10%, rgba(255,255,255,.55), transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(184,135,90,.06), transparent 45%);
}
main { max-width: 560px; margin: 0 auto; padding: 0 20px 64px; }
section { padding: 56px 0 8px; }
h2 {
  font-family: var(--serif); font-weight: 300; font-size: 30px; line-height: 1.15;
  letter-spacing: -.01em; margin-bottom: 6px;
}
.kicker {
  font-family: var(--sans); font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--tan); margin-bottom: 10px;
}
.uitleg { color: var(--inkt-zacht); font-size: 15px; margin-bottom: 22px; }
.hand { font-family: var(--hand); font-weight: 500; }
.scheiding { display: block; width: 48px; height: 1px; background: var(--lijn); margin: 0 auto; }

/* hero */
.hero { min-height: 92vh; display: flex; flex-direction: column; justify-content: center; text-align: center; padding-top: 40px; }
.hero .datum { font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--inkt-zacht); }
.hero h1 {
  font-family: var(--serif); font-weight: 300; font-size: clamp(44px, 13vw, 72px);
  line-height: 1.02; letter-spacing: -.02em; margin: 22px 0 18px;
}
.hero h1 .en { font-style: italic; color: var(--tan); font-weight: 300; }
.hero .regel { font-family: var(--hand); font-size: 34px; color: var(--inkt); }
.hero .groot { font-family: var(--serif); font-size: 15px; color: var(--inkt-zacht); margin-top: 28px; }
.hero .scroll { margin-top: 48px; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--inkt-zacht); }

/* tegels */
.tegels { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--lijn); border: 1px solid var(--lijn); }
.tegel { background: var(--papier); padding: 20px 16px 18px; }
.tegel .getal { font-family: var(--serif); font-weight: 400; font-size: 34px; line-height: 1.05; letter-spacing: -.02em; font-variant-numeric: lining-nums; }
.tegel .label { font-size: 13px; color: var(--inkt-zacht); margin-top: 6px; line-height: 1.35; }
.tegel.accent .getal { color: var(--tan); }

/* zin met groot getal */
.verhaal { font-family: var(--serif); font-weight: 300; font-size: 24px; line-height: 1.4; }
.verhaal strong { font-weight: 500; color: var(--tan); }
.notitie { font-family: var(--hand); font-size: 24px; color: var(--inkt-zacht); margin-top: 14px; }

/* splitbalken */
.split { margin-bottom: 26px; }
.split .kop { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; }
.split .kop span:last-child { text-align: right; }
.split .titel { font-size: 13px; color: var(--inkt-zacht); margin-bottom: 6px; }
.balk { display: flex; height: 14px; border-radius: 2px; overflow: hidden; }
.balk .a { background: var(--inkt); }
.balk .b { background: var(--tan); }
.split.groot .balk { height: 40px; }
.split.groot .kop { font-family: var(--serif); font-size: 22px; }
.split .pct { font-variant-numeric: tabular-nums; }

/* grafiek */
.grafiek svg { display: block; width: 100%; height: auto; overflow: visible; }
.momenten { list-style: none; margin-top: 16px; }
.momenten li { display: flex; gap: 10px; align-items: baseline; font-size: 14px; color: var(--inkt-zacht); margin-bottom: 6px; }
.momenten .nr { flex: none; width: 20px; height: 20px; border-radius: 50%; background: var(--tan); color: var(--papier); font-size: 11px; display: inline-flex; align-items: center; justify-content: center; transform: translateY(3px); }
.momenten .wat { font-family: var(--hand); font-size: 22px; color: var(--inkt); }

/* heatmap */
.heat { display: grid; grid-template-columns: 26px repeat(24, 1fr); gap: 2px; font-size: 10px; color: var(--inkt-zacht); }
.heat .cel { aspect-ratio: 1 / 1.35; border-radius: 1.5px; }
.heat .cel.top { background: var(--tan) !important; }
.heat .dag { display: flex; align-items: center; }
.heat .uur { text-align: left; padding-top: 4px; white-space: nowrap; }
.heat .uur.top { color: var(--tan); font-weight: 500; }

/* emoji */
.emoji-lijst { list-style: none; }
.emoji-lijst li { display: grid; grid-template-columns: 28px 52px 1fr auto; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--lijn); }
.emoji-lijst .rang { font-family: var(--serif); color: var(--inkt-zacht); font-size: 15px; }
.emoji-lijst .e { font-size: 38px; line-height: 1; }
.emoji-lijst .staaf { height: 6px; background: var(--inkt); border-radius: 1px; }
.emoji-lijst li:first-child .staaf { background: var(--tan); }
.emoji-lijst .n { font-variant-numeric: tabular-nums; font-size: 14px; color: var(--inkt-zacht); min-width: 48px; text-align: right; }

/* records */
.records { list-style: none; }
.records li { padding: 16px 0; border-bottom: 1px solid var(--lijn); }
.records .wat { font-size: 13px; color: var(--inkt-zacht); }
.records .waarde { font-family: var(--serif); font-size: 22px; line-height: 1.3; }
.records .klein { font-size: 14px; color: var(--inkt-zacht); }

/* brief en slot */
.brief { font-family: var(--hand); font-size: 27px; line-height: 1.35; white-space: pre-line; }
.slot { text-align: center; padding: 72px 0 24px; }
.slot p { font-family: var(--serif); font-style: italic; font-weight: 300; font-size: 28px; line-height: 1.3; }
.slot .namen { font-family: var(--hand); font-size: 30px; color: var(--tan); margin-top: 18px; }
.voet { text-align: center; font-size: 11px; color: var(--inkt-zacht); margin-top: 40px; letter-spacing: .06em; }

@media (min-width: 720px) {
  section { padding-top: 80px; }
  .tegels { grid-template-columns: 1fr 1fr 1fr; }
}

/* ------------------------- POSTER (A3) ------------------------- */
@page { size: 297mm 420mm; margin: 0; }
body.poster { background: #c9c2b6; }
body.poster main {
  width: 297mm; height: 420mm; max-width: none; margin: 0 auto; padding: 15mm 20mm 13mm;
  background: var(--papier); overflow: hidden;
  display: grid; grid-template-columns: 1fr 1fr; column-gap: 14mm; row-gap: 6mm;
  grid-template-areas: "hero hero" "bon bon" "wie emoji" "vorm vorm" "week week" "slot slot";
  grid-template-rows: auto auto auto auto auto 1fr;
}
body.poster section { padding: 0; min-width: 0; }
body.poster #hero { grid-area: hero; } body.poster #bonnetjes { grid-area: bon; }
body.poster #wie { grid-area: wie; } body.poster #emoji { grid-area: emoji; }
body.poster #vorm { grid-area: vorm; } body.poster #week { grid-area: week; }
body.poster #slot { grid-area: slot; align-self: end; }
body.poster #voor, body.poster #records, body.poster #brief, body.poster .voet, body.poster .notitie { display: none; }
body.poster .hero { min-height: 0; padding: 0; }
body.poster .hero .datum { font-size: 3.2mm; }
body.poster .hero h1 { font-size: 22mm; margin: 3mm 0 1mm; }
body.poster .hero .regel { font-size: 11mm; }
body.poster .hero .groot, body.poster .hero .scroll { display: none; }
body.poster h2 { font-size: 7mm; margin-bottom: 1mm; }
body.poster .kicker { font-size: 2.8mm; margin-bottom: 1.5mm; }
body.poster .uitleg { font-size: 3.4mm; margin-bottom: 3mm; }
body.poster #wie .uitleg, body.poster #emoji .uitleg, body.poster #bonnetjes .uitleg { display: none; }
body.poster .tegels { grid-template-columns: repeat(4, 1fr); }
body.poster .tegel { padding: 3.5mm 4mm 3mm; }
body.poster .tegel .getal { font-size: 10mm; }
body.poster .tegel .label { font-size: 3.2mm; margin-top: 1mm; }
body.poster .split { margin-bottom: 3.5mm; }
body.poster .split.groot .balk { height: 8mm; }
body.poster .split.groot .kop { font-size: 5mm; }
body.poster .split .kop, body.poster .split .titel { font-size: 3.2mm; margin-bottom: 1.2mm; }
body.poster .balk { height: 2.5mm; }
body.poster .emoji-lijst li { padding: 1.4mm 0; grid-template-columns: 6mm 11mm 1fr auto; gap: 3mm; }
body.poster .emoji-lijst .e { font-size: 8mm; }
body.poster .emoji-lijst .n, body.poster .emoji-lijst .rang { font-size: 3.4mm; }
body.poster .grafiek svg { width: 100%; }
body.poster .momenten { columns: 3; column-gap: 8mm; margin-top: 3mm; }
body.poster .momenten li { font-size: 3mm; margin-bottom: 1mm; break-inside: avoid; }
body.poster .momenten .wat { font-size: 4.6mm; }
body.poster .heat { font-size: 2.6mm; grid-template-columns: 7mm repeat(24, 1fr); gap: .6mm; }
body.poster .heat .cel { aspect-ratio: auto; height: 3.6mm; }
body.poster .slot { padding: 0; display: flex; align-items: flex-end; justify-content: space-between; text-align: left; gap: 10mm; }
body.poster .slot p { font-size: 7.5mm; }
body.poster .slot .namen { font-size: 9mm; margin-top: 1mm; }
.qr { display: none; }
body.poster .qr.aan { display: block; flex: none; text-align: center; font-size: 2.8mm; color: var(--inkt-zacht); }
body.poster .qr svg { width: 26mm; height: 26mm; display: block; margin-bottom: 2mm; }
@media print {
  body.poster { background: var(--papier); }
  body.poster main { margin: 0; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>
</head>
<body>
<main id="pagina"></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
const DATA = /*__DATA__*/null;
const S = DATA.stats, P = DATA.pagina || {}, POSTER = DATA.modus === "poster";
if (POSTER) document.body.classList.add("poster");

const verberg = new Set(P.verberg || []);
const JIJ = S.namen.jij.split(" ")[0], ZIJ = S.namen.zij.split(" ")[0];
const pj = S.personen.jij, pz = S.personen.zij;

const n = x => Number(x).toLocaleString("nl-NL");
const MAANDEN = ["jan", "feb", "mrt", "apr", "mei", "jun", "jul", "aug", "sep", "okt", "nov", "dec"];
const MAANDEN_LANG = ["januari", "februari", "maart", "april", "mei", "juni", "juli", "augustus", "september", "oktober", "november", "december"];
const DAGEN = ["ma", "di", "wo", "do", "vr", "za", "zo"];
const DAGEN_LANG = ["maandag", "dinsdag", "woensdag", "donderdag", "vrijdag", "zaterdag", "zondag"];
const datum = iso => { const d = new Date(iso.slice(0, 10) + "T12:00:00"); return `${d.getDate()} ${MAANDEN_LANG[d.getMonth()]} ${d.getFullYear()}`; };
const dagnaam = iso => DAGEN_LANG[(new Date(iso.slice(0, 10) + "T12:00:00").getDay() + 6) % 7];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const som = k => (pj.tellers[k] || 0) + (pz.tellers[k] || 0);

const blokken = [];
const voegToe = (id, html) => { if (!verberg.has(id)) blokken.push(`<section id="${id}">${html}</section>`); };

// 1. hero
const start = S.samen_sinds, jub = P.jubileum || S.jubileum || S.laatste_bericht;
voegToe("hero", `<div class="hero">
  <div class="datum">${datum(start)} &nbsp;—&nbsp; ${datum(jub)}</div>
  <h1>${esc(JIJ)} <span class="en">&amp;</span> ${esc(ZIJ)}</h1>
  <div class="regel">${esc(P.titel_regel || "Eén jaar, geteld.")}</div>
  <div class="groot">${n(S.totaal_berichten)} berichten later</div>
  <div class="scroll">scroll ↓</div>
</div>`);

// 2. de bonnetjes
const tegels = [
  [n(S.totaal_berichten), "berichten", true],
  [n(S.actieve_dagen), `van de ${n(S.dagen_bereik)} dagen geappt`],
  [n(S.media.fotos_en_media), S.media.android_zonder_soort ? "foto's, video's en media" : "foto's gedeeld"],
  [n(S.emojis_totaal), "emoji's verstuurd"],
  [n(som("hou_van_je")), "keer “hou van je”", true],
  [n(som("welterusten")), "keer welterusten"],
  [n(som("goedemorgen")), "keer goedemorgen"],
  [n(som("haha")), "keer haha"],
];
if (S.media.spraak > 0) tegels.splice(3, 0, [n(S.media.spraak), "spraakberichten"]);
if (S.media.videos > 0) tegels.splice(3, 0, [n(S.media.videos), "video's"]);
if (som("mis_je") > 0) tegels.push([n(som("mis_je")), "keer “ik mis je”"]);
for (const w of Object.keys(pj.eigen_woorden || {})) {
  tegels.push([n((pj.eigen_woorden[w] || 0) + (pz.eigen_woorden[w] || 0)), `keer “${esc(w)}”`]);
}
const tegelsMax = POSTER ? 8 : tegels.length - (tegels.length % 2);
voegToe("bonnetjes", `<div class="kicker">De bonnetjes</div><h2>Alles bij elkaar</h2>
  <p class="uitleg">Elk bericht sinds het eerste, opgeteld.</p>
  <div class="tegels">${tegels.slice(0, tegelsMax).map(([g, l, a]) => `<div class="tegel${a ? " accent" : ""}"><div class="getal">${g}</div><div class="label">${l}</div></div>`).join("")}</div>`);

// 3. voordat het officieel was
if (S.voor_samen.berichten > 0) {
  voegToe("voor", `<div class="kicker">Voordat het officieel was</div>
    <p class="verhaal">Vóór ${datum(start).replace(/ \d{4}$/, "")} stuurden we elkaar al <strong>${n(S.voor_samen.berichten)}</strong> berichten, op ${n(S.voor_samen.dagen)} verschillende dagen.</p>
    <p class="notitie">Het allereerste bericht kwam van ${esc(S.eerste_bericht_van === S.namen.jij ? JIJ : ZIJ)}, op ${datum(S.eerste_bericht)}.</p>`);
}

// 4. wie appt meer
function split(titel, a, b, groot) {
  const t = a + b; if (!t) return "";
  const pa = Math.round(100 * a / t), pb = 100 - pa;
  return `<div class="split${groot ? " groot" : ""}">${titel ? `<div class="titel">${titel}</div>` : ""}
    <div class="kop"><span>${esc(JIJ)} <span class="pct">${pa}%</span></span><span><span class="pct">${pb}%</span> ${esc(ZIJ)}</span></div>
    <div class="balk"><div class="a" style="width:${pa}%"></div><div class="b" style="width:${pb}%"></div></div></div>`;
}
const reactie = (pj.reactie_mediaan_min != null && pz.reactie_mediaan_min != null)
  ? `<p class="notitie">Reactietijd: ${esc(JIJ)} gemiddeld ${tijdTekst(pj.reactie_mediaan_min)}, ${esc(ZIJ)} ${tijdTekst(pz.reactie_mediaan_min)}.</p>` : "";
function tijdTekst(min) { return min < 1 ? "binnen een minuut" : min < 60 ? `${Math.round(min)} min` : `${(min / 60).toFixed(1).replace(".", ",")} uur`; }
voegToe("wie", `<div class="kicker">Wie appt er meer</div><h2>Eerlijk verdeeld?</h2>
  <p class="uitleg">${n(pj.berichten)} tegen ${n(pz.berichten)} berichten.</p>
  ${split("", pj.berichten, pz.berichten, true)}
  ${split("Begint het gesprek", pj.begint_gesprek, pz.begint_gesprek)}
  ${split("Zegt “hou van je”", pj.tellers.hou_van_je, pz.tellers.hou_van_je)}
  ${POSTER ? "" : split("Zegt welterusten", pj.tellers.welterusten, pz.tellers.welterusten)}
  ${POSTER ? "" : split("Stuurt emoji's", pj.emojis, pz.emojis)}
  ${POSTER ? "" : reactie}`);

// 5. de vorm van ons (per maand)
function maandGrafiek() {
  const m = S.per_maand, max = Math.max(...m.map(x => x.aantal), 1);
  const W = POSTER ? 1000 : 360, H = POSTER ? 120 : 190, top = 34, onder = 34, gap = m.length > 18 ? 2 : (POSTER ? 10 : 5);
  const bw = (W - gap * (m.length - 1)) / m.length;
  const piek = m.findIndex(x => x.aantal === max);
  const momenten = (S.momenten || []).map((mo, i) => ({ ...mo, nr: i + 1, idx: m.findIndex(x => x.maand === mo.datum.slice(0, 7)) })).filter(mo => mo.idx >= 0);
  let svg = `<svg viewBox="0 0 ${W} ${H + top + onder}" role="img" aria-label="Berichten per maand">`;
  m.forEach((x, i) => {
    const h = Math.max(2, (H * x.aantal) / max), xpos = i * (bw + gap), y = top + H - h;
    svg += `<rect x="${xpos}" y="${y}" width="${bw}" height="${h}" rx="1.5" fill="${i === piek ? "var(--tan)" : "var(--inkt)"}"><title>${MAANDEN_LANG[+x.maand.slice(5) - 1]} ${x.maand.slice(0, 4)}: ${n(x.aantal)}</title></rect>`;
    const mi = +x.maand.slice(5) - 1;
    const toon = m.length <= 16 || i % 2 === 0;
    if (toon) svg += `<text x="${xpos + bw / 2}" y="${top + H + 16}" text-anchor="middle" font-size="11" fill="var(--inkt-zacht)" font-family="Inter, sans-serif">${MAANDEN[mi]}</text>`;
    if (i === 0 || mi === 0) svg += `<text x="${xpos + bw / 2}" y="${top + H + 30}" text-anchor="middle" font-size="10" fill="var(--inkt-zacht)" font-family="Inter, sans-serif" opacity=".7">${x.maand.slice(0, 4)}</text>`;
    if (i === piek) svg += `<text x="${xpos + bw / 2}" y="${y - 8}" text-anchor="middle" font-size="19" fill="var(--tan)" font-family="Caveat, cursive">${n(x.aantal)}</text>`;
  });
  const perIdx = {};
  momenten.forEach(mo => {
    const x = m[mo.idx], h = Math.max(2, (H * x.aantal) / max), xpos = mo.idx * (bw + gap) + bw / 2;
    const stap = (perIdx[mo.idx] = (perIdx[mo.idx] || 0) + 1) - 1;
    const boven = mo.idx === piek ? 30 : 14;
    const cy = top + H - h - boven - stap * 22;
    svg += `<circle cx="${xpos}" cy="${cy}" r="9" fill="var(--papier)" stroke="var(--tan)" stroke-width="1.5"/><text x="${xpos}" y="${cy + 4}" text-anchor="middle" font-size="11" fill="var(--tan)" font-family="Inter, sans-serif" font-weight="500">${mo.nr}</text>`;
  });
  svg += `</svg>`;
  const lijst = momenten.length ? `<ul class="momenten">${momenten.map(mo => `<li><span class="nr">${mo.nr}</span><span><span class="wat">${esc(mo.tekst)}</span> · ${datum(mo.datum)}</span></li>`).join("")}</ul>` : "";
  const piekM = m[piek];
  return { svg, lijst, piek: `${MAANDEN_LANG[+piekM.maand.slice(5) - 1]} ${piekM.maand.slice(0, 4)}` };
}
const g = maandGrafiek();
voegToe("vorm", `<div class="kicker">De vorm van ons</div><h2>Berichten per maand</h2>
  <p class="uitleg">Onze drukste maand was ${g.piek}.</p>
  <div class="grafiek">${g.svg}</div>${g.lijst}`);

// 6. onze week
function heatmap() {
  const r = S.raster_weekdag_uur, max = Math.max(...r.flat(), 1);
  let top = [0, 0]; r.forEach((rij, d) => rij.forEach((v, u) => { if (v > r[top[0]][top[1]]) top = [d, u]; }));
  const kleur = v => { const t = Math.pow(v / max, .7); return `color-mix(in srgb, var(--inkt) ${Math.round(t * 100)}%, var(--papier-donker))`; };
  let h = `<div class="heat">`;
  r.forEach((rij, d) => {
    h += `<div class="dag">${DAGEN[d]}</div>`;
    rij.forEach((v, u) => { h += `<div class="cel${d === top[0] && u === top[1] ? " top" : ""}" style="background:${kleur(v)}" title="${DAGEN_LANG[d]} ${u}:00 · ${n(v)}"></div>`; });
  });
  h += `<div></div>`;
  for (let u = 0; u < 24; u++) h += `<div class="uur${u === S.drukste_uur ? " top" : ""}">${u % 6 === 0 || u === S.drukste_uur ? u : ""}</div>`;
  return { html: h + `</div>`, top };
}
const hm = heatmap();
voegToe("week", `<div class="kicker">Onze week</div><h2>Wanneer we appen</h2>
  <p class="uitleg">Ons drukste uur is ${S.drukste_uur}:00. Het drukste moment van de week: ${DAGEN_LANG[hm.top[0]]} rond ${hm.top[1]}:00.</p>
  ${hm.html}`);

// 7. emoji
const emojiTop = S.emoji_top10.slice(0, 5), emax = emojiTop.length ? emojiTop[0].aantal : 1;
if (emojiTop.length) voegToe("emoji", `<div class="kicker">Onze emojitaal</div><h2>Top ${emojiTop.length}</h2>
  <p class="uitleg">${n(S.verschillende_emojis)} verschillende emoji's gebruikt.</p>
  <ul class="emoji-lijst">${emojiTop.map((e, i) => `<li><span class="rang">${i + 1}</span><span class="e">${e.emoji}</span><span class="staaf" style="width:${Math.max(4, 100 * e.aantal / emax)}%"></span><span class="n">${n(e.aantal)}×</span></li>`).join("")}</ul>`);

// 8. records
const nacht = pj.nachtberichten + pz.nachtberichten;
const records = [
  ["Drukste dag", `${dagnaam(S.drukste_dag.datum)} ${datum(S.drukste_dag.datum)}`, `${n(S.drukste_dag.berichten)} berichten op één dag`],
  ["Langste reeks", `${n(S.langste_reeks_dagen.dagen)} dagen achter elkaar`, `van ${datum(S.langste_reeks_dagen.van)} tot ${datum(S.langste_reeks_dagen.tot)}`],
  ["Langste stilte", S.langste_stilte.uren >= 48 ? `${(S.langste_stilte.uren / 24).toFixed(1).replace(".", ",")} dagen` : `${n(Math.round(S.langste_stilte.uren))} uur`, S.langste_stilte.van ? `rond ${datum(S.langste_stilte.van)}` : ""],
  ["Na middernacht", `${n(nacht)} berichten tussen 0:00 en 5:00`, ""],
  ["Gemiddeld", `${n(S.gemiddeld_per_dag)} berichten per dag`, "op de dagen dat we appten"],
  ["Langste bericht", `${n(Math.max(pj.langste_bericht_woorden, pz.langste_bericht_woorden))} woorden`, `door ${esc(pj.langste_bericht_woorden >= pz.langste_bericht_woorden ? JIJ : ZIJ)}`],
];
voegToe("records", `<div class="kicker">Records</div><h2>Voor in de boeken</h2>
  <ul class="records">${records.map(([w, v, k]) => `<li><div class="wat">${w}</div><div class="waarde">${v}</div>${k ? `<div class="klein">${k}</div>` : ""}</li>`).join("")}</ul>`);

// 9. brief
if (P.persoonlijke_tekst) voegToe("brief", `<div class="kicker">Wat de getallen niet zeggen</div><p class="brief">${esc(P.persoonlijke_tekst)}</p>`);

// 10. slot
let qr = "";
if (P.link_voor_qr && !window.qrcode) qr = `<div class="qr aan">${esc(P.link_voor_qr)}</div>`;
if (P.link_voor_qr && window.qrcode) {
  const q = qrcode(0, "M"); q.addData(P.link_voor_qr); q.make();
  qr = `<div class="qr aan">${q.createSvgTag({ cellSize: 4, margin: 0, scalable: true }).replace(/fill="#000000"/g, 'fill="#2f2b28"').replace(/fill="white"|fill="#ffffff"/gi, 'fill="transparent"')}scan voor de hele versie</div>`;
}
voegToe("slot", `<div class="slot"><div><p>${esc(P.afsluiter || "Op nog heel veel berichten.")}</p>
  <div class="namen">${esc(JIJ)} &amp; ${esc(ZIJ)}</div></div>${POSTER ? qr : ""}</div>
  <div class="voet">Gemaakt van ${n(S.totaal_berichten)} berichten. Geen enkel bericht staat op deze pagina, alleen de getallen.</div>`);

document.getElementById("pagina").innerHTML = blokken.join(POSTER ? "" : `<span class="scheiding"></span>`);
document.title = `${JIJ} & ${ZIJ} · ${P.titel_regel || "Eén jaar, geteld."}`;
</script>
</body>
</html>
