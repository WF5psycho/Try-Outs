    m.alb = unpackCol(prm.z, vec3(0.5)); m.rough = prm.w > 0.01 ? prm.w : 0.5;
    m.alb *= 0.92 + 0.12*vnoise3(wp*30.0 + seed);
    if (prm.w > 0.9) bump = (vec3(vnoise3(wp*8.0), vnoise3(wp*8.0 + 1.0), vnoise3(wp*8.0 + 2.0)) - 0.5)*0.8;
  }
  else if (mid == 40){
    // distant meadow hills with hedgerows and copses
    vec2 p = wp.xz;
    vec3 c = mix(vec3(0.09, 0.13, 0.04), vec3(0.14, 0.15, 0.06), fbm2(p*0.01));
    float field = hash12(floor(p/vec2(90.0, 70.0)));
    c = mix(c, vec3(0.2, 0.17, 0.08), step(0.72, field)*0.7);
    float wood = smoothstep(0.55, 0.62, fbm2(p*0.008 + 7.0));
    c = mix(c, vec3(0.025, 0.045, 0.015), wood);
    c *= 0.8 + 0.4*vnoise2(p*0.3);
    m.alb = c; m.rough = 0.85;
    bump = (vec3(vnoise3(wp*0.5), 0.0, vnoise3(wp*0.5 + 3.0)) - 0.5)*(0.3 + wood*1.5);
  }
  else if (mid == 39){
    m.alb = globeColor(normalize(lp)); m.rough = 0.25; m.spec = 0.05;
  }
  if (!hq) bump = vec3(0);
  m.n = normalize(qrot(q, normalize(ln + bump)));
  return m;
}

// ground plane material (lawn / gravel)
Mat groundMat(vec3 wp){
  Mat m; m.metal = 0.0; m.spec = 0.03; m.emit = vec3(0); m.trans = 0.0;
  vec2 p = wp.xz;
  float edge = fbm2(p*0.4)*0.8;
  float dRect = max(abs(p.x) - 16.0, abs(p.y) - 11.0);
  bool drive = p.x > -1.5 + 0.4*sin(p.y*0.05) && p.x < 4.5 + 0.4*sin(p.y*0.05) && p.y > 11.0 && p.y < 90.0;
  float g = max(step(dRect, 4.2 + edge*0.5), float(drive));
  vec3 bump;
  if (g > 0.5){
    vec2 q = p*22.0;
    vec2 ip = floor(q), fp = fract(q);
    float md = 8.0; vec2 mc = vec2(0);
    for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++){
      vec2 o = vec2(i, j); vec2 r = o + hash22(ip + o) - fp; float d = dot(r, r);
      if (d < md){ md = d; mc = ip + o; }
    }
    float h = hash12(mc);
    vec3 c = mix(vec3(0.36, 0.35, 0.32), vec3(0.52, 0.5, 0.45), h);
    c = mix(c, vec3(0.3, 0.26, 0.22), step(0.85, hash12(mc + 3.0)));
    float peb = 1.0 - smoothstep(0.0, 0.35, md);
    m.alb = c*(0.55 + 0.45*peb)*(0.85 + 0.25*fbm2(p*0.5));
    m.rough = 0.85;
    bump = vec3(hash12(mc + 1.0) - 0.5, 0.0, hash12(mc + 2.0) - 0.5)*peb*1.2;
    if (uWet > 0.0){
      float pud = smoothstep(0.55, 0.7, fbm2(p*0.25 + 4.0))*uWet;
      m.alb *= mix(1.0, 0.55, uWet); m.rough = mix(m.rough, 0.35, uWet);
      m.alb = mix(m.alb, vec3(0.02), pud*0.7); m.rough = mix(m.rough, 0.02, pud); bump *= 1.0 - pud;
    }
  } else {
    float garden = 1.0 - smoothstep(45.0, 60.0, max(abs(p.x), abs(p.y - 8.0)));
    float stripe = step(0.5, fract((p.x + 1.5)/3.2))*garden;
    vec3 c = mix(vec3(0.075, 0.13, 0.035), vec3(0.09, 0.145, 0.042), stripe);
    c = mix(vec3(0.1, 0.13, 0.045), c, garden);
    c *= 0.72 + 0.56*fbm2(p*0.9);
    c = mix(c, vec3(0.13, 0.12, 0.06), (1.0 - garden)*smoothstep(0.45, 0.8, fbm2(p*0.12 + 3.0))*0.6);
    c = mix(c, vec3(0.16, 0.16, 0.06), smoothstep(0.65, 0.9, fbm2(p*0.2 + 7.0))*0.4);
    c *= 0.8 + 0.4*vnoise2(p*60.0);
    m.alb = c; m.rough = 0.8;
    bump = (vec3(vnoise2(p*70.0), 0.0, vnoise2(p*70.0 + 3.0)) - 0.5)*1.4 + vec3(stripe - 0.5*garden, 0.0, 0.0)*0.12;
    if (uWet > 0.0){ m.alb *= mix(1.0, 0.75, uWet); m.rough = mix(m.rough, 0.45, uWet); }
  }
  m.n = normalize(vec3(0, 1, 0) + bump);
  return m;
}

// lead came pattern for leaded windows: returns 1 on lead
float glassCame(vec3 lp, vec3 ln, vec3 hs, float plain){
  if (plain > 0.5) return 0.0;
  vec2 uv = abs(ln.x) > 0.5 ? lp.zy : lp.xy;
  if (hs.x < hs.z) uv = lp.zy;
  vec2 qd = vec2(uv.x/0.13 + uv.y/0.2, -uv.x/0.13 + uv.y/0.2);
  vec2 f = abs(fract(qd) - 0.5);
  float d = 0.5 - max(f.x, f.y);
  return step(d, 0.045);
}

// ------------------------------------------------ BRDF
float G1(float nx, float a2){ return 2.0*nx/(nx + sqrt(a2 + (1.0 - a2)*nx*nx)); }
vec3 evalBRDF(Mat m, vec3 n, vec3 v, vec3 l){
  float nl = dot(n, l); if (nl <= 0.0) return vec3(0);
  float nv = max(dot(n, v), 1e-4);
  vec3 h = normalize(v + l);
  float nh = max(dot(n, h), 0.0), vh = max(dot(v, h), 0.0);
  float a = max(m.rough*m.rough, 0.0025); float a2 = a*a;
  float dd = nh*nh*(a2 - 1.0) + 1.0;
  float D = a2/(PI*dd*dd);
  float G = G1(nl, a2)*G1(nv, a2);
  vec3 F0 = mix(vec3(m.spec), m.alb, m.metal);
  vec3 F = F0 + (1.0 - F0)*pow(1.0 - vh, 5.0);
  vec3 spec = D*G*F/(4.0*nl*nv);
  vec3 diff = (1.0 - m.metal)*m.alb/PI*(1.0 - m.spec);
  return diff + spec;
}
void onb(vec3 n, out vec3 b1, out vec3 b2){
  float s = n.z >= 0.0 ? 1.0 : -1.0; float a = -1.0/(s + n.z); float b = n.x*n.y*a;
  b1 = vec3(1.0 + s*n.x*n.x*a, s*b, -s*n.x); b2 = vec3(b, s + n.y*n.y*a, -n.y);
}
vec3 sampleVNDF(vec3 Ve, float a, vec2 u){
  vec3 Vh = normalize(vec3(a*Ve.x, a*Ve.y, Ve.z));
  float lensq = Vh.x*Vh.x + Vh.y*Vh.y;
  vec3 T1 = lensq > 0.0 ? vec3(-Vh.y, Vh.x, 0.0)*inversesqrt(lensq) : vec3(1, 0, 0);
  vec3 T2 = cross(Vh, T1);
  float r = sqrt(u.x); float phi = 2.0*PI*u.y;
  float t1 = r*cos(phi), t2 = r*sin(phi);
  float s = 0.5*(1.0 + Vh.z);
  t2 = (1.0 - s)*sqrt(1.0 - t1*t1) + s*t2;
  vec3 Nh = t1*T1 + t2*T2 + sqrt(max(0.0, 1.0 - t1*t1 - t2*t2))*Vh;
  return normalize(vec3(a*Nh.x, a*Nh.y, max(0.0, Nh.z)));
}
float specProb(Mat m, float nv){
  vec3 F0 = mix(vec3(m.spec), m.alb, m.metal);
  float Fv = lum(F0 + (1.0 - F0)*pow(1.0 - nv, 5.0));
  if (m.metal > 0.9) return 1.0;
  float d = lum(m.alb)*(1.0 - m.metal);
  return clamp(Fv/(Fv + d + 1e-4), 0.08, 0.92);
}
// returns direction; weight = f*cos/pdf
vec3 sampleBRDF(Mat m, vec3 n, vec3 v, out vec3 w, out bool specular){
  vec3 b1, b2; onb(n, b1, b2);
  float nv = max(dot(n, v), 1e-4);
  float ps = specProb(m, nv);
  float a = max(m.rough*m.rough, 0.0025);
  vec3 l;
  specular = rnd() < ps;
  if (specular){
    vec3 Ve = vec3(dot(v, b1), dot(v, b2), nv);
    vec3 H = sampleVNDF(Ve, a, vec2(rnd(), rnd()));
    vec3 h = H.x*b1 + H.y*b2 + H.z*n;
    l = reflect(-v, h);
  } else {
    float r1 = rnd(), r2 = rnd();
    float r = sqrt(r1), ph = 2.0*PI*r2;
    l = r*cos(ph)*b1 + r*sin(ph)*b2 + sqrt(max(0.0, 1.0 - r1))*n;
  }
  float nl = dot(n, l);
  if (nl <= 0.0){ w = vec3(0); return l; }
  vec3 h = normalize(v + l);
  float nh = max(dot(n, h), 0.0);
  float a2 = a*a; float dd = nh*nh*(a2 - 1.0) + 1.0; float D = a2/(PI*dd*dd);
  float pdfS = D*G1(nv, a2)/(4.0*nv);
  float pdfD = nl/PI;
  float pdf = ps*pdfS + (1.0 - ps)*pdfD;
  w = evalBRDF(m, n, v, l)*nl/max(pdf, 1e-6);
  w = min(w, vec3(20.0));
  return l;
}

// ------------------------------------------------ shadows (any-hit with transmission)
vec3 transmit(int id, vec3 lp, vec3 ln, int fl){
  if ((fl & 8) != 0) return vec3(0.35);
  vec4 b = texelFetch(uPrims, pUV(id, 1), 0);
  vec4 d = texelFetch(uPrims, pUV(id, 3), 0);
  if (int(b.w + 0.5) == 12) return (1.0 - glassCame(lp, ln, b.xyz, d.w))*vec3(0.84, 0.87, 0.82);
  return unpackCol(d.z, vec3(0.62, 0.56, 0.46))*0.45;
}
bool shadowBoxes(vec3 ro, vec3 rd, vec3 inv, float tmax, int root, inout vec3 T){
  int stack[32]; int sp = 0; stack[sp++] = root;
  while (sp > 0){
    int ni = stack[--sp];
    for (int c = 0; c < 2; c++){
      vec4 n0 = texelFetch(uNodes, nUV(ni, c*2), 0), n1 = texelFetch(uNodes, nUV(ni, c*2 + 1), 0);
      vec2 tt = aabb(n0.xyz, n1.xyz, ro, inv);
      if (tt.x > tt.y || tt.y < 0.0 || tt.x > tmax) continue;
      if (n1.w < 0.5){ stack[sp++] = int(n0.w + 0.5); continue; }
      int s = int(n0.w + 0.5), cnt = int(n1.w + 0.5);
      for (int i = 0; i < cnt; i++){
        vec3 lp, ln; int fl;
        float t = boxHit(s + i, ro, rd, 1e-4, lp, ln, fl);
        if (t > 0.0 && t < tmax && (fl & 5) == 0){
          if ((fl & 2) == 0) return false;
          T *= transmit(s + i, lp, ln, fl);
          if (max(T.x, max(T.y, T.z)) < 0.01) return false;
        }
      }
    }
  }
  return true;
}
bool shadowRounded(vec3 ro, vec3 rd, vec3 inv, float tmax, int root, inout vec3 T){
  int stack[32]; int sp = 0; stack[sp++] = root;
  while (sp > 0){
    int ni = stack[--sp];
    for (int c = 0; c < 2; c++){
      vec4 n0 = texelFetch(uNodes, nUV(ni, c*2), 0), n1 = texelFetch(uNodes, nUV(ni, c*2 + 1), 0);
      vec2 tt = aabb(n0.xyz, n1.xyz, ro, inv);
      if (tt.x > tt.y || tt.y < 0.0 || tt.x > tmax) continue;
      if (n1.w < 0.5){ stack[sp++] = int(n0.w + 0.5); continue; }
      int s = int(n0.w + 0.5), cnt = int(n1.w + 0.5);
      for (int i = 0; i < cnt; i++){
        vec3 lp, ln; int fl;
        float t = rboxHit(s + i, ro, rd, 1e-4, lp, ln, fl);
        if (t > 0.0 && t < tmax && (fl & 5) == 0){
          if ((fl & 2) == 0) return false;
          T *= transmit(s + i, lp, ln, fl);
          if (max(T.x, max(T.y, T.z)) < 0.01) return false;
        }
      }
    }
  }
  return true;
}
bool shadowShapes(vec3 ro, vec3 rd, vec3 inv, float tmax, int root, inout vec3 T){
  int stack[32]; int sp = 0; stack[sp++] = root;
  while (sp > 0){
    int ni = stack[--sp];
    for (int c = 0; c < 2; c++){
      vec4 n0 = texelFetch(uNodes, nUV(ni, c*2), 0), n1 = texelFetch(uNodes, nUV(ni, c*2 + 1), 0);
      vec2 tt = aabb(n0.xyz, n1.xyz, ro, inv);
      if (tt.x > tt.y || tt.y < 0.0 || tt.x > tmax) continue;
      if (n1.w < 0.5){ stack[sp++] = int(n0.w + 0.5); continue; }
      int s = int(n0.w + 0.5), cnt = int(n1.w + 0.5);
      for (int i = 0; i < cnt; i++){
        vec3 lp, ln; int fl;
        float t = primHit(s + i, ro, rd, 1e-4, lp, ln, fl);
        if (t > 0.0 && t < tmax && (fl & 5) == 0){
          if ((fl & 2) == 0) return false;
          T *= transmit(s + i, lp, ln, fl);
          if (max(T.x, max(T.y, T.z)) < 0.01) return false;
        }
      }
    }
  }
  return true;
}

vec3 shadowT(vec3 ro, vec3 rd, float tmax){
  vec3 T = vec3(1);
  if (rd.y < 0.0){ float tg = (GROUND_Y - ro.y)/rd.y; if (tg > 1e-4 && tg < tmax) return vec3(0); }
  vec3 inv = 1.0/vec3(abs(rd.x) < 1e-9 ? 1e-9 : rd.x, abs(rd.y) < 1e-9 ? 1e-9 : rd.y, abs(rd.z) < 1e-9 ? 1e-9 : rd.z);
  if (!shadowBoxes(ro, rd, inv, tmax, uRoot0, T)) return vec3(0);
  if (!shadowRounded(ro, rd, inv, tmax, uRoot1, T)) return vec3(0);
  if (!shadowShapes(ro, rd, inv, tmax, uRoot2, T)) return vec3(0);
  return T;
}

// ------------------------------------------------ sky
vec3 skyLUT(vec3 rd){
  float el = asin(clamp(rd.y, 0.0, 1.0));
  float u = atan(rd.z, rd.x)/(2.0*PI) + 0.5;
  float v = sqrt(el/(0.5*PI));
  return texture(uSky, vec2(u, v)).rgb;
}
float cloudDensity(vec2 p){
  float n = fbm2(p);
  float cov = uCloud;
  return smoothstep(1.0 - cov - 0.08, 1.0 - cov + 0.28, n + 0.15*cov);
}
vec2 cloudCoord(vec3 rd){ return rd.xz/max(rd.y, 0.03)*0.55 + uCloudOff; }
float cloudShadow(vec3 p){
  if (uCloud < 0.02 || uSunDir.y <= 0.0) return 1.0;
  vec2 c = cloudCoord(uSunDir) + p.xz*0.00035;
  float d = cloudDensity(c);
  return 1.0 - d*mix(0.8, 0.97, uCloud);
}
vec3 skyFull(vec3 rd){
  vec3 s = skyLUT(rd);
  if (rd.y > 0.0){
    // distant tree line and hills
    float az = atan(rd.z, rd.x);
    float el = asin(rd.y);
    float hill = 0.012 + 0.018*vnoise2(vec2(az*2.0, 1.0)) + 0.01*vnoise2(vec2(az*7.0, 3.0));
    float trees = hill + 0.012*vnoise2(vec2(az*40.0, 5.0)) + 0.006*vnoise2(vec2(az*160.0, 7.0));
    if (el < trees){
      vec3 hz = skyLUT(normalize(vec3(rd.x, 0.02, rd.z)));
      vec3 amb = skyLUT(vec3(0, 1, 0))*0.6 + uSunE*max(uSunDir.y, 0.0)*0.05;
      vec3 fol = vec3(0.04, 0.06, 0.03)*amb*(0.7 + 0.6*vnoise2(vec2(az*300.0, el*300.0)));
      float haze = 0.62 + 0.3*uHaze;
      return mix(fol, hz, haze);
    }
    if (uCloud > 0.01){
      float d = cloudDensity(cloudCoord(rd));
      d *= smoothstep(0.0, 0.12, rd.y);
      float mu = max(dot(rd, uSunDir), 0.0);
      float thick = fbm2(cloudCoord(rd)*2.0 + 3.0);
      vec3 lit = uSunEClear*(0.06 + 0.35*pow(mu, 8.0))*(1.0 - 0.55*thick)*mix(1.0, 0.25, uCloud*uCloud);
      vec3 amb = skyLUT(vec3(0, 1, 0))*2.2 + skyLUT(normalize(vec3(rd.x, 0.1, rd.z)))*0.5;
      vec3 cc = lit + amb*(0.7 - 0.3*thick);
      s = mix(s, cc, d);
    }
  }
  return s;
}

// ------------------------------------------------ direct lighting (NEE)
vec3 sampleCone(vec3 dir, float cosMax){
  float u1 = rnd(), u2 = rnd();
  float ct = 1.0 - u1*(1.0 - cosMax); float st = sqrt(max(0.0, 1.0 - ct*ct)); float ph = 2.0*PI*u2;
  vec3 b1, b2; onb(dir, b1, b2);
  return normalize(b1*cos(ph)*st + b2*sin(ph)*st + dir*ct);
}
vec3 direct(vec3 p, vec3 gn, Mat m, vec3 v, bool portals){
  vec3 L = vec3(0);
  vec3 n = m.n;
  vec3 po = p + gn*2e-3;
  // sun
  if (uSunDir.y > -0.02 && lum(uSunE) > 1e-5){
    vec3 l = sampleCone(uSunDir, uSunCos);
    float nl = dot(n, l);
    if (nl > 0.0 && dot(gn, l) > 0.0){
      vec3 f = evalBRDF(m, n, v, l);
      if (lum(f) > 0.0){
        vec3 T = shadowT(po, l, 1e4);
        if (lum(T) > 0.0) L += T*uSunE*cloudShadow(p)*f*nl;
      }
    }
  }
  // local lights: pick one by importance
  int room = roomId(p);
  if (uNumLights > 0){
    float wsum = 0.0;
    for (int i = 0; i < 48; i++){
      if (i >= uNumLights) break;
      vec3 d = uLightPos[i].xyz - p; float r = uLightPos[i].w;
      float w = uLightCol[i].w/max(dot(d, d), r*r*4.0)*(roomId(uLightPos[i].xyz) == room ? 1.0 : 0.02);
      wsum += w;
    }
    if (wsum > 0.0){
      float x = rnd()*wsum; int sel = 0; float wsel = 0.0; float acc = 0.0;
      for (int i = 0; i < 48; i++){
        if (i >= uNumLights) break;
        vec3 d = uLightPos[i].xyz - p; float r = uLightPos[i].w;
        float w = uLightCol[i].w/max(dot(d, d), r*r*4.0)*(roomId(uLightPos[i].xyz) == room ? 1.0 : 0.02);
        acc += w; sel = i; wsel = w;
        if (acc >= x) break;
      }
      vec3 c = uLightPos[sel].xyz; float r = uLightPos[sel].w;
      vec3 d = c - p; float d2 = dot(d, d);
      if (d2 > r*r*1.01){
        float dist = sqrt(d2);
        float cosMax = sqrt(max(0.0, 1.0 - r*r/d2));
        vec3 l = sampleCone(d/dist, cosMax);
        float nl = dot(n, l);
        if (nl > 0.0 && dot(gn, l) > 0.0){
          float pdf = 1.0/(2.0*PI*(1.0 - cosMax));
          vec3 Le = uLightCol[sel].rgb/(4.0*PI*PI*r*r);
          vec3 T = shadowT(po, l, dist - r);
          L += T*Le*evalBRDF(m, n, v, l)*nl/pdf/(wsel/wsum);
        }
      }
    }
  }
  // skylight through window portals (interior points only; BSDF rays escaping to the sky are then ignored)
  if (portals && room != 0 && uNumPortals > 0){
    float wsum = 0.0;
    for (int i = 0; i < 16; i++){
      if (i >= uNumPortals) break;
      vec4 C = uPortal[i*3]; vec3 U = uPortal[i*3 + 1].xyz, Vv = uPortal[i*3 + 2].xyz;
      vec3 N = normalize(cross(U, Vv))*uPortal[i*3 + 1].w;
      vec3 d = p - C.xyz; float dd = dot(d, d);
      float w = C.w*max(dot(N, d), 0.0)/(dd*sqrt(dd) + 0.05);
      wsum += w;
    }
    if (wsum > 0.0){
      float x = rnd()*wsum; int sel = 0; float wsel = 0.0; float acc = 0.0;
      for (int i = 0; i < 16; i++){
        if (i >= uNumPortals) break;
        vec4 C = uPortal[i*3]; vec3 U = uPortal[i*3 + 1].xyz, Vv = uPortal[i*3 + 2].xyz;
        vec3 N = normalize(cross(U, Vv))*uPortal[i*3 + 1].w;
        vec3 d = p - C.xyz; float dd = dot(d, d);
        float w = C.w*max(dot(N, d), 0.0)/(dd*sqrt(dd) + 0.05);
        acc += w; sel = i; wsel = w;
        if (acc >= x) break;
      }
      vec4 C = uPortal[sel*3]; vec3 U = uPortal[sel*3 + 1].xyz, Vv = uPortal[sel*3 + 2].xyz;
      vec3 N = normalize(cross(U, Vv))*uPortal[sel*3 + 1].w;
      vec3 s = C.xyz + (rnd()*2.0 - 1.0)*U + (rnd()*2.0 - 1.0)*Vv;
      vec3 d = s - p; float dist = length(d); vec3 l = d/dist;
      float cp = dot(N, -l);
      float nl = dot(n, l);
      if (cp > 0.0 && nl > 0.0 && dot(gn, l) > 0.0 && l.y > 0.0){
        float pdf = dist*dist/(C.w*cp)*(wsel/wsum);
        vec3 f = evalBRDF(m, n, v, l);
        vec3 T = shadowT(po, l, 1e4);
        vec3 c = T*skyLUT(l)*f*nl/pdf;
        L += min(c, vec3(4.0));
      }
    }
  }
  return L;
}

float phaseHG(float mu, float g){ return (1.0 - g*g)/(4.0*PI*pow(1.0 + g*g - 2.0*g*mu, 1.5)); }

// primary-segment media: exterior aerial perspective + interior dust shafts
void primaryMedia(vec3 ro, vec3 rd, float tEnd, inout vec3 L, inout vec3 thr){
  vec3 bmn = vec3(-15.0, 0.0, -10.0), bmx = vec3(15.0, 10.8, 10.0);
  vec3 inv = 1.0/vec3(abs(rd.x) < 1e-9 ? 1e-9 : rd.x, abs(rd.y) < 1e-9 ? 1e-9 : rd.y, abs(rd.z) < 1e-9 ? 1e-9 : rd.z);
  vec2 bi = aabb(bmn, bmx, ro, inv);
  float a = max(bi.x, 0.0), b = min(bi.y, tEnd);
  float inLen = max(b - a, 0.0);
  float outLen = max(tEnd - inLen, 0.0);
  if (uDust > 0.0 && inLen > 0.0 && lum(uSunE) > 1e-4){
    float ts = a + rnd()*inLen;
    vec3 ps = ro + rd*ts;
    vec3 T = shadowT(ps, uSunDir, 1e4);
    float sig = uDust*0.0003;
    L += min(thr*T*uSunE*cloudShadow(ps)*phaseHG(dot(rd, uSunDir), 0.6)*sig*inLen, vec3(0.02));
  }
  float sigF = 0.00012 + uHaze*uHaze*0.02;
  float Tf = exp(-outLen*sigF);
  if (outLen > 0.0 && Tf < 0.999){
    vec3 hz = skyLUT(normalize(vec3(rd.x, 0.05, rd.z)));
    vec3 insF = hz*(1.0 - Tf) + uSunE*cloudShadow(ro)*phaseHG(dot(rd, uSunDir), 0.7)*0.4*(1.0 - Tf)*sigF*400.0/(1.0 + sigF*400.0);
    L += thr*insF;
    thr *= Tf;
  }
}


vec3 flameEmit(vec3 lp, vec3 hs, float seed, bool candle){
  vec3 u = lp/hs;
  float y = u.y*0.5 + 0.5;
  if (candle){
    float core = smoothstep(1.0, 0.0, length(u*vec3(1.0, 0.8, 1.0)));
    vec3 c = mix(vec3(1.0, 0.45, 0.12), vec3(1.0, 0.9, 0.7), core);
    c = mix(c, vec3(0.2, 0.3, 1.0), smoothstep(0.3, 0.0, y)*0.4);
    return c*core*uLampI*2.5*uCandleCol;
  }
  float n = fbm3l(vec3(u.x*1.6 + seed, u.y*1.2 - uTime*2.2, u.z*1.6));
  float n2 = vnoise3(vec3(u.x*4.0, u.y*3.0 - uTime*4.0, u.z*4.0 + seed));
  float r = length(u.xz)*(0.8 + 0.6*y);
  float dens = clamp((1.0 - r) + (n - 0.5)*1.6 + (n2 - 0.5)*0.5 - y*0.9, 0.0, 1.0);
  dens = pow(dens, 1.5);
  vec3 hot = vec3(1.0, 0.82, 0.5), mid = vec3(1.0, 0.45, 0.1), cool = vec3(0.7, 0.14, 0.02);
  vec3 c = mix(hot, mid, smoothstep(0.1, 0.5, y + (0.5 - dens)*0.5));
  c = mix(c, cool, smoothstep(0.5, 0.95, y));
  return c*dens*uFireI*2.6;
}

void main(){
  ivec2 pix = ivec2(gl_FragCoord.xy);
  rs = uint(pix.x)*1973u + uint(pix.y)*9277u + uint(uFrame)*26699u;
  rs = rs ^ (rs >> 13u); rnd(); rnd();
  vec2 jit = vec2(rnd(), rnd()) - 0.5;
  vec2 ndc = ((gl_FragCoord.xy + jit)/uRes)*2.0 - 1.0;
  float aspect = uRes.x/uRes.y;
  vec3 ro = uCamPos;
  vec3 rd = normalize(uCamFwd + ndc.x*aspect*uTanHalf*uCamRight + ndc.y*uTanHalf*uCamUp);

  vec3 L = vec3(0), thr = vec3(1);
  bool chain = true;
  bool gSet = false;
  vec3 gAlb = vec3(1), gN = -rd, gEmis = vec3(0); float gDist = 1e4;
  float pathLen = 0.0;
  int bounce = 0;
  bool portalDone = false;
  bool first = true;
  bool primarySeg = true;
  vec3 camRo = ro, camRd = rd;

  for (int step = 0; step < 24; step++){
    Hit h;
    bool hit = trace(ro, rd, 1e5, chain, h);

    if (!hit){
      if (primarySeg){ primaryMedia(camRo, camRd, pathLen + 1500.0, L, thr); primarySeg = false; }
      if (!chain && portalDone) break;
      vec3 sky = chain ? skyFull(rd) : skyLUT(rd);
      if (bounce > 0) sky *= min(1.0, uIndClamp/max(lum(thr*sky), 1e-9));
      if (chain && dot(rd, uSunDir) > uSunCos){
        float sunOmega = 2.0*PI*(1.0 - uSunCos);
        float cs = 1.0;
        if (uCloud > 0.01) cs = 1.0 - cloudDensity(cloudCoord(rd));
        sky += min(uSunE/sunOmega*cs, vec3(3e4));
      }
      L += thr*sky;
      if (!gSet){ gSet = true; gAlb = vec3(1); gN = -rd; gDist = 1e4; gEmis = L; }
      break;
    }

    vec3 wp = ro + rd*h.t;
    pathLen += h.t;
    Mat m; vec3 gn;
    int mid;
    if (h.id == -2){
      m = groundMat(wp); gn = vec3(0, 1, 0); mid = 19;
    } else {
      vec4 pa = texelFetch(uPrims, pUV(h.id, 0), 0);
      vec4 pb = texelFetch(uPrims, pUV(h.id, 1), 0);
      vec4 pq = texelFetch(uPrims, pUV(h.id, 2), 0);
      vec4 pd = texelFetch(uPrims, pUV(h.id, 3), 0);
      int type = int(pa.w + 0.5) & 7;
      int pflags = (int(pa.w + 0.5) >> 3) & 31;
      mid = int(pb.w + 0.5);
      if ((pflags & 8) != 0){
        // porous foliage volume: march for leaf clumps, pass through otherwise
        vec3 o = qinv(pq, ro - pa.xyz), d = qinv(pq, rd);
        vec2 te = iEll2(o, d, pb.xyz);
        float t0 = max(te.x, 0.0), t1 = te.y;
        float dt = (t1 - t0)/12.0;
        float jit = rnd();
        float tl = -1.0; vec3 nl = vec3(0, 1, 0);
        for (int k = 0; k < 12; k++){
          float tk = t0 + (float(k) + jit)*dt;
          vec3 pk = o + d*tk;
          vec3 u = pk/pb.xyz;
          float dens = vnoise3(pk*2.2 + pa.xyz)*0.65 + vnoise3(pk*7.0 + pa.xyz)*0.35 - dot(u, u)*0.5;
          if (dens > 0.33){ tl = tk; nl = normalize(u*0.8 + (vec3(vnoise3(pk*5.0), vnoise3(pk*5.0 + 2.0), vnoise3(pk*5.0 + 5.0)) - 0.5)*1.6); break; }
        }
        if (tl < 0.0){ ro = ro + rd*(t1 + 1e-3); pathLen += t1 - h.t; continue; }
        pathLen += tl - h.t;
        wp = ro + rd*tl;
        h.ln = nl; h.lp = o + d*tl;
      }
      if (mid == 15 || mid == 17){
        // emissive flame volume: integrate along chord, continue through
        vec3 o = qinv(pq, ro - pa.xyz), d = qinv(pq, rd);
        vec2 te = iEll2(o, d, pb.xyz);
        float t0 = max(te.x, 0.0), t1 = te.y;
        vec3 e = vec3(0);
        for (int k = 0; k < 3; k++){
          float tk = mix(t0, t1, (float(k) + 0.5)/3.0);
          e += flameEmit(o + d*tk, pb.xyz, pd.y, mid == 17);
        }
        float chord = (t1 - t0)/(2.0*max(max(pb.x, pb.y), pb.z));
        L += thr*e/3.0*clamp(chord*2.0, 0.0, 1.5);
        ro = ro + rd*(t1 + 1e-4);
        pathLen += t1 - h.t;
        continue;
      }
      m = getMat(mid, wp, h.lp, h.ln, pb.xyz, pd, pq, type, bounce == 0);
      gn = normalize(qrot(pq, h.ln));
      if (mid == 12){
        float came = glassCame(h.lp, h.ln, pb.xyz, pd.w);
        if (came < 0.5){
          if (dot(gn, rd) > 0.0) gn = -gn;
          float c = abs(dot(gn, rd));
          float F = 0.04 + 0.96*pow(1.0 - c, 5.0);
          F = min(1.0, F*1.9);
          if (rnd() < F){ rd = reflect(rd, gn); ro = wp + gn*1e-3; }
          else {
            // old glass: slight waviness
            vec3 wob = (vec3(vnoise3(wp*9.0), vnoise3(wp*9.0 + 3.0), vnoise3(wp*9.0 + 6.0)) - 0.5)*0.012*(1.0 - pd.w);
            rd = normalize(rd + wob);
            ro = wp + rd*2e-3;
            thr *= vec3(0.9, 0.93, 0.88);
          }
          continue;
        }
      }
    }
    if (primarySeg){ primaryMedia(camRo, camRd, pathLen, L, thr); primarySeg = false; }
    if (dot(gn, rd) > 0.0) gn = -gn;
    if (dot(m.n, gn) < 0.0) m.n = normalize(m.n - gn*dot(m.n, gn)*1.01);
    vec3 v = -rd;
    if (dot(m.n, v) < 0.0) m.n = normalize(m.n + gn*(0.01 - dot(m.n, v)));

    if (chain) L += thr*m.emit;
    if (!gSet){
      gSet = true;
      gAlb = thr*m.alb;
      gAlb = max(gAlb, vec3(0.004));
      gN = gn; gDist = pathLen; gEmis = L;
    }
    if (bounce >= uMaxBounce) break;

    bool deltaLike = m.rough < 0.1 && (m.metal > 0.5 || mid == 33);
    bool usePortals = bounce <= 1;
    portalDone = !deltaLike && usePortals && roomId(wp) != 0 && uNumPortals > 0;
    if (!deltaLike){
      vec3 c = thr*direct(wp, gn, m, v, usePortals);
      if (bounce > 0) c *= min(1.0, uIndClamp/max(lum(c), 1e-9));
      L += c;
    }

    vec3 w; bool spec;
    vec3 nd = sampleBRDF(m, m.n, v, w, spec);
    if (dot(nd, gn) <= 0.0 || lum(w) <= 0.0) break;
    thr *= w;
    chain = chain && spec && m.rough < 0.1;
    ro = wp + gn*2e-3;
    rd = nd;
    bounce++;
    if (bounce > 2){
      float pr = clamp(max(thr.x, max(thr.y, thr.z)), 0.05, 0.95);
      if (rnd() > pr) break;
      thr /= pr;
    }
  }
  L = min(L, vec3(6e4));
  if (any(isnan(L)) || any(isinf(L))) L = vec3(0);
  if (!gSet){ gEmis = L; }
  if (any(isnan(gAlb)) || any(isnan(gN)) || any(isnan(gEmis)) || dot(gN, gN) < 1e-8){ gAlb = vec3(1); gN = -camRd; gEmis = L; }
  vec4 prev0 = texelFetch(uPrev0, pix, 0), prev1 = texelFetch(uPrev1, pix, 0), prev2 = texelFetch(uPrev2, pix, 0), prev3 = texelFetch(uPrev3, pix, 0);
  if (uDebug == 1){ L = gAlb*0.18; gEmis = L; }
  float il = lum(max(L - gEmis, 0.0)/max(gAlb, vec3(0.004)));
  o0 = vec4(mix(prev0.rgb, L, uBlend), mix(prev0.a, il*il, uBlend));
  o1 = vec4(mix(prev1.rgb, gAlb, uBlend), 1.0);
  o2 = mix(prev2, vec4(gN, min(gDist, 1e4)), uBlend);
  o3 = vec4(mix(prev3.rgb, min(gEmis, L), uBlend), mix(prev3.a, il, uBlend));
}`;

// ---------------------------------------------------------------- denoiser (edge-aware a-trous on demodulated illumination)
SH.denoise = `#version 300 es
precision highp float;
uniform sampler2D uIn;      // illumination (or radiance on first pass)
uniform sampler2D uAlb, uND, uEm, uMom;
uniform int uStep;
uniform int uFirst;
uniform float uSigL;        // user strength
uniform float uSpp;
uniform float uPass;
uniform float uLumRef;
uniform vec3 uCamPos, uCamFwd, uCamRight, uCamUp;
uniform float uTanHalf;
uniform vec2 uRes;
out vec4 o;
float lum(vec3 c){ return dot(c, vec3(0.2126, 0.7152, 0.0722)); }
vec3 illum(ivec2 p){
  if (uFirst == 1){
    vec3 r = texelFetch(uIn, p, 0).rgb, a = texelFetch(uAlb, p, 0).rgb, e = texelFetch(uEm, p, 0).rgb;
    vec3 il = min(max(r - e, 0.0)/max(a, vec3(0.004)), vec3(1e5));
    return (any(isnan(il)) || any(isinf(il))) ? vec3(0) : il;
  }
  return texelFetch(uIn, p, 0).rgb;
}
float varAt(ivec2 p){
  float m1 = texelFetch(uEm, p, 0).a, m2 = texelFetch(uMom, p, 0).a;
  return max(m2 - m1*m1, 0.0)/uSpp;
}
vec3 wpos(ivec2 p, float dist){
  vec2 ndc = (vec2(p) + 0.5)/uRes*2.0 - 1.0;
  vec3 rd = normalize(uCamFwd + ndc.x*(uRes.x/uRes.y)*uTanHalf*uCamRight + ndc.y*uTanHalf*uCamUp);
  return uCamPos + rd*dist;
}
void main(){
  ivec2 p = ivec2(gl_FragCoord.xy);
  ivec2 sz = ivec2(uRes);
  vec4 nd = texelFetch(uND, p, 0);
  vec3 c0 = illum(p);
  if (uFirst == 1){
    // outlier (firefly / dead pixel) rejection against the 3x3 neighbourhood
    float mx = 0.0, mn = 1e20;
    for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++){
      if (i == 0 && j == 0) continue;
      ivec2 q = clamp(p + ivec2(i, j), ivec2(0), sz - 1);
      if (texelFetch(uND, q, 0).w > 9000.0) continue;
      float lq = lum(illum(q)); mx = max(mx, lq); mn = min(mn, lq);
    }
    float l = lum(c0);
    if (nd.w < 9000.0 && uSigL > 0.0){
      float hi = 2.5*mx + 1e-6, lo = 0.3*min(mn, 1e19);
      if (l > hi) c0 *= hi/l;
      else if (l < lo) c0 = l > 1e-9 ? c0*(lo/l) : vec3(lo);
    }
    o = vec4(c0, 1.0); return;
  }
  if (nd.w > 9000.0 || uSigL <= 0.0){ o = vec4(c0, 1.0); return; }
  vec3 n0 = nd.xyz/max(length(nd.xyz), 1e-6);
  vec3 p0 = wpos(p, nd.w);
  float l0 = lum(c0);
  vec3 a0 = texelFetch(uAlb, p, 0).rgb;
  // 3x3 prefiltered variance of the mean
  float v = 0.0, lm = 0.0;
  for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++){
    ivec2 q = clamp(p + ivec2(i, j), ivec2(0), sz - 1);
    float w = (i == 0 && j == 0) ? 0.25 : (i == 0 || j == 0 ? 0.125 : 0.0625);
    v += varAt(q)*w;
    lm += lum(illum(q))*w;
  }
  float sig = uSigL*(4.0*sqrt(v) + 2.0*lm/sqrt(uSpp) + 1.5*uLumRef/sqrt(uSpp))*pow(0.65, uPass) + 1e-6;
  const float k[3] = float[3](0.375, 0.25, 0.0625);
  vec3 sum = vec3(0); float ws = 0.0;
  for (int j = -2; j <= 2; j++) for (int i = -2; i <= 2; i++){
    ivec2 q = p + ivec2(i, j)*uStep;
    if (q.x < 0 || q.y < 0 || q.x >= sz.x || q.y >= sz.y) continue;
    vec4 ndq = texelFetch(uND, q, 0);
    if (ndq.w > 9000.0) continue;
    vec3 cq = illum(q);
    float wn = pow(max(dot(n0, ndq.xyz/max(length(ndq.xyz), 1e-6)), 0.0), 32.0);
    vec3 pq = wpos(q, ndq.w);
    float wp = exp(-abs(dot(n0, pq - p0))/(0.004 + 0.01*nd.w));
    float wl = exp(-abs(l0 - lum(cq))/sig);
    vec3 aq = texelFetch(uAlb, q, 0).rgb;
    float wa = exp(-length(aq - a0)/(0.08*(lum(a0) + lum(aq)) + 0.01)*1.5);
    float w = k[abs(i)]*k[abs(j)]*wn*wp*wl*wa;
    sum += cq*w; ws += w;
  }
  o = vec4(sum/max(ws, 1e-9), 1.0);
}`;

// ---------------------------------------------------------------- composite (to HDR + log-luminance for exposure)
SH.composite = `#version 300 es
precision highp float;
uniform sampler2D uIllum, uAlb, uEm, uRad;
uniform int uRaw;
out vec4 o;
float lum(vec3 c){ return dot(c, vec3(0.2126, 0.7152, 0.0722)); }
void main(){
  ivec2 p = ivec2(gl_FragCoord.xy);
  vec3 c;
  if (uRaw == 1) c = texelFetch(uRad, p, 0).rgb;
  else c = texelFetch(uIllum, p, 0).rgb*texelFetch(uAlb, p, 0).rgb + texelFetch(uEm, p, 0).rgb;
  c = min(c, vec3(6e4));
  if (any(isnan(c)) || any(isinf(c)) || !(lum(c) >= 0.0)) c = vec3(0);
  c = max(c, vec3(0));
  o = vec4(c, log(max(lum(c), 1e-5)));
}`;

// ---------------------------------------------------------------- final tonemap
SH.final = `#version 300 es
precision highp float;
uniform sampler2D uHDR;
uniform float uExposure;
uniform float uBloom;
uniform vec2 uOut;
uniform float uLevels;
uniform float uGrain;
uniform int uFrame;
uniform float uLocal;
out vec4 o;
vec3 RRTAndODTFit(vec3 v){ vec3 a = v*(v + 0.0245786) - 0.000090537; vec3 b = v*(0.983729*v + 0.4329510) + 0.238081; return a/b; }
vec3 aces(vec3 c){
  const mat3 I = mat3(0.59719, 0.07600, 0.02840, 0.35458, 0.90834, 0.13383, 0.04823, 0.01566, 0.83777);
  const mat3 O = mat3(1.60475, -0.10208, -0.00327, -0.53108, 1.10813, -0.07276, -0.07367, -0.00605, 1.07602);
  c = I*c; c = RRTAndODTFit(c); c = O*c; return clamp(c, 0.0, 1.0);
}
float lum(vec3 c){ return dot(c, vec3(0.2126, 0.7152, 0.0722)); }
float h12(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y)*p3.z); }
void main(){
  vec2 uv = gl_FragCoord.xy/uOut;
  vec3 c = texture(uHDR, uv).rgb;
  vec3 b = vec3(0);
  float wsum = 0.0;
  for (int i = 2; i < 8; i++){
    float lv = float(i); if (lv > uLevels) break;
    float w = 1.0/float(i);
    b += textureLod(uHDR, uv, lv).rgb*w; wsum += w;
  }
  b /= max(wsum, 1e-4);
  c = mix(c, b, uBloom);
  // local tone mapping (exposure-fusion style): pull bright regions such as windows down, lift deep shadows slightly
  float la = textureLod(uHDR, uv, max(uLevels - 4.0, 1.0)).a, lb = textureLod(uHDR, uv, max(uLevels - 2.5, 1.0)).a;
  float lg = textureLod(uHDR, uv, uLevels).a;
  float dl = 0.5*(la + lb) - lg;
  c *= exp(-uLocal*(0.55*max(dl, 0.0) + 0.12*min(dl, 0.0)));
  // camera auto white balance: partial grey-world on the scene average, slightly warm
  vec3 avg = max(textureLod(uHDR, vec2(0.5), uLevels).rgb, vec3(1e-6));
  // only correct cold (blue/green) casts; keep warm lamp/fire/stone moods intact
  vec3 wbv = vec3(lum(avg))/avg;
  vec3 wb = vec3(clamp(wbv.r/wbv.g, 1.0, 1.35), 1.0, clamp(wbv.b/wbv.g, 0.75, 1.0));
  c *= mix(vec3(1.0), wb, 0.6)*vec3(1.03, 1.0, 0.96);
  c *= uExposure;
  c = aces(c*1.1);
  // subtle vignette
  vec2 d = uv - 0.5;
  c *= 1.0 - 0.28*dot(d, d)*1.6;
  c = pow(c, vec3(1.0/2.2));
  float g = h12(gl_FragCoord.xy + float(uFrame % 64)*13.1) - 0.5;
  c += g*(uGrain + 1.0/255.0);
  o = vec4(c, 1.0);
}`;

<script>
/* js/renderer.js */
// WebGL2 progressive path tracer (no external libraries).
'use strict';

class Renderer {
  constructor(canvas) {
    this.canvas = canvas;
    const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, depth: false, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
    if (!gl) throw new Error('WebGL2 is not available in this browser.');
    this.gl = gl;
    if (!gl.getExtension('EXT_color_buffer_float')) throw new Error('EXT_color_buffer_float is required.');
    gl.getExtension('OES_texture_float_linear');
    this.progs = {};
    this.uniCache = new Map();
    const vbo = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    this.vao = gl.createVertexArray();
    gl.bindVertexArray(this.vao);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    this.frame = 0;
    this.spp = 0;
    this.exposure = 1.0;
    this.logAvg = null;
    this.W = 0; this.H = 0;
  }

  compile(name, fsrc) {
    const gl = this.gl;
    const mk = (type, src) => {
      const s = gl.createShader(type);
      gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
        const log = gl.getShaderInfoLog(s);
        const lines = src.split('\n').map((l, i) => (i + 1) + ': ' + l);
        const m = /ERROR: 0:(\d+)/.exec(log || '');
        const ctx = m ? lines.slice(Math.max(0, +m[1] - 4), +m[1] + 2).join('\n') : '';
        throw new Error(name + ' shader error:\n' + log + '\n' + ctx);
      }
      return s;
    };
    const p = gl.createProgram();
    gl.attachShader(p, mk(gl.VERTEX_SHADER, SH.vert));
    gl.attachShader(p, mk(gl.FRAGMENT_SHADER, fsrc));
    gl.bindAttribLocation(p, 0, 'aPos');
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(name + ' link error: ' + gl.getProgramInfoLog(p));
    this.progs[name] = p;
  }

  init() {
    this.compile('sky', SH.sky);
    this.compile('trace', SH.trace);
    this.compile('denoise', SH.denoise);
    this.compile('composite', SH.composite);
    this.compile('final', SH.final);
    const gl = this.gl;
    this.skyTex = this.makeTex(256, 128, gl.RGBA16F, gl.RGBA, gl.HALF_FLOAT, gl.LINEAR);
    gl.bindTexture(gl.TEXTURE_2D, this.skyTex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
    this.skyFbo = this.makeFbo([this.skyTex]);
  }

  u(prog, name) {
    const key = prog + ':' + name;
    let l = this.uniCache.get(key);
    if (l === undefined) { l = this.gl.getUniformLocation(this.progs[prog], name); this.uniCache.set(key, l); }
    return l;
  }

  makeTex(w, h, ifmt, fmt, type, filter, data = null) {
    const gl = this.gl;
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texImage2D(gl.TEXTURE_2D, 0, ifmt, w, h, 0, fmt, type, data);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter === gl.LINEAR_MIPMAP_LINEAR ? gl.LINEAR : filter);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    return t;
  }

  makeFbo(texs, level = 0) {
    const gl = this.gl;
    const f = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, f);
    texs.forEach((t, i) => gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0 + i, gl.TEXTURE_2D, t, level));
    gl.drawBuffers(texs.map((_, i) => gl.COLOR_ATTACHMENT0 + i));
    const st = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
    if (st !== gl.FRAMEBUFFER_COMPLETE) throw new Error('Framebuffer incomplete: 0x' + st.toString(16));
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return f;
  }

  setScene(bvh) {
    const gl = this.gl;
    this.primTex = this.makeTex(bvh.primW, bvh.primRows, gl.RGBA32F, gl.RGBA, gl.FLOAT, gl.NEAREST, bvh.primData);
    this.nodeTex = this.makeTex(bvh.nodeW, bvh.nodeRows, gl.RGBA32F, gl.RGBA, gl.FLOAT, gl.NEAREST, bvh.nodeData);
    this.nodeCount = bvh.nodeCount;
    this.roots = bvh.roots;
  }

  resize(w, h) {
    w = Math.max(16, Math.floor(w)); h = Math.max(16, Math.floor(h));
    if (w === this.W && h === this.H) return;
    const gl = this.gl;
    const del = (a) => a && a.forEach(x => x && (x instanceof WebGLFramebuffer ? gl.deleteFramebuffer(x) : gl.deleteTexture(x)));
    if (this.acc) { this.acc.forEach(s => { del(s.tex); del([s.fbo]); }); del(this.dn.map(d => d.tex)); del(this.dn.map(d => d.fbo)); del([this.hdrTex, this.hdrFbo, this.topFbo]); }
    this.W = w; this.H = h;
    this.acc = [0, 1].map(() => {
      const tex = [0, 1, 2, 3].map(() => this.makeTex(w, h, gl.RGBA32F, gl.RGBA, gl.FLOAT, gl.NEAREST));
      return { tex, fbo: this.makeFbo(tex) };
    });
    // clear accumulators
    for (const s of this.acc) {
      gl.bindFramebuffer(gl.FRAMEBUFFER, s.fbo);
      gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
    }
    this.dn = [0, 1].map(() => { const tex = this.makeTex(w, h, gl.RGBA32F, gl.RGBA, gl.FLOAT, gl.NEAREST); return { tex, fbo: this.makeFbo([tex]) }; });
    this.levels = Math.floor(Math.log2(Math.max(w, h)));
    this.hdrTex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, this.hdrTex);
    gl.texStorage2D(gl.TEXTURE_2D, this.levels + 1, gl.RGBA16F, w, h);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    this.hdrFbo = this.makeFbo([this.hdrTex], 0);
    this.topFbo = this.makeFbo([this.hdrTex], this.levels);
    this.cur = 0;
    this.reset();
  }

  reset() { this.spp = 0; }

  draw(prog, fbo, w, h) {
    const gl = this.gl;
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.viewport(0, 0, w, h);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  bindTex(prog, name, unit, tex) {
    const gl = this.gl;
    gl.activeTexture(gl.TEXTURE0 + unit);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.uniform1i(this.u(prog, name), unit);
  }

  renderSky(S) {
    const gl = this.gl, p = 'sky';
    gl.useProgram(this.progs[p]);
    gl.uniform3fv(this.u(p, 'uSunDir'), S.sunDir);
    gl.uniform1f(this.u(p, 'uE0'), S.E0);
    gl.uniform1f(this.u(p, 'uCloud'), S.cloud);
    gl.uniform1f(this.u(p, 'uHaze'), S.haze);
    gl.uniform1f(this.u(p, 'uLz'), S.Lz);
    gl.uniform2f(this.u(p, 'uSize'), 256, 128);
    this.draw(p, this.skyFbo, 256, 128);
  }

  setCam(p, C) {
    const gl = this.gl;
    gl.uniform3fv(this.u(p, 'uCamPos'), C.pos);
    gl.uniform3fv(this.u(p, 'uCamFwd'), C.fwd);
    gl.uniform3fv(this.u(p, 'uCamRight'), C.right);
    gl.uniform3fv(this.u(p, 'uCamUp'), C.up);
    gl.uniform1f(this.u(p, 'uTanHalf'), C.tanHalf);
  }

  // one progressive sample + post
  render(C, S, opts) {
    const gl = this.gl;
    const W = this.W, H = this.H;
    const src = this.acc[this.cur], dst = this.acc[1 - this.cur];
    this.spp++;
    const blend = Math.max(1 / this.spp, opts.minBlend || 0);
    // ---- trace
    let p = 'trace';
    gl.useProgram(this.progs[p]);
    this.bindTex(p, 'uPrims', 0, this.primTex);
    this.bindTex(p, 'uNodes', 1, this.nodeTex);
    this.bindTex(p, 'uSky', 2, this.skyTex);
    for (let i = 0; i < 4; i++) this.bindTex(p, 'uPrev' + i, 3 + i, src.tex[i]);
    gl.uniform2f(this.u(p, 'uRes'), W, H);
    gl.uniform1i(this.u(p, 'uFrame'), this.frame);
    gl.uniform1f(this.u(p, 'uBlend'), blend);
    this.setCam(p, C);
    gl.uniform3fv(this.u(p, 'uSunDir'), S.sunDir);
    gl.uniform3fv(this.u(p, 'uSunE'), S.sunE);
    gl.uniform3fv(this.u(p, 'uSunEClear'), S.sunEClear);
    gl.uniform1f(this.u(p, 'uSunCos'), S.sunCos);
    gl.uniform1f(this.u(p, 'uCloud'), S.cloud);
    gl.uniform2fv(this.u(p, 'uCloudOff'), S.cloudOff);
    gl.uniform1f(this.u(p, 'uWet'), S.wet);
    gl.uniform1f(this.u(p, 'uHaze'), S.haze);
    gl.uniform1f(this.u(p, 'uDust'), S.dust);
    gl.uniform1f(this.u(p, 'uTime'), S.time);
    gl.uniform1i(this.u(p, 'uNumLights'), S.numLights);
    gl.uniform4fv(this.u(p, 'uLightPos'), S.lightPos);
    gl.uniform4fv(this.u(p, 'uLightCol'), S.lightCol);
    gl.uniform3fv(this.u(p, 'uFireCol'), S.fireCol);
    gl.uniform3fv(this.u(p, 'uLampCol'), S.lampCol);
    gl.uniform3fv(this.u(p, 'uCandleCol'), S.candleCol);
    gl.uniform1f(this.u(p, 'uFireI'), S.fireI);
    gl.uniform1f(this.u(p, 'uLampI'), S.lampI);
    gl.uniform1i(this.u(p, 'uMaxBounce'), S.bounces);
    gl.uniform1i(this.u(p, 'uDebug'), S.debug || 0);
    gl.uniform1i(this.u(p, 'uNumPortals'), S.numPortals);
    gl.uniform4fv(this.u(p, 'uPortal'), S.portals);
    gl.uniform1f(this.u(p, 'uIndClamp'), S.indClamp || 1.5);
    gl.uniform1i(this.u(p, 'uRoot0'), this.roots[0]);
    gl.uniform1i(this.u(p, 'uRoot1'), this.roots[1]);
    gl.uniform1i(this.u(p, 'uRoot2'), this.roots[2]);
    if (opts.tiles && opts.tiles > 1) {
      gl.enable(gl.SCISSOR_TEST);
      for (let t = 0; t < opts.tiles; t++) {
        const y0 = Math.floor(H * t / opts.tiles), y1 = Math.floor(H * (t + 1) / opts.tiles);
        gl.scissor(0, y0, W, y1 - y0);
        this.draw(p, dst.fbo, W, H);
        gl.flush();
      }
      gl.disable(gl.SCISSOR_TEST);
    } else this.draw(p, dst.fbo, W, H);
    this.cur = 1 - this.cur;
    this.frame++;
    this.post(C, opts);
  }

  post(C, opts) {
    const gl = this.gl;
    const W = this.W, H = this.H;
    const A = this.acc[this.cur];
    let illum = null;
    if (opts.denoise) {
      const p = 'denoise';
      gl.useProgram(this.progs[p]);
      this.bindTex(p, 'uAlb', 1, A.tex[1]);
      this.bindTex(p, 'uND', 2, A.tex[2]);
      this.bindTex(p, 'uEm', 3, A.tex[3]);
      this.bindTex(p, 'uMom', 4, A.tex[0]);
      gl.uniform1f(this.u(p, 'uSpp'), this.spp);
      gl.uniform1f(this.u(p, 'uLumRef'), this.logAvg === null ? 0.0 : 3.0 * Math.exp(this.logAvg));
      this.setCam(p, C);
      gl.uniform2f(this.u(p, 'uRes'), W, H);
      gl.uniform1f(this.u(p, 'uSigL'), opts.denoiseStrength);
      const passes = this.spp > 512 ? 3 : 5;
      // pass 0: demodulate + outlier rejection; then a-trous passes
      this.bindTex(p, 'uIn', 0, A.tex[0]);
      gl.uniform1i(this.u(p, 'uStep'), 1);
      gl.uniform1i(this.u(p, 'uFirst'), 1);
      gl.uniform1f(this.u(p, 'uPass'), 0);
      this.draw(p, this.dn[1].fbo, W, H);
      let inTex = this.dn[1].tex;
      for (let i = 0; i < passes; i++) {
        const out = this.dn[i % 2];
        this.bindTex(p, 'uIn', 0, inTex);
        gl.uniform1i(this.u(p, 'uStep'), 1 << i);
        gl.uniform1i(this.u(p, 'uFirst'), 0);
        gl.uniform1f(this.u(p, 'uPass'), i);
        this.draw(p, out.fbo, W, H);
        inTex = out.tex;
      }
      illum = inTex;
    }
    // composite
    let p = 'composite';
    gl.useProgram(this.progs[p]);
    this.bindTex(p, 'uIllum', 0, illum || A.tex[0]);
    this.bindTex(p, 'uAlb', 1, A.tex[1]);
    this.bindTex(p, 'uEm', 2, A.tex[3]);
    this.bindTex(p, 'uRad', 3, A.tex[0]);
    gl.uniform1i(this.u(p, 'uRaw'), illum ? 0 : 1);
    this.draw(p, this.hdrFbo, W, H);
    gl.bindTexture(gl.TEXTURE_2D, this.hdrTex);
    gl.generateMipmap(gl.TEXTURE_2D);
    // exposure metering
    if (opts.autoExposure && (this.frame % (opts.meterEvery || 4) === 0 || this.logAvg === null)) {
      gl.bindFramebuffer(gl.FRAMEBUFFER, this.topFbo);
      const px = new Float32Array(4);
      gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.FLOAT, px);
      const la = px[3];
      if (isFinite(la)) this.logAvg = this.logAvg === null || opts.snapExposure ? la : this.logAvg + (la - this.logAvg) * 0.25;
    }
    // final
    p = 'final';
    gl.useProgram(this.progs[p]);
    this.bindTex(p, 'uHDR', 0, this.hdrTex);
    let exposure = opts.manualExposure;
    if (opts.autoExposure && this.logAvg !== null) {
      const key = 0.14;
      exposure = key / Math.exp(this.logAvg);
      exposure = Math.min(Math.max(exposure, 0.02), 20000);
    }
    exposure *= Math.pow(2, opts.ev || 0);
    this.exposure = exposure;
    gl.uniform1f(this.u(p, 'uExposure'), exposure);
    gl.uniform1f(this.u(p, 'uBloom'), opts.bloom);
    gl.uniform1f(this.u(p, 'uLocal'), opts.local === undefined ? 1.0 : opts.local);
    gl.uniform2f(this.u(p, 'uOut'), this.canvas.width, this.canvas.height);
    gl.uniform1f(this.u(p, 'uLevels'), this.levels);
    gl.uniform1f(this.u(p, 'uGrain'), opts.grain || 0);
    gl.uniform1i(this.u(p, 'uFrame'), this.frame);
    this.draw(p, null, this.canvas.width, this.canvas.height);
  }
}

/* js/controls.js */
// First-person walk / fly controls with simple AABB collision.
'use strict';

class Controls {
  constructor(canvas, prims) {
    this.canvas = canvas;
    this.pos = [1.5, 1.2, 44];
    this.yaw = 0; this.pitch = 0;
    this.fly = false;
    this.vy = 0;
    this.keys = new Set();
    this.changed = true;
    this.eye = 1.62;
    this.fov = 70;
    // colliders (world AABBs)
    this.cols = prims.filter(p => p.collide).map(p => p.aabb);
    this.grid = new Map();
    this.cell = 2.0;
    this.cols.forEach((b, i) => {
      for (let x = Math.floor(b.mn[0] / this.cell); x <= Math.floor(b.mx[0] / this.cell); x++)
        for (let z = Math.floor(b.mn[2] / this.cell); z <= Math.floor(b.mx[2] / this.cell); z++) {
          const k = x + ',' + z;
          if (!this.grid.has(k)) this.grid.set(k, []);
          this.grid.get(k).push(i);
        }
    });
    this.bind();
  }

  bind() {
    const c = this.canvas;
    c.addEventListener('click', () => { if (document.pointerLockElement !== c) c.requestPointerLock && c.requestPointerLock(); });
    document.addEventListener('mousemove', (e) => {
      if (document.pointerLockElement !== c) return;
      this.look(e.movementX, e.movementY);
    });
    let drag = null;
    c.addEventListener('pointerdown', (e) => { if (e.pointerType !== 'mouse') drag = { x: e.clientX, y: e.clientY }; });
    c.addEventListener('pointermove', (e) => { if (drag && e.pointerType !== 'mouse') { this.look(e.clientX - drag.x, e.clientY - drag.y); drag = { x: e.clientX, y: e.clientY }; } });
    c.addEventListener('pointerup', () => { drag = null; });
    window.addEventListener('keydown', (e) => {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')) return;
      this.keys.add(e.code);
      if (e.code === 'KeyF') { this.fly = !this.fly; this.vy = 0; this.changed = true; if (this.onMode) this.onMode(); }
    });
    window.addEventListener('keyup', (e) => this.keys.delete(e.code));
    window.addEventListener('blur', () => this.keys.clear());
  }

  look(dx, dy) {
    this.yaw += dx * 0.0022;
    this.pitch = Math.max(-1.5, Math.min(1.5, this.pitch - dy * 0.0022));
    this.changed = true;
  }

  setView(v) {
    this.pos = v.pos.slice();
    if (v.target) {
      const d = V.norm(V.sub(v.target, v.pos));
      this.yaw = Math.atan2(d[0], -d[2]);
      this.pitch = Math.asin(d[1]);
    } else { this.yaw = v.yaw; this.pitch = v.pitch; }
    if (v.fly !== undefined) this.fly = v.fly;
    this.changed = true;
  }

  basis() {
    const cp = Math.cos(this.pitch), sp = Math.sin(this.pitch);
    const fwd = [Math.sin(this.yaw) * cp, sp, -Math.cos(this.yaw) * cp];
    const right = V.norm(V.cross(fwd, [0, 1, 0]));
    const up = V.cross(right, fwd);
    return { pos: this.pos.slice(), fwd, right, up, tanHalf: Math.tan(this.fov * Math.PI / 360) };
  }

  nearby(x, z, r) {
    const out = new Set();
    for (let gx = Math.floor((x - r) / this.cell); gx <= Math.floor((x + r) / this.cell); gx++)
      for (let gz = Math.floor((z - r) / this.cell); gz <= Math.floor((z + r) / this.cell); gz++) {
        const l = this.grid.get(gx + ',' + gz); if (l) l.forEach(i => out.add(i));
      }
    return out;
  }

  blocked(x, z, feet) {
    const r = 0.24;
    for (const i of this.nearby(x, z, r)) {
      const b = this.cols[i];
      if (b.mx[1] <= feet + 0.42 || b.mn[1] >= feet + 1.75) continue;
      const cx = Math.max(b.mn[0], Math.min(x, b.mx[0])), cz = Math.max(b.mn[2], Math.min(z, b.mx[2]));
      if ((cx - x) ** 2 + (cz - z) ** 2 < r * r) return true;
    }
    return false;
  }

  groundAt(x, z, feet) {
    let g = -0.5;
    const r = 0.12;
    for (const i of this.nearby(x, z, r)) {
      const b = this.cols[i];
      if (b.mx[1] > feet + 0.45) continue;
      if (x + r < b.mn[0] || x - r > b.mx[0] || z + r < b.mn[2] || z - r > b.mx[2]) continue;
      if (b.mx[1] - b.mn[1] < 0.004) continue;
      g = Math.max(g, b.mx[1]);
    }
    return g;
  }

  update(dt) {
    dt = Math.min(dt, 0.1);
    const k = this.keys;
    let f = 0, s = 0, u = 0;
    if (k.has('KeyW') || k.has('ArrowUp')) f += 1;
    if (k.has('KeyS') || k.has('ArrowDown')) f -= 1;
    if (k.has('KeyD') || k.has('ArrowRight')) s += 1;
    if (k.has('KeyA') || k.has('ArrowLeft')) s -= 1;
    if (k.has('KeyE') || k.has('Space')) u += 1;
    if (k.has('KeyQ') || k.has('KeyC')) u -= 1;
    if (this.touchMove) f += this.touchMove;
    const speed = (k.has('ShiftLeft') || k.has('ShiftRight') ? 4.2 : 1.8) * (this.fly ? 2.5 : 1);
    let moved = false;
    const sy = Math.sin(this.yaw), cy = Math.cos(this.yaw);
    if (this.fly) {
      const b = this.basis();
      if (f || s || u) {
        this.pos = V.add(this.pos, V.add(V.add(V.mul(b.fwd, f * speed * dt), V.mul(b.right, s * speed * dt)), [0, u * speed * dt, 0]));
        moved = true;
      }
    } else {
      let feet = this.pos[1] - this.eye;
      if (f || s) {
        let dx = (sy * f + cy * s) * speed * dt, dz = (-cy * f + sy * s) * speed * dt;
        const nx = this.pos[0] + dx;
        if (!this.blocked(nx, this.pos[2], feet)) this.pos[0] = nx;
        const nz = this.pos[2] + dz;
        if (!this.blocked(this.pos[0], nz, feet)) this.pos[2] = nz;
        moved = true;
      }
      const g = this.groundAt(this.pos[0], this.pos[2], feet);
      if (feet > g + 0.001) {
        this.vy -= 9.8 * dt;
        feet = Math.max(g, feet + this.vy * dt);
        moved = true;
      } else { this.vy = 0; if (Math.abs(feet - g) > 1e-4) moved = true; feet = g; }
      if (feet === g) this.vy = 0;
      this.pos[1] = feet + this.eye;
    }
    if (moved) this.changed = true;
    const c = this.changed; this.changed = false;
    return c;
  }
}

    ['resScale', 'Render resolution', 0.25, 1, 0.05, v => `${Math.round(v * 100)}%`],
    ['denoise', 'Denoiser strength', 0, 2, 0.05, v => v === 0 ? 'off' : v.toFixed(2)],
    ['bloom', 'Lens bloom', 0, 0.2, 0.005, v => v.toFixed(3)],
    ['animate', 'Animate fire & clouds', 0, 1, 1, v => v ? 'on' : 'off'],
  ]],
];

const P = Object.assign({}, DEFAULTS);

// ---------------------------------------------------------------- sun + sky model
const ATM = { Rg: 6371e3, Ra: 6471e3, bR: [5.8e-6, 13.5e-6, 33.1e-6] };
function sunDirection(time, season, rotDeg) {
  const lat = 51.5 * Math.PI / 180;
  const decl = (season * 2 - 1) * 23.44 * Math.PI / 180;
  const H = (time - 12) * 15 * Math.PI / 180;
  const sinEl = Math.sin(lat) * Math.sin(decl) + Math.cos(lat) * Math.cos(decl) * Math.cos(H);
  const el = Math.asin(sinEl);
  let cosAz = (Math.sin(decl) - sinEl * Math.sin(lat)) / (Math.cos(el) * Math.cos(lat));
  cosAz = Math.max(-1, Math.min(1, cosAz));
  let az = Math.acos(cosAz);
  if (H > 0) az = 2 * Math.PI - az;
  const a = az + rotDeg * Math.PI / 180;
  return [Math.cos(el) * Math.sin(a), Math.sin(el), Math.cos(el) * Math.cos(a)];
}
function sunTransmittance(dir, haze) {
  const bM = 21e-6 * (1 + haze * 6), Hm = 1200 * (1 + haze * 0.6);
  const r0 = [0, ATM.Rg + 2, 0];
  const b = 2 * V.dot(dir, r0), c = V.dot(r0, r0) - ATM.Ra * ATM.Ra;
  const t = (-b + Math.sqrt(b * b - 4 * c)) / 2;
  // blocked by planet?
  const cg = V.dot(r0, r0) - ATM.Rg * ATM.Rg;
  const dg = b * b - 4 * cg;
  if (dg > 0 && (-b - Math.sqrt(dg)) / 2 > 0) return [0, 0, 0];
  const N = 64; let odR = 0, odM = 0;
  for (let i = 0; i < N; i++) {
    const x = V.add(r0, V.mul(dir, (i + 0.5) * t / N));
    const h = V.len(x) - ATM.Rg;
    odR += Math.exp(-h / 8000) * t / N; odM += Math.exp(-h / Hm) * t / N;
  }
  return ATM.bR.map(br => Math.exp(-(br * odR + bM * 1.1 * odM)));
}

function computeSky() {
  const sunDir = sunDirection(P.time, P.season, P.sunRot);
  const E0 = 11.5;
  const Tr = sunTransmittance(sunDir, P.haze);
  // sun below horizon fades smoothly (penumbra of the solar disc)
  const fade = Math.max(0, Math.min(1, (sunDir[1] + 0.01) / 0.02));
  const sunEClear = Tr.map(t => t * E0 * fade);
  const lumSun = 0.2126 * sunEClear[0] + 0.7152 * sunEClear[1] + 0.0722 * sunEClear[2];
  const twilight = 0.03 * Math.max(0, Math.min(1, (sunDir[1] + 0.12) / 0.2));
  const Eoc = 0.32 * lumSun * Math.max(sunDir[1], 0) + twilight + 0.0004;
  const Lz = Eoc * 9 / (7 * Math.PI);
  const cloudDim = 1 - 0.25 * P.cloud;
  return {
    sunDir, E0, sunEClear, sunE: sunEClear.map(v => v * cloudDim), Lz,
    sunCos: Math.cos(0.0047 * (1 + P.haze * 2)),
    cloud: P.cloud, haze: P.haze,
  };
}

function buildLightUniforms(lights, t) {
  const lamp = kelvinRGB(P.warmth), candle = kelvinRGB(1850), fire = kelvinRGB(1750);
  const pos = new Float32Array(48 * 4), col = new Float32Array(48 * 4);
  let n = 0;
  lights.forEach((L, i) => {
    if (n >= 48) return;
    let c, s;
    if (L.group === 'fire') {
      c = fire; s = P.fireI;
      if (P.animate) s *= 0.8 + 0.2 * Math.sin(t * 9 + i * 1.7) * Math.sin(t * 5.3 + i);
    } else if (L.group === 'candle') { c = candle; s = P.lampI; }
    else { c = lamp; s = P.lampI; }
    const pw = L.power * s;
    if (pw <= 0) return;
    pos.set([L.p[0], L.p[1], L.p[2], L.r], n * 4);
    col.set([c[0] * pw, c[1] * pw, c[2] * pw, pw], n * 4);
    n++;
  });
  return { pos, col, n, lamp, candle, fire };
}

// ---------------------------------------------------------------- app
const App = {
  init() {
    this.canvas = document.getElementById('view');
    this.status = document.getElementById('status');
    this.qs = new URLSearchParams(location.search);
    this.shot = this.qs.has('shot');
    try {
      const t0 = performance.now();
      const scene = buildScene();
      const bvh = buildBVH(scene.prims);
      this.scene = scene;
      const pd = new Float32Array(48 * 4); let np = 0;
      for (const pt of scene.portals.slice(0, 16)) {
        const area = 4 * V.len(pt.u) * V.len(pt.v);
        const nn = V.norm(V.cross(pt.u, pt.v));
        const sgn = V.dot(nn, pt.n) >= 0 ? 1 : -1;
        pd.set([...pt.c, area, ...pt.u, sgn, ...pt.v, 0], np * 12);
        np++;
      }
      this.portalData = { n: np, data: pd };
      this.renderer = new Renderer(this.canvas);
      this.renderer.init();
      this.renderer.setScene(bvh);
      this.controls = new Controls(this.canvas, scene.prims);
      this.controls.onMode = () => this.updateModeLabel();
      console.log(`scene: ${scene.prims.length} prims, ${scene.lights.length} lights, ${bvh.nodeCount} nodes, built in ${(performance.now() - t0).toFixed(0)} ms`);
      this.info = `${scene.prims.length} primitives · ${scene.lights.length} lights`;
    } catch (e) {
      console.error(e);
      document.getElementById('error').textContent = String(e.message || e);
      document.getElementById('error').style.display = 'block';
      window.__castleError = String(e.message || e);
      return;
    }
    for (const [k, v] of this.qs) if (k in P) P[k] = parseFloat(v);
    this.buildUI();
    this.controls.setView(VIEWS[this.qs.get('view') || 'exterior'] || VIEWS.exterior);
    this.skyDirty = true;
    this.last = performance.now();
    this.fpsAcc = 0; this.fpsN = 0; this.fps = 0;
    window.addEventListener('resize', () => this.resize());
    this.resize();
    window.castleAPI = this.api();
    if (!this.shot) requestAnimationFrame((t) => this.loop(t));
    window.__castleReady = true;
  },

  resize() {
    const dpr = this.shot ? 1 : Math.min(window.devicePixelRatio || 1, 1.0);
    const w = Math.floor(this.canvas.clientWidth * dpr), h = Math.floor(this.canvas.clientHeight * dpr);
    this.canvas.width = w; this.canvas.height = h;
    // while the camera moves, trace a quarter of the pixels (half res each axis); full res once still
    const s = P.resScale * (this.moving ? 0.5 : 1);
    this.renderer.resize(w * s, h * s);
  },

  buildUI() {
    const panel = document.getElementById('sliders');
    this.inputs = {};
    for (const [group, items] of SLIDERS) {
      const g = document.createElement('fieldset');
      const lg = document.createElement('legend'); lg.textContent = group; g.appendChild(lg);
      for (const [key, label, mn, mx, st, fmt] of items) {
        const row = document.createElement('label'); row.className = 'row';
        const name = document.createElement('span'); name.textContent = label;
        const val = document.createElement('output');
        const inp = document.createElement('input');
        inp.type = 'range'; inp.min = mn; inp.max = mx; inp.step = st; inp.value = P[key];
        val.textContent = fmt(P[key]);
        inp.addEventListener('input', () => {
          P[key] = parseFloat(inp.value); val.textContent = fmt(P[key]);
          this.onParam(key);
        });
        row.appendChild(name); row.appendChild(val); row.appendChild(inp);
        g.appendChild(row);
        this.inputs[key] = { inp, val, fmt };
      }
      panel.appendChild(g);
    }
    // weather presets
    const pre = document.getElementById('presets');
    const W = {
      'Clear': { cloud: 0.0, rain: 0, haze: 0.08 },
      'Fair': { cloud: 0.3, rain: 0, haze: 0.12 },
      'Overcast': { cloud: 0.85, rain: 0.1, haze: 0.25 },
      'Rain': { cloud: 1.0, rain: 1.0, haze: 0.4 },
      'Fog': { cloud: 0.7, rain: 0.3, haze: 1.0 },
    };
    for (const [name, vals] of Object.entries(W)) {
      const b = document.createElement('button'); b.textContent = name;
      b.onclick = () => { this.set(vals); };
      pre.appendChild(b);
    }
    const tp = document.getElementById('times');
    for (const [name, t] of [['Dawn', 6.4], ['Morning', 9.5], ['Noon', 13], ['Afternoon', 16.2], ['Golden hour', 18.4], ['Dusk', 19.6], ['Night', 22]]) {
      const b = document.createElement('button'); b.textContent = name;
      b.onclick = () => this.set({ time: t });
      tp.appendChild(b);
    }
    const rooms = document.getElementById('rooms');
    for (const [k, v] of Object.entries(VIEWS)) {
      const b = document.createElement('button'); b.textContent = v.label;
      b.onclick = () => { this.controls.setView(v); this.updateModeLabel(); };
      rooms.appendChild(b);
    }
    document.getElementById('toggleUI').onclick = () => document.body.classList.toggle('hideui');
    document.getElementById('mode').onclick = () => { this.controls.fly = !this.controls.fly; this.controls.changed = true; this.updateModeLabel(); };
    window.addEventListener('keydown', (e) => {
      if (e.code === 'KeyH') document.body.classList.toggle('hideui');
      const n = parseInt(e.key, 10);
      if (n >= 1 && n <= 9) { const v = Object.values(VIEWS)[n - 1]; if (v) { this.controls.setView(v); this.updateModeLabel(); } }
    });
    // touch walk buttons
    const tw = document.getElementById('touchwalk');
    const hold = (el, v) => {
      el.addEventListener('pointerdown', (e) => { e.preventDefault(); this.controls.touchMove = v; });
      ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => el.addEventListener(ev, () => { this.controls.touchMove = 0; }));
    };
    hold(tw.children[0], 1); hold(tw.children[1], -1);
    this.updateModeLabel();
  },

  updateModeLabel() { document.getElementById('mode').textContent = this.controls.fly ? 'Mode: fly (F)' : 'Mode: walk (F)'; },

  set(vals) {
    for (const [k, v] of Object.entries(vals)) {
      P[k] = v;
      const i = this.inputs && this.inputs[k];
      if (i) { i.inp.value = v; i.val.textContent = i.fmt(v); }
      this.onParam(k);
    }
  },

  onParam(key) {
    if (key === 'resScale') this.resize();
    if (['time', 'sunRot', 'season', 'cloud', 'haze'].includes(key)) this.skyDirty = true;
    if (key === 'fov') this.controls.fov = P.fov;
    this.renderer.reset();
  },

  frameParams(t) {
    if (this.skyDirty) { this.sky = computeSky(); this.renderer.renderSky(this.sky); this.skyDirty = false; }
    const Ls = buildLightUniforms(this.scene.lights, t);
    const S = this.sky;
    return {
      sunDir: S.sunDir, sunE: S.sunE, sunEClear: S.sunEClear, sunCos: S.sunCos,
      cloud: P.cloud, cloudOff: [P.cloudDrift * 0.7 + (P.animate ? t * 0.004 : 0), P.cloudDrift * 0.3], wet: P.rain, haze: P.haze, dust: this.moving ? 0 : P.dust,
      time: P.animate ? t : 0.0,
      numLights: Ls.n, lightPos: Ls.pos, lightCol: Ls.col,
      fireCol: Ls.fire, lampCol: Ls.lamp, candleCol: Ls.candle, fireI: P.fireI, lampI: P.lampI,
      bounces: this.moving ? 1 : P.bounces, debug: P.debug,
      numPortals: this.portalData.n, portals: this.portalData.data,
    };
  },

  renderOnce(t, extra = {}) {
    this.controls.fov = P.fov;
    const C = this.controls.basis();
    const S = this.frameParams(t);
    this.renderer.render(C, S, Object.assign({
      denoise: P.denoise > 0, denoiseStrength: P.denoise, autoExposure: true, ev: P.ev,
      bloom: P.bloom, grain: P.grain, minBlend: P.animate ? 1 / 24 : 0,
    }, extra));
  },

  loop(now) {
    const dt = (now - this.last) / 1000; this.last = now;
    const moved = this.controls.update(dt);
    if (moved) { this.renderer.reset(); this.lastMove = now; }
    // lighter paths while the camera is moving keeps navigation fluid; full quality once still
    this.moving = now - (this.lastMove || 0) < 120;
    if (this.wasMoving !== this.moving) { this.resize(); this.renderer.reset(); }
    this.wasMoving = this.moving;
    const maxSpp = 4096;
    if (this.renderer.spp < maxSpp || P.animate) this.renderOnce(now / 1000);
    this.fpsAcc += dt; this.fpsN++;
    if (this.fpsAcc > 0.5) { this.fps = this.fpsN / this.fpsAcc; this.fpsAcc = 0; this.fpsN = 0; }
    const p = this.controls.pos;
    this.status.textContent = `${this.fps.toFixed(0)} fps · ${this.renderer.spp} spp · ${this.renderer.W}×${this.renderer.H} · pos ${p.map(v => v.toFixed(1)).join(', ')} · ${this.info}`;
    requestAnimationFrame((t) => this.loop(t));
  },

  api() {
    const self = this;
    return {
      views: Object.keys(VIEWS),
      setView(name) { self.controls.setView(typeof name === 'string' ? VIEWS[name] : name); self.renderer.reset(); },
      set(vals) { self.set(vals); },
      // render N samples synchronously (in tiles) and resolve when done
      async render(spp, tiles = 1) {
        self.renderer.reset();
        self.renderer.logAvg = null;
        const t0 = performance.now();
        for (let i = 0; i < spp; i++) {
          self.renderOnce(0, { tiles, snapExposure: i < 3, meterEvery: 1 });
          if (i % 2 === 1) await new Promise(r => setTimeout(r, 0));
        }
        self.renderer.gl.finish();
        return { ms: performance.now() - t0, spp: self.renderer.spp, exposure: self.renderer.exposure };
      },
      stats() { return { prims: self.scene.prims.length, lights: self.scene.lights.length, W: self.renderer.W, H: self.renderer.H }; },
    };
  },
};

window.addEventListener('DOMContentLoaded', () => App.init());

</script>
</body>
</html>
