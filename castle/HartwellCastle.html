<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Castle · Path-Traced Walkthrough</title>
<style>
  :root { --bg: #0d0c0a; --panel: rgba(18, 16, 13, 0.78); --ink: #ece4d4; --muted: #a39a88; --accent: #c9a86a; --line: rgba(236, 228, 212, 0.14); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.35 Georgia, 'Times New Roman', serif; overflow: hidden; }
  #view { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; cursor: crosshair; touch-action: none; }
  #panel { position: fixed; top: 12px; right: 12px; width: 300px; max-height: calc(100vh - 24px); overflow-y: auto; background: var(--panel); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  #panel h1 { font-size: 16px; font-weight: normal; letter-spacing: 0.06em; margin: 0 0 2px; color: var(--accent); }
  #panel p { margin: 0 0 8px; color: var(--muted); font-size: 12px; }
  fieldset { border: none; border-top: 1px solid var(--line); margin: 8px 0 0; padding: 8px 0 0; }
  legend { color: var(--accent); font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; padding: 0 6px 0 0; }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; margin: 6px 0; }
  .row span { color: var(--ink); }
  .row output { color: var(--muted); font-variant-numeric: tabular-nums; }
  .row input { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); }
  .btns { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0; }
  button { background: rgba(236, 228, 212, 0.08); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font: inherit; font-size: 12px; cursor: pointer; }
  button:hover { background: rgba(201, 168, 106, 0.22); }
  #status { position: fixed; left: 12px; bottom: 10px; color: var(--muted); font: 11px/1.2 ui-monospace, Menlo, Consolas, monospace; text-shadow: 0 1px 2px #000; }
  #help { position: fixed; left: 12px; top: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; color: var(--muted); font-size: 12px; max-width: 320px; }
  #help b { color: var(--ink); font-weight: normal; }
  #error { display: none; position: fixed; inset: 20% 10% auto; background: #2a1210; color: #ffd9cf; padding: 16px; border-radius: 8px; white-space: pre-wrap; font: 12px monospace; max-height: 60vh; overflow: auto; }
  #touchwalk { position: fixed; left: 12px; bottom: 34px; display: none; gap: 6px; }
  #touchwalk button { width: 56px; height: 44px; font-size: 18px; }
  @media (pointer: coarse) { #touchwalk { display: flex; } }
  body.hideui #panel, body.hideui #help, body.hideui #status, body.hideui #touchwalk { display: none; }
  @media (max-width: 640px) { #panel { width: calc(100vw - 24px); top: auto; bottom: 90px; max-height: 45vh; } #help { display: none; } }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="help">
  <b>Click</b> to look around · <b>WASD</b> move · <b>Shift</b> run · <b>F</b> walk/fly · <b>E/Q</b> up/down (fly) · <b>1–9</b> viewpoints · <b>H</b> hide UI.
  The image refines progressively when you stop moving.
</div>
<div id="panel">
  <h1>Hartwell Castle</h1>
  <p>Real-time path tracer · WebGL2 · no libraries</p>
  <div class="btns"><button id="mode">Mode</button><button id="toggleUI">Hide UI (H)</button></div>
  <fieldset><legend>Viewpoints</legend><div class="btns" id="rooms"></div></fieldset>
  <fieldset><legend>Time presets</legend><div class="btns" id="times"></div></fieldset>
  <fieldset><legend>Weather presets</legend><div class="btns" id="presets"></div></fieldset>
  <div id="sliders"></div>
</div>
<div id="touchwalk"><button aria-label="forward">▲</button><button aria-label="back">▼</button></div>
<div id="status"></div>
<div id="error"></div>
<script>
/* js/math.js */
// Small vector / quaternion helpers (no external libraries).
'use strict';
const V = {
  add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
  sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
  mul: (a, s) => [a[0] * s, a[1] * s, a[2] * s],
  dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
  cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
  len: (a) => Math.hypot(a[0], a[1], a[2]),
  norm: (a) => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; },
  lerp: (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t],
};

const Q = {
  ident: () => [0, 0, 0, 1],
  axisAngle: (ax, deg) => {
    const a = deg * Math.PI / 360, s = Math.sin(a);
    const n = V.norm(ax);
    return [n[0] * s, n[1] * s, n[2] * s, Math.cos(a)];
  },
  mul: (a, b) => [
    a[3] * b[0] + a[0] * b[3] + a[1] * b[2] - a[2] * b[1],
    a[3] * b[1] - a[0] * b[2] + a[1] * b[3] + a[2] * b[0],
    a[3] * b[2] + a[0] * b[1] - a[1] * b[0] + a[2] * b[3],
    a[3] * b[3] - a[0] * b[0] - a[1] * b[1] - a[2] * b[2],
  ],
  // euler degrees [rx, ry, rz] applied as roll(z) then pitch(x) then yaw(y)
  euler: (r) => {
    const qx = Q.axisAngle([1, 0, 0], r[0] || 0);
    const qy = Q.axisAngle([0, 1, 0], r[1] || 0);
    const qz = Q.axisAngle([0, 0, 1], r[2] || 0);
    return Q.mul(qy, Q.mul(qx, qz));
  },
  rot: (q, v) => {
    // v + 2*cross(q.xyz, cross(q.xyz, v) + q.w*v)
    const u = [q[0], q[1], q[2]];
    const t = V.add(V.cross(u, v), V.mul(v, q[3]));
    return V.add(v, V.mul(V.cross(u, t), 2));
  },
  // quaternion from orthonormal basis columns (x,y,z axes of the local frame in world)
  fromBasis: (x, y, z) => {
    const m00 = x[0], m10 = x[1], m20 = x[2];
    const m01 = y[0], m11 = y[1], m21 = y[2];
    const m02 = z[0], m12 = z[1], m22 = z[2];
    const tr = m00 + m11 + m22;
    let qx, qy, qz, qw;
    if (tr > 0) {
      const s = Math.sqrt(tr + 1.0) * 2;
      qw = 0.25 * s; qx = (m21 - m12) / s; qy = (m02 - m20) / s; qz = (m10 - m01) / s;
    } else if (m00 > m11 && m00 > m22) {
      const s = Math.sqrt(1.0 + m00 - m11 - m22) * 2;
      qw = (m21 - m12) / s; qx = 0.25 * s; qy = (m01 + m10) / s; qz = (m02 + m20) / s;
    } else if (m11 > m22) {
      const s = Math.sqrt(1.0 + m11 - m00 - m22) * 2;
      qw = (m02 - m20) / s; qx = (m01 + m10) / s; qy = 0.25 * s; qz = (m12 + m21) / s;
    } else {
      const s = Math.sqrt(1.0 + m22 - m00 - m11) * 2;
      qw = (m10 - m01) / s; qx = (m02 + m20) / s; qy = (m12 + m21) / s; qz = 0.25 * s;
    }
    const l = Math.hypot(qx, qy, qz, qw);
    return [qx / l, qy / l, qz / l, qw / l];
  },
};

// Deterministic PRNG for scene building
function mulberry32(seed) {
  return function () {
    let t = (seed += 0x6D2B79F5);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Blackbody (Kelvin) -> linear RGB, normalised to luminance 1
function kelvinRGB(k) {
  const t = k / 100;
  let r, g, b;
  if (t <= 66) { r = 255; g = 99.4708025861 * Math.log(t) - 161.1195681661; }
  else { r = 329.698727446 * Math.pow(t - 60, -0.1332047592); g = 288.1221695283 * Math.pow(t - 60, -0.0755148492); }
  if (t >= 66) b = 255; else if (t <= 19) b = 0; else b = 138.5177312231 * Math.log(t - 10) - 305.0447927307;
  const c = [r, g, b].map(v => Math.pow(Math.min(255, Math.max(0, v)) / 255, 2.2));
  const l = 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
  return c.map(v => v / l);
}

</script>
<script>
/* js/scene.js */
// Castle scene description: analytic primitives + lights.
// Units: metres. +y up. Interior floor at y=0, exterior ground at y=-0.5.
'use strict';

const T = { BOX: 0, RBOX: 1, CYL: 2, ELL: 3, CONE: 4 };
const F = { CAMONLY: 1, TRANS: 2, NOSHADOW: 4, POROUS: 8 };
const M = {
  STONE: 0, STONE_TRIM: 1, OAK_FLOOR: 2, FLAGSTONE: 3, BEAM: 4, PLASTER: 5, LINEN: 6, WOOL: 7,
  LEATHER: 8, WOOD: 9, BRASS: 10, IRON: 11, GLASS: 12, BOOKS: 13, RUG: 14, FIRE: 15, WAX: 16,
  FLAME: 17, SHADE: 18, GROUND: 19, BOARDS: 20, SLATE: 21, HEDGE: 22, COPPER: 23, CERAMIC: 24,
  SOOT: 25, PAINTED: 26, MARBLE: 27, LOG: 28, PAINTING: 29, GILT: 30, ENAMEL: 31, CHROME: 32,
  MIRROR: 33, LEAD: 34, TERRACOTTA: 35, PEWTER: 36, BULB: 37, PLAIN: 38, GLOBE: 39, MEADOW: 40,
};

function packColor(hex) {
  if (!hex) return 0;
  const v = parseInt(hex.replace('#', ''), 16);
  return v === 0 ? 1 : v;
}

function buildScene() {
  const prims = [];
  const lights = [];
  const portals = [];   // window openings (inner wall face) used for skylight sampling
  const rand = mulberry32(1337);
  let X = { t: [0, 0, 0], q: [0, 0, 0, 1] };
  const stack = [];

  function push(t, yaw = 0) {
    stack.push(X);
    X = { t: V.add(X.t, Q.rot(X.q, t)), q: Q.mul(X.q, Q.axisAngle([0, 1, 0], yaw)) };
  }
  function pop() { X = stack.pop(); }

  function add(type, c, h, mat, o = {}) {
    const q0 = o.q || (o.rot ? Q.euler(o.rot) : [0, 0, 0, 1]);
    const p = {
      type, mat,
      c: V.add(X.t, Q.rot(X.q, c)),
      h: h.slice(),
      q: Q.mul(X.q, q0),
      p0: o.r || 0,
      seed: o.seed !== undefined ? o.seed : Math.floor(rand() * 1000) / 10,
      col: packColor(o.col),
      extra: o.x || 0,
      flags: o.flags || 0,
    };
    p.collide = o.collide !== undefined ? o.collide : !(p.flags & (F.CAMONLY | F.NOSHADOW));
    prims.push(p);
    return p;
  }
  const box = (x0, y0, z0, x1, y1, z1, mat, o) => {
    const hx = Math.abs(x1 - x0) / 2, hy = Math.abs(y1 - y0) / 2, hz = Math.abs(z1 - z0) / 2;
    const mh = Math.min(hx, hy, hz);
    if ((mat === M.WOOD || mat === M.PAINTED || mat === M.ENAMEL) && mh > 0.008)
      return add(T.RBOX, [(x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2], [hx, hy, hz], mat, Object.assign({}, o, { r: Math.min(0.012, mh * 0.45) }));
    return add(T.BOX, [(x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2], [Math.abs(x1 - x0) / 2, Math.abs(y1 - y0) / 2, Math.abs(z1 - z0) / 2], mat, o);
  };
  const cbox = (cx, cy, cz, hx, hy, hz, mat, o) => add(T.BOX, [cx, cy, cz], [hx, hy, hz], mat, o);
  const rbox = (cx, cy, cz, hx, hy, hz, r, mat, o = {}) => add(T.RBOX, [cx, cy, cz], [hx, hy, hz], mat, Object.assign({}, o, { r }));
  const cyl = (cx, cy, cz, r, hh, mat, o) => add(T.CYL, [cx, cy, cz], [r, hh, r], mat, o);
  const post = (x, y0, z, r, h, mat, o) => add(T.CYL, [x, y0 + h / 2, z], [r, h / 2, r], mat, o);
  const ell = (cx, cy, cz, rx, ry, rz, mat, o) => add(T.ELL, [cx, cy, cz], [rx, ry, rz], mat, o);
  const cone = (cx, cy, cz, ra, hh, rb, mat, o) => add(T.CONE, [cx, cy, cz], [ra, hh, rb], mat, o);
  // oriented box from point a to point b (local z along a->b), width along local x, height along local y
  function beam(a, b, w, hgt, mat, up = [0, 1, 0], o = {}) {
    const z = V.norm(V.sub(b, a));
    let x = V.cross(up, z);
    if (V.len(x) < 1e-4) x = V.cross([1, 0, 0], z);
    x = V.norm(x);
    const y = V.cross(z, x);
    const c = V.mul(V.add(a, b), 0.5);
    return add(T.BOX, c, [w / 2, hgt / 2, V.len(V.sub(b, a)) / 2], mat, Object.assign({}, o, { q: Q.fromBasis(x, y, z) }));
  }
  // cylinder from a to b (local y along a->b)
  function rod(a, b, r, mat, o = {}) {
    const y = V.norm(V.sub(b, a));
    let x = V.cross(y, [0, 0, 1]);
    if (V.len(x) < 1e-4) x = V.cross(y, [1, 0, 0]);
    x = V.norm(x);
    const z = V.cross(x, y);
    const c = V.mul(V.add(a, b), 0.5);
    return add(T.CYL, c, [r, V.len(V.sub(b, a)) / 2, r], mat, Object.assign({}, o, { q: Q.fromBasis(x, y, z) }));
  }
  function light(p, r, power, group) {
    lights.push({ p: V.add(X.t, Q.rot(X.q, p)), r, power, group });
  }

  // ---------------------------------------------------------------- walls
  // Walls with rectangular openings (openings may be stacked vertically in the same column).
  function wallSegments(a0, a1, y0, y1, openings, emit) {
    const xs = new Set([a0, a1]);
    for (const o of openings) { xs.add(Math.max(a0, Math.min(a1, o.a))); xs.add(Math.max(a0, Math.min(a1, o.b))); }
    const bps = [...xs].sort((p, q) => p - q);
    for (let k = 0; k < bps.length - 1; k++) {
      const xa = bps[k], xb = bps[k + 1];
      if (xb - xa < 1e-6) continue;
      const cov = openings.filter(o => o.a <= xa + 1e-6 && o.b >= xb - 1e-6).sort((p, q) => p.y0 - q.y0);
      let y = y0;
      for (const o of cov) { if (o.y0 > y) emit(xa, xb, y, o.y0); y = Math.max(y, o.y1); }
      if (y < y1) emit(xa, xb, y, y1);
    }
  }
  // wall perpendicular to z (runs along x)
  function wallAlongX(x0, x1, y0, y1, z0, z1, mat, openings = []) {
    wallSegments(x0, x1, y0, y1, openings, (a, b, ya, yb) => box(a, ya, z0, b, yb, z1, mat));
  }
  // wall perpendicular to x (runs along z)
  function wallAlongZ(z0, z1, y0, y1, x0, x1, mat, openings = []) {
    wallSegments(z0, z1, y0, y1, openings, (a, b, ya, yb) => box(x0, ya, a, x1, yb, b, mat));
  }

  // A window set into a wall. axis 'z': wall spans z in [zin, zout] (zout outside), window centred at x=c.
  // axis 'x': wall spans x in [xin, xout], window centred at z=c.
  function windowUnit(axis, inner, outer, c, w, y0, y1, opt = {}) {
    const dir = Math.sign(outer - inner); // +1 if outside is at larger coordinate
    const glassPos = outer - dir * 0.32;
    const trimOut = outer + dir * 0.04;
    const mull = opt.mullion !== false;
    const transoms = opt.transoms || [];
    // portal at the inner face of the opening, normal pointing into the room
    // (placed at the glass plane so the window reveals are lit through the portal too)
    if (opt.upper) {}
    else if (axis === 'z') portals.push({ c: [c, (y0 + y1) / 2, glassPos - dir * 0.007], u: [w / 2, 0, 0], v: [0, (y1 - y0) / 2, 0], n: [0, 0, -dir] });
    else portals.push({ c: [glassPos - dir * 0.007, (y0 + y1) / 2, c], u: [0, 0, w / 2], v: [0, (y1 - y0) / 2, 0], n: [-dir, 0, 0] });
    const place = (a0, a1, yy0, yy1, d0, d1, mat, o) => {
      if (axis === 'z') box(a0, yy0, Math.min(d0, d1), a1, yy1, Math.max(d0, d1), mat, o);
      else box(Math.min(d0, d1), yy0, a0, Math.max(d0, d1), yy1, a1, mat, o);
    };
    // glass pane (thin)
    place(c - w / 2, c + w / 2, y0, y1, glassPos - 0.006, glassPos + 0.006, M.GLASS, { flags: F.TRANS, collide: true, x: opt.plain ? 1 : 0 });
    // stone mullion + transoms (dressed stone)
    if (mull) place(c - 0.07, c + 0.07, y0, y1, glassPos - 0.16 * dir, glassPos + 0.1 * dir, M.STONE_TRIM);
    for (const ty of transoms) place(c - w / 2, c + w / 2, ty - 0.06, ty + 0.06, glassPos - 0.16 * dir, glassPos + 0.1 * dir, M.STONE_TRIM);
    // exterior dressed surround (jambs, head, sill) and a drip mould
    place(c - w / 2 - 0.22, c - w / 2, y0 - 0.05, y1 + 0.22, outer, trimOut, M.STONE_TRIM);
    place(c + w / 2, c + w / 2 + 0.22, y0 - 0.05, y1 + 0.22, outer, trimOut, M.STONE_TRIM);
    place(c - w / 2 - 0.22, c + w / 2 + 0.22, y1, y1 + 0.26, outer, trimOut, M.STONE_TRIM);
    place(c - w / 2 - 0.34, c + w / 2 + 0.34, y1 + 0.26, y1 + 0.38, outer, outer + dir * 0.14, M.STONE_TRIM);
    place(c - w / 2 - 0.12, c + w / 2 + 0.12, y0 - 0.12, y0, outer - dir * 0.3, outer + dir * 0.1, M.STONE_TRIM);
    // interior oak sill board
    if (!opt.upper) place(c - w / 2 - 0.05, c + w / 2 + 0.05, y0 - 0.05, y0 + 0.0, inner - dir * 0.04, glassPos, M.WOOD, { col: '#6b4a2e' });
  }

  // ---------------------------------------------------------------- constants
  const YT = 11.0;        // outer wall top
  const EXT = { x0: -16, x1: 16, z0: -11, z1: 11 };

  // plinth / base course
  box(-16.25, -0.5, -11.25, 16.25, 0.25, -11.0, M.STONE_TRIM, { seed: 3 });
  box(-16.25, -0.5, 11.0, 0.5, 0.25, 11.25, M.STONE_TRIM, { seed: 4 });
  box(2.5, -0.5, 11.0, 16.25, 0.25, 11.25, M.STONE_TRIM, { seed: 5 });
  box(0.5, -0.5, 11.0, 2.5, 0.05, 11.25, M.STONE_TRIM, { seed: 6 });
  box(-16.25, -0.5, -11.0, -16.0, 0.25, 11.0, M.STONE_TRIM, { seed: 7 });
  box(16.0, -0.5, -11.0, 16.25, 0.25, 11.0, M.STONE_TRIM, { seed: 8 });
  // entrance steps
  box(-0.1, -0.5, 11.25, 3.1, -0.22, 12.0, M.STONE_TRIM);
  box(0.1, -0.5, 11.25, 2.9, 0.05, 11.62, M.STONE_TRIM);

  // ---------------------------------------------------------------- outer walls with openings
  const GHwin = [-12.2, -7.8, -3.4, 1.0];
  const libWin = [7.2, 11.8];
  const north = [];
  for (const x of GHwin) north.push({ a: x - 0.8, b: x + 0.8, y0: 1.4, y1: 6.6 });
  for (const x of libWin) north.push({ a: x - 0.7, b: x + 0.7, y0: 1.0, y1: 4.0 });
  const upN = [7.2, 11.8];
  for (const x of upN) north.push({ a: x - 0.6, b: x + 0.6, y0: 6.6, y1: 8.8 });
  wallAlongX(-16, 16, -0.5, YT, -11, -10, M.STONE, north);
  for (const x of upN) windowUnit('z', -10, -11, x, 1.2, 6.6, 8.8, { upper: true, transoms: [7.9] });
  for (const x of GHwin) windowUnit('z', -10, -11, x, 1.6, 1.4, 6.6, { transoms: [3.2, 5.0] });
  for (const x of libWin) windowUnit('z', -10, -11, x, 1.4, 1.0, 4.0, { transoms: [3.0] });

  const kitWin = [-12.0, -7.0];
  const bedWin = [8.6, 12.6];
  const south = [{ a: 0.5, b: 2.5, y0: 0.05, y1: 3.3 }, { a: -1.3, b: -0.7, y0: 1.2, y1: 3.4 }, { a: 3.7, b: 4.3, y0: 1.2, y1: 3.4 }];
  for (const x of kitWin) south.push({ a: x - 0.7, b: x + 0.7, y0: 1.1, y1: 3.4 });
  for (const x of bedWin) south.push({ a: x - 0.7, b: x + 0.7, y0: 0.9, y1: 3.4 });
  const upS = [-12.0, -7.0, 1.5, 8.6, 12.6];
  for (const x of upS) south.push({ a: x - 0.6, b: x + 0.6, y0: 6.6, y1: 8.8 });
  wallAlongX(-16, 16, -0.5, YT, 10, 11, M.STONE, south);
  for (const x of upS) windowUnit('z', 10, 11, x, 1.2, 6.6, 8.8, { upper: true, transoms: [7.9] });
  for (const x of kitWin) windowUnit('z', 10, 11, x, 1.4, 1.1, 3.4, {});
  for (const x of bedWin) windowUnit('z', 10, 11, x, 1.4, 0.9, 3.4, { transoms: [2.6] });
  windowUnit('z', 10, 11, -1.0, 0.6, 1.2, 3.4, { mullion: false });
  windowUnit('z', 10, 11, 4.0, 0.6, 1.2, 3.4, { mullion: false });
  // front door surround + arch-like head
  box(0.28, 0.05, 11.0, 0.5, 3.6, 11.08, M.STONE_TRIM);
  box(2.5, 0.05, 11.0, 2.72, 3.6, 11.08, M.STONE_TRIM);
  box(0.28, 3.3, 11.0, 2.72, 3.75, 11.1, M.STONE_TRIM);
  box(0.1, 3.75, 11.0, 2.9, 3.88, 11.2, M.STONE_TRIM);

  const west = [{ a: 7.6, b: 8.8, y0: 6.6, y1: 8.8 }];
  wallAlongZ(-10, 10, -0.5, YT, -16, -15, M.STONE, west);
  windowUnit('x', -15, -16, 8.2, 1.2, 6.6, 8.8, { upper: true, transoms: [7.9] });
  const east = [{ a: -5.85, b: -4.45, y0: 1.0, y1: 4.0 }, { a: 7.6, b: 9.0, y0: 0.9, y1: 3.4 }, { a: -5.75, b: -4.55, y0: 6.6, y1: 8.8 }, { a: 3.9, b: 5.1, y0: 6.6, y1: 8.8 }];
  wallAlongZ(-10, 10, -0.5, YT, 15, 16, M.STONE, east);
  windowUnit('x', 15, 16, -5.15, 1.2, 6.6, 8.8, { upper: true, transoms: [7.9] });
  windowUnit('x', 15, 16, 4.5, 1.2, 6.6, 8.8, { upper: true, transoms: [7.9] });
  windowUnit('x', 15, 16, -5.15, 1.4, 1.0, 4.0, { transoms: [3.0] });
  windowUnit('x', 15, 16, 8.3, 1.4, 0.9, 3.4, { transoms: [2.6] });

  // heavy linen / wool drapes either side of the tall windows, hung from iron poles
  function drapes(axis, inner, dirIn, c, w, yTop, col) {
    const h = yTop;
    for (const sgn of [-1, 1]) {
      const a = c + sgn * (w / 2 + 0.2);
      if (axis === 'z') rbox(a, h / 2 + 0.01, inner + dirIn * 0.1, 0.3, h / 2, 0.045, 0.035, M.LINEN, { col, x: 2 });
      else rbox(inner + dirIn * 0.1, h / 2 + 0.01, a, 0.3, h / 2, 0.045, 0.035, M.LINEN, { col, x: 2, rot: [0, 90, 0] });
    }
    const p0 = axis === 'z' ? [c - w / 2 - 0.6, yTop + 0.06, inner + dirIn * 0.14] : [inner + dirIn * 0.14, yTop + 0.06, c - w / 2 - 0.6];
    const p1 = axis === 'z' ? [c + w / 2 + 0.6, yTop + 0.06, inner + dirIn * 0.14] : [inner + dirIn * 0.14, yTop + 0.06, c + w / 2 + 0.6];
    rod(p0, p1, 0.018, M.IRON);
    ell(p0[0], p0[1], p0[2], 0.035, 0.035, 0.035, M.IRON); ell(p1[0], p1[1], p1[2], 0.035, 0.035, 0.035, M.IRON);
  }
  for (const x of GHwin) drapes('z', -10, 1, x, 1.6, 7.0, '#56604a');
  for (const x of libWin) drapes('z', -10, 1, x, 1.4, 4.35, '#7b5836');
  drapes('x', 15, -1, -5.15, 1.4, 4.35, '#7b5836');
  for (const x of bedWin) drapes('z', 10, -1, x, 1.4, 3.75, '#cdc2ac');
  drapes('x', 15, -1, 8.3, 1.4, 3.75, '#cdc2ac');

  // ---------------------------------------------------------------- internal walls
  // A: z = 0 (north rooms | south rooms)
  wallAlongX(-15, 15, 0, YT, -0.3, 0.3, M.STONE, [
    { a: -10.7, b: -9.3, y0: 0, y1: 2.4 },
    { a: 0.6, b: 2.4, y0: 0, y1: 2.9 },
  ]);
  // B: x = 4 (great hall | library)
  wallAlongZ(-10, -0.3, 0, YT, 3.7, 4.3, M.STONE, [{ a: -3.8, b: -2.2, y0: 0, y1: 2.7 }]);
  // C: x = -3 (kitchen | entrance hall)
  wallAlongZ(0.3, 10, 0, YT, -3.3, -2.7, M.STONE, [{ a: 4.3, b: 5.7, y0: 0, y1: 2.4 }]);
  // D: x = 6 (entrance hall | bedroom)
  wallAlongZ(0.3, 10, 0, YT, 5.7, 6.3, M.STONE, [{ a: 5.4, b: 6.6, y0: 0, y1: 2.4 }]);

  // oak lintels over internal doorways (both faces)
  const lintelX = (a, b, y, z0, z1) => { box(a - 0.25, y, z0 - 0.04, b + 0.25, y + 0.28, z1 + 0.04, M.BEAM); };
  const lintelZ = (a, b, y, x0, x1) => { box(x0 - 0.04, y, a - 0.25, x1 + 0.04, y + 0.28, b + 0.25, M.BEAM); };
  lintelX(-10.7, -9.3, 2.4, -0.3, 0.3);
  lintelX(0.6, 2.4, 2.9, -0.3, 0.3);
  lintelZ(-3.8, -2.2, 2.7, 3.7, 4.3);
  lintelZ(4.3, 5.7, 2.4, -3.3, -2.7);
  lintelZ(5.4, 6.6, 2.4, 5.7, 6.3);
  // exterior door lintel inside
  box(0.25, 3.3, 9.96, 2.75, 3.6, 10.02, M.BEAM);

  // ---------------------------------------------------------------- floors
  box(-15, -0.4, -10, 3.7, 0, -0.3, M.OAK_FLOOR, { x: 0 });      // great hall
  box(4.3, -0.4, -10, 15, 0, -0.3, M.OAK_FLOOR, { x: 2 });       // library (chevron)
  box(-15, -0.4, 0.3, -3.3, 0, 10, M.FLAGSTONE);                 // kitchen
  box(-2.7, -0.4, 0.3, 5.7, 0, 10, M.FLAGSTONE, { seed: 7 });    // entrance
  box(6.3, -0.4, 0.3, 15, 0, 10, M.OAK_FLOOR, { x: 1 });         // bedroom
  // door thresholds
  box(-10.7, -0.4, -0.3, -9.3, 0.0, 0.3, M.STONE_TRIM);
  box(0.6, -0.4, -0.3, 2.4, 0.0, 0.3, M.STONE_TRIM);
  box(3.7, -0.4, -3.8, 4.3, 0.0, -2.2, M.STONE_TRIM);
  box(-3.3, -0.4, 4.3, -2.7, 0.0, 5.7, M.STONE_TRIM);
  box(5.7, -0.4, 5.4, 6.3, 0.0, 6.6, M.STONE_TRIM);

  // ---------------------------------------------------------------- ceilings + beams
  function ceiling(x0, x1, z0, z1, y, beamsAlong, spacing) {
    box(x0, y, z0, x1, y + 0.35, z1, M.PLASTER);
    if (beamsAlong === 'z') {
      const n = Math.max(1, Math.round((x1 - x0) / spacing));
      for (let i = 1; i < n; i++) {
        const x = x0 + (x1 - x0) * i / n;
        box(x - 0.15, y - 0.32, z0, x + 0.15, y, z1, M.BEAM);
      }
      // joists between beams
      for (let x = x0 + 0.35; x < x1 - 0.2; x += 0.55) box(x - 0.055, y - 0.12, z0, x + 0.055, y, z1, M.BEAM, { seed: x * 7 });
    } else {
      const n = Math.max(1, Math.round((z1 - z0) / spacing));
      for (let i = 1; i < n; i++) {
        const z = z0 + (z1 - z0) * i / n;
        box(x0, y - 0.3, z - 0.15, x1, y, z + 0.15, M.BEAM);
      }
      for (let z = z0 + 0.35; z < z1 - 0.2; z += 0.55) box(x0, y - 0.11, z - 0.05, x1, y, z + 0.05, M.BEAM, { seed: z * 7 });
    }
  }
  ceiling(4.3, 15, -10, -0.3, 5.0, 'z', 2.2);     // library
  ceiling(-15, -3.3, 0.3, 10, 4.5, 'z', 2.0);     // kitchen
  ceiling(-2.7, 5.7, 0.3, 10, 4.5, 'x', 2.4);     // entrance
  ceiling(6.3, 15, 0.3, 10, 4.2, 'x', 2.0);       // bedroom

  // flat lead roof over everything except the great hall
  box(3.7, 10.8, -10, 15, 11.0, -0.3, M.LEAD);
  box(-15, 10.8, -0.3, 15, 11.0, 10, M.LEAD);

  // ---------------------------------------------------------------- great hall roof + trusses
  const GH = { x0: -15, x1: 3.7, z0: -10, z1: -0.3 };
  const zr = (GH.z0 + GH.z1) / 2;              // ridge z = -5.15
  const yPlate = 7.7, yRidge = 10.72;
  const xc = (GH.x0 + GH.x1) / 2, xw = GH.x1 - GH.x0;
  for (const side of [-1, 1]) {
    const zw = side < 0 ? GH.z0 : GH.z1;
    const A = [xc, yPlate, zw], B = [xc, yRidge, zr];
    const d = V.norm(V.sub(B, A));
    // normal pointing into the room (downwards)
    let n = V.norm(V.cross(d, [1, 0, 0])); if (n[1] > 0) n = V.mul(n, -1);
    const up = V.mul(n, -1);
    const off = (v, s) => V.add(v, V.mul(up, s));
    const ext = V.mul(d, 0.12);
    beam(off(V.sub(A, ext), 0.04), off(V.add(B, ext), 0.04), xw, 0.08, M.BOARDS, up, { x: 0 });
    beam(off(V.sub(A, ext), 0.16), off(V.add(B, ext), 0.16), xw + 0.1, 0.12, M.SLATE, up);
    // purlins
    for (const f of [0.36, 0.7]) {
      const P = V.lerp(A, B, f);
      const p0 = off([GH.x0, P[1], P[2]], -0.14), p1 = off([GH.x1, P[1], P[2]], -0.14);
      beam(p0, p1, 0.22, 0.24, M.BEAM, up);
    }
    // wall plate
    box(GH.x0, yPlate - 0.3, side < 0 ? GH.z0 : GH.z1 - 0.32, GH.x1, yPlate, side < 0 ? GH.z0 + 0.32 : GH.z1, M.BEAM);
  }
  box(GH.x0, yRidge - 0.3, zr - 0.13, GH.x1, yRidge - 0.02, zr + 0.13, M.BEAM); // ridge beam
  const trussX = [-11.25, -7.95, -4.65, -1.35];
  for (const tx of trussX) {
    const yt = 7.25;
    box(tx - 0.16, yt, GH.z0, tx + 0.16, yt + 0.36, GH.z1, M.BEAM, { seed: tx });                 // tie beam
    box(tx - 0.14, yt + 0.36, zr - 0.15, tx + 0.14, yRidge - 0.3, zr + 0.15, M.BEAM, { seed: tx + 1 }); // king post
    for (const side of [-1, 1]) {
      const zw = side < 0 ? GH.z0 : GH.z1;
      const A = [tx, yPlate - 0.05, zw + side * -0.05], B = [tx, yRidge - 0.12, zr];
      const d = V.norm(V.sub(B, A));
      let n = V.norm(V.cross(d, [1, 0, 0])); if (n[1] > 0) n = V.mul(n, -1);
      const o = V.mul(n, 0.2);
      beam(V.add(A, o), V.add(B, o), 0.26, 0.32, M.BEAM, V.mul(n, -1), { seed: tx + side });            // principal rafter
      const strutTop = V.add(V.lerp(A, B, 0.55), V.mul(n, 0.3));
      beam([tx, yt + 0.4, zr + side * 0.14], strutTop, 0.18, 0.18, M.BEAM, [1, 0, 0]);                  // strut
      const zwp = side < 0 ? GH.z0 + 0.14 : GH.z1 - 0.14;
      box(tx - 0.14, 5.1, zwp - 0.14, tx + 0.14, yt, zwp + 0.14, M.BEAM, { seed: tx * 3 + side });        // wall post
      box(tx - 0.24, 4.78, side < 0 ? GH.z0 : GH.z1 - 0.42, tx + 0.24, 5.1, side < 0 ? GH.z0 + 0.42 : GH.z1, M.BEAM, { seed: tx * 7 + side }); // timber corbel
      beam([tx, 5.55, zwp - side * 0.1], [tx, yt + 0.02, zwp - side * 1.55], 0.2, 0.2, M.BEAM, [1, 0, 0]); // arched brace (straight)
    }
  }

  // ---------------------------------------------------------------- towers
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
    const cx = 17 * sx, cz = 12 * sz;
    const R = sz > 0 ? 3.15 : 2.75, Ht = (sz > 0 ? 16.2 : 14.6) + (sx > 0 ? 0.6 : 0), rh = sz > 0 ? 4.2 : 3.4;
    post(cx, -0.5, cz, R, Ht + 0.5, M.STONE);
    post(cx, -0.5, cz, R + 0.2, 0.8, M.STONE_TRIM);
    post(cx, 5.6, cz, R + 0.06, 0.18, M.STONE_TRIM);
    post(cx, Ht - 1.1, cz, R + 0.22, 0.45, M.STONE_TRIM);   // corbel course
    for (let k = 0; k < 18; k++) {                                  // machicolation corbels
      const a = k / 18 * Math.PI * 2;
      add(T.BOX, [cx + Math.cos(a) * (R + 0.1), Ht - 1.45, cz + Math.sin(a) * (R + 0.1)], [0.14, 0.2, 0.18], M.STONE_TRIM, { rot: [0, -a * 180 / Math.PI, 0] });
    }
    cone(cx, Ht - 0.65 + rh, cz, R + 0.45, rh, 0.06, M.SLATE);
    post(cx, Ht - 0.65 + 2 * rh - 0.2, cz, 0.05, 1.3, M.LEAD);
    ell(cx, Ht - 0.65 + 2 * rh + 1.1, cz, 0.12, 0.12, 0.12, M.LEAD);
    // dormer-like lucarne on the roof
    push([cx, 0, cz], Math.atan2(sx, sz) * 180 / Math.PI + 180);
    box(-0.35, Ht - 0.4, R - 0.3, 0.35, Ht + 0.9, R + 0.2, M.STONE_TRIM);
    box(-0.22, Ht - 0.25, R + 0.15, 0.22, Ht + 0.6, R + 0.23, M.GLASS, { flags: F.TRANS });
    beam([-0.45, Ht + 0.85, R + 0.3], [0, Ht + 1.35, R + 0.3], 0.5, 0.06, M.SLATE, [0, 0, 1]);
    beam([0.45, Ht + 0.85, R + 0.3], [0, Ht + 1.35, R + 0.3], 0.5, 0.06, M.SLATE, [0, 0, 1]);
    pop();
    // tower windows (dark recess framed in dressed stone), facing outward diagonally
    const yaw = Math.atan2(sx, sz) * 180 / Math.PI;
    for (const [wy, hh] of [[4.2, 0.9], [9.2, 0.7]]) {
      push([cx, 0, cz], yaw);
      box(-0.45, wy - hh - 0.1, R - 0.2, 0.45, wy + hh + 0.25, R + 0.08, M.STONE_TRIM);
      box(-0.3, wy - hh, R + 0.04, 0.3, wy + hh, R + 0.1, M.GLASS, { flags: F.TRANS });
      box(-0.05, wy - hh, R + 0.04, 0.05, wy + hh, R + 0.13, M.STONE_TRIM);
      pop();
    }
  }

  // ---------------------------------------------------------------- parapet + corbel table
  // outer parapet walls
  box(-16.2, 10.1, -11.25, 16.2, 10.45, -10.9, M.STONE_TRIM);
  box(-16.2, 10.1, 10.9, 16.2, 10.45, 11.25, M.STONE_TRIM);
  box(-16.25, 10.1, -11.2, -15.9, 10.45, 11.2, M.STONE_TRIM);
  box(15.9, 10.1, -11.2, 16.25, 10.45, 11.2, M.STONE_TRIM);
  box(-16.1, 10.45, -11.15, 16.1, 11.7, -10.6, M.STONE);
  box(-16.1, 10.45, 10.6, 16.1, 11.7, 11.15, M.STONE);
  box(-16.15, 10.45, -11.1, -15.6, 11.7, 11.1, M.STONE);
  box(15.6, 10.45, -11.1, 16.15, 11.7, 11.1, M.STONE);
  for (let x = -14.4; x <= 14.5; x += 1.6) {
    box(x - 0.45, 11.7, -11.15, x + 0.45, 12.5, -10.6, M.STONE);
    box(x - 0.45, 11.7, 10.6, x + 0.45, 12.5, 11.15, M.STONE);
    box(x - 0.47, 12.5, -11.18, x + 0.47, 12.6, -10.57, M.STONE_TRIM);
    box(x - 0.47, 12.5, 10.57, x + 0.47, 12.6, 11.18, M.STONE_TRIM);
  }
  for (let z = -8.8; z <= 8.9; z += 1.6) {
    box(-16.15, 11.7, z - 0.45, -15.6, 12.5, z + 0.45, M.STONE);
    box(15.6, 11.7, z - 0.45, 16.15, 12.5, z + 0.45, M.STONE);
    box(-16.18, 12.5, z - 0.47, -15.57, 12.6, z + 0.47, M.STONE_TRIM);
    box(15.57, 12.5, z - 0.47, 16.18, 12.6, z + 0.47, M.STONE_TRIM);
  }
  for (let x = -14.6; x <= 14.7; x += 0.9) {
    box(x - 0.12, 9.55, -11.3, x + 0.12, 10.1, -11.0, M.STONE_TRIM, { seed: x });
    box(x - 0.12, 9.55, 11.0, x + 0.12, 10.1, 11.3, M.STONE_TRIM, { seed: x + 50 });
  }
  for (let z = -9.9; z <= 10.0; z += 0.9) {
    box(-16.3, 9.55, z - 0.12, -16.0, 10.1, z + 0.12, M.STONE_TRIM, { seed: z });
    box(16.0, 9.55, z - 0.12, 16.3, 10.1, z + 0.12, M.STONE_TRIM, { seed: z + 80 });
  }
  // string course at first floor level
  box(-16.12, 5.6, -11.12, 16.12, 5.78, -10.95, M.STONE_TRIM);
  box(-16.12, 5.6, 10.95, 16.12, 5.78, 11.12, M.STONE_TRIM);

  // ---------------------------------------------------------------- chimney stacks
  function chimneyStack(x0, z0, x1, z1, y1, pots) {
    box(x0, YT - 0.2, z0, x1, y1, z1, M.STONE);
    box(x0 - 0.1, y1, z0 - 0.1, x1 + 0.1, y1 + 0.2, z1 + 0.1, M.STONE_TRIM);
    for (const [px, pz] of pots) {
      post(px, y1 + 0.2, pz, 0.17, 0.75, M.TERRACOTTA);
      post(px, y1 + 0.85, pz, 0.2, 0.1, M.TERRACOTTA);
    }
  }
  chimneyStack(-16.3, -6.4, -14.4, -3.9, 13.6, [[-15.35, -5.8], [-15.35, -4.5]]);
  chimneyStack(-16.3, 4.0, -14.4, 6.4, 13.4, [[-15.35, 4.6], [-15.35, 5.8]]);
  chimneyStack(9.9, -0.55, 11.4, 0.55, 13.0, [[10.65, 0]]);

  // ---------------------------------------------------------------- fireplace helper
  function fire(cx, cy, cz, width, depth, axisYaw, scale, lightPower) {
    // local frame: firebox opening faces +z, logs along x
    push([cx, cy, cz], axisYaw);
    const s = scale;
    // andirons
    for (const sx of [-1, 1]) {
      post(sx * width * 0.32, 0, 0.25 * s, 0.022 * s, 0.38 * s, M.IRON);
      ell(sx * width * 0.32, 0.4 * s, 0.25 * s, 0.045 * s, 0.045 * s, 0.045 * s, M.IRON);
      beam([sx * width * 0.32, 0.12 * s, 0.25 * s], [sx * width * 0.32, 0.12 * s, -depth * 0.55], 0.03 * s, 0.03 * s, M.IRON);
    }
    // grate bars
    for (let i = 0; i < 4; i++) beam([-width * 0.36, 0.13 * s, 0.15 * s - i * 0.12 * s], [width * 0.36, 0.13 * s, 0.15 * s - i * 0.12 * s], 0.02 * s, 0.02 * s, M.IRON);
    // logs
    const logs = [[-0.02, 0.2, 0.1, 0.085, 0, 4], [0.03, 0.2, -0.13, 0.09, 0, -5], [0.0, 0.34, -0.02, 0.075, 12, 18], [-0.05, 0.33, 0.02, 0.07, -8, -22]];
    for (const [x, y, z, r, rz, ry] of logs) {
      add(T.CYL, [x * s, y * s, z * s], [r * s, width * 0.34, r * s], M.LOG, { rot: [0, ry, 90 + rz], x: 1 });
    }
    // embers bed
    box(-width * 0.34, 0.0, -depth * 0.45, width * 0.34, 0.06 * s, 0.2 * s, M.LOG, { x: 2 });
    // flames (camera-only emissive volumes)
    const fl = [[-0.22, 0.42, 0.0, 0.16, 0.34, 0.14], [0.05, 0.5, -0.05, 0.2, 0.44, 0.16], [0.28, 0.4, 0.02, 0.14, 0.3, 0.12], [-0.05, 0.36, 0.08, 0.26, 0.2, 0.1]];
    for (const [x, y, z, rx, ry, rz] of fl) ell(x * s * width / 1.2, y * s, z * s, rx * s, ry * s, rz * s, M.FIRE, { flags: F.CAMONLY, collide: false });
    light([-0.22 * s * width / 1.2, 0.42 * s, 0.02 * s], 0.13 * s, lightPower * 0.3, 'fire');
    light([0.05 * s * width / 1.2, 0.52 * s, -0.02 * s], 0.15 * s, lightPower * 0.4, 'fire');
    light([0.26 * s * width / 1.2, 0.4 * s, 0.03 * s], 0.12 * s, lightPower * 0.3, 'fire');
    pop();
  }

  // ---------------------------------------------------------------- furniture helpers (local: front faces +z)
  function lampShadeLight(x, y, z, power, shadeR = 0.2, shadeH = 0.26, col = '#e8dcc4') {
    // drum shade (open cylinder) with bulb inside
    add(T.CONE, [x, y, z], [shadeR, shadeH / 2, shadeR * 0.82], M.SHADE, { r: 1, col, x: power, flags: F.TRANS });
    light([x, y - 0.02, z], 0.035, power, 'lamp');
  }

// returns { nodes: [{mn,mx,start,count,right,axis}], order: [index into boxes] }
function buildTree(boxes) {
  const n = boxes.length;

  // ref = first prim if count>0 else packed-node index of the child.

    nodeData[o + 7] = c.count;

  packedAll.forEach(({ ti, ni }, pi) => {
    const row = Math.floor(pi / nodesPerRow), col = (pi % nodesPerRow) * 4;
    const o = (row * NW + col) * 4;

  const n = orderedPrims.length;

  for (let i = 0; i < n; i++) {
    const p = orderedPrims[i];
    const row = Math.floor(i / primsPerRow), col = (i % primsPerRow) * 4;
    const o = (row * PW + col) * 4;
    primData.set([p.c[0], p.c[1], p.c[2], p.type + 8 * p.flags + 256 * Math.round(Math.min(p.p0, 60) * 1000)], o);

    primData.set(p.q, o + 8);
    primData.set([p.p0, p.seed, p.col, p.extra], o + 12);
  }
  return { nodeData, nodeW: NW, nodeRows, primData, primW: PW, primRows, nodeCount: packedAll.length, roots, counts: sets.map(s => s.length) };
}

  if (!open && abs(rd.y) > 1e-9){
    for (int i = 0; i < 2; i++){
      float sy = i == 0 ? -1.0 : 1.0; float rr = i == 0 ? ra : rb;
      float tc = (sy*hh - ro.y)/rd.y;
      if (tc > tmin && tc < t){ vec2 q = ro.xz + tc*rd.xz; if (dot(q, q) <= rr*rr){ t = tc; n = vec3(0, sy, 0); } }
    }
  }
  return t < 1e29 ? t : -1.0;
}

// unified quadric: F(p) = A.x x^2 + A.y y^2 + A.z z^2 + 2 B y + C, clipped to |y| <= hh, optional caps
float iQuad(vec3 o, vec3 d, vec3 A, float B, float C, float hh, bool caps, float tmin, out vec3 n){
  float a = dot(A, d*d);
  float b = dot(A, o*d) + B*d.y;
  float c = dot(A, o*o) + 2.0*B*o.y + C;
  float h = b*b - a*c;
  float t = 1e30;
  if (h >= 0.0 && abs(a) > 1e-14){
    h = sqrt(h);
    float t0 = (-b - h)/a, t1 = (-b + h)/a;
    float tn = min(t0, t1), tf = max(t0, t1);
    if (tn > tmin && abs(o.y + tn*d.y) <= hh) t = tn;
    else if (tf > tmin && abs(o.y + tf*d.y) <= hh) t = tf;
  }
  if (caps){
    float ty0 = (-hh - o.y)/d.y, ty1 = (hh - o.y)/d.y;
    vec3 p0 = o + ty0*d, p1 = o + ty1*d;
    float yy = A.y*hh*hh + C;
    float F0 = A.x*p0.x*p0.x + A.z*p0.z*p0.z + yy - 2.0*B*hh;
    float F1 = A.x*p1.x*p1.x + A.z*p1.z*p1.z + yy + 2.0*B*hh;
    if (ty0 > tmin && ty0 < t && F0 <= 0.0){ t = ty0; }
    if (ty1 > tmin && ty1 < t && F1 <= 0.0){ t = ty1; }
  }
  if (t > 1e29) return -1.0;
  vec3 p = o + t*d;
  if (caps && abs(abs(p.y) - hh) < 1e-5*max(hh, 1.0) + 1e-6) n = vec3(0.0, sign(p.y), 0.0);
  else n = normalize(vec3(A.x*p.x, A.y*p.y + B, A.z*p.z));
  return t;
}

float primHit(int id, vec3 ro, vec3 rd, float tmin, out vec3 lp, out vec3 ln, out int flags){
  vec4 a = texelFetch(uPrims, pUV(id, 0), 0);
  vec4 b = texelFetch(uPrims, pUV(id, 1), 0);
  vec4 q = texelFetch(uPrims, pUV(id, 2), 0);
  int tf = int(a.w + 0.5);
  int type = tf & 7; flags = (tf >> 3) & 31;
  float p0 = float(tf >> 8)*0.001;
  vec3 o = qinv(q, ro - a.xyz), d = qinv(q, rd);
  d = vec3(abs(d.x) < 1e-9 ? 1e-9 : d.x, abs(d.y) < 1e-9 ? 1e-9 : d.y, abs(d.z) < 1e-9 ? 1e-9 : d.z);
  float t = -1.0; vec3 n = vec3(0, 1, 0);
  {
    float op = p0;
    vec3 A; float B, C;
    if (type == 3){ A = 1.0/(b.xyz*b.xyz); B = 0.0; C = -1.0; }
    else {
      float m = type == 4 ? (b.z - b.x)/(2.0*b.y) : 0.0;
      float c0 = type == 4 ? 0.5*(b.x + b.z) : b.x;
      A = vec3(1.0, -m*m, 1.0); B = -m*c0; C = -c0*c0;
    }
    t = iQuad(o, d, A, B, C, b.y, type != 3 && op < 0.5, tmin, n);
  }
  lp = o + t*d; ln = n;
  return t;
}

float boxHit(int id, vec3 ro, vec3 rd, float tmin, out vec3 lp, out vec3 ln, out int flags){
  vec4 a = texelFetch(uPrims, pUV(id, 0), 0);
  vec4 b = texelFetch(uPrims, pUV(id, 1), 0);
  vec4 q = texelFetch(uPrims, pUV(id, 2), 0);
  flags = (int(a.w + 0.5) >> 3) & 31;
  vec3 o = qinv(q, ro - a.xyz), d = qinv(q, rd);
  d = vec3(abs(d.x) < 1e-9 ? 1e-9 : d.x, abs(d.y) < 1e-9 ? 1e-9 : d.y, abs(d.z) < 1e-9 ? 1e-9 : d.z);
  vec3 n = vec3(0, 1, 0);
  float t = iBox(o, d, b.xyz, tmin, n);
  lp = o + t*d; ln = n;
  return t;
}

float rboxHit(int id, vec3 ro, vec3 rd, float tmin, out vec3 lp, out vec3 ln, out int flags){
  vec4 a = texelFetch(uPrims, pUV(id, 0), 0);
  vec4 b = texelFetch(uPrims, pUV(id, 1), 0);
  vec4 q = texelFetch(uPrims, pUV(id, 2), 0);
  int tf = int(a.w + 0.5);
  flags = (tf >> 3) & 31;
  float rad = float(tf >> 8)*0.001;
  vec3 o = qinv(q, ro - a.xyz), d = qinv(q, rd);
  d = vec3(abs(d.x) < 1e-9 ? 1e-9 : d.x, abs(d.y) < 1e-9 ? 1e-9 : d.y, abs(d.z) < 1e-9 ? 1e-9 : d.z);
  vec3 n = vec3(0, 1, 0);
  float t = iRBox(o, d, b.xyz, rad, tmin, n);
  lp = o + t*d; ln = n;
  return t;
}

const float GROUND_Y = -0.5;
uniform int uRoot0, uRoot1, uRoot2;

struct Hit { float t; int id; vec3 lp; vec3 ln; };

vec2 aabb(vec3 mn, vec3 mx, vec3 ro, vec3 inv){
  vec3 t0 = (mn - ro)*inv, t1 = (mx - ro)*inv;
  vec3 a = min(t0, t1), b = max(t0, t1);
  return vec2(max(max(a.x, a.y), a.z), min(min(b.x, b.y), b.z));
}

// closest hit. camRay: include camera-only primitives.
void traceBoxes(vec3 ro, vec3 rd, vec3 inv, bool camRay, int root, inout Hit h){
  int stack[32]; int sp = 0; stack[sp++] = root;
  while (sp > 0){
    int ni = stack[--sp];
    vec4 a0 = texelFetch(uNodes, nUV(ni, 0), 0), a1 = texelFetch(uNodes, nUV(ni, 1), 0);
    vec4 b0 = texelFetch(uNodes, nUV(ni, 2), 0), b1 = texelFetch(uNodes, nUV(ni, 3), 0);
    vec2 ta = aabb(a0.xyz, a1.xyz, ro, inv), tb = aabb(b0.xyz, b1.xyz, ro, inv);
    bool ha = ta.x <= ta.y && ta.y >= 0.0 && ta.x <= h.t;
    bool hb = tb.x <= tb.y && tb.y >= 0.0 && tb.x <= h.t;
    if (ha && a1.w > 0.0){
      int s = int(a0.w + 0.5), cnt = int(a1.w + 0.5);
      for (int i = 0; i < cnt; i++){
        vec3 lp, ln; int fl;
        float t = boxHit(s + i, ro, rd, 1e-4, lp, ln, fl);
        if (t > 0.0 && t < h.t && (camRay || (fl & 1) == 0)){ h.t = t; h.id = s + i; h.lp = lp; h.ln = ln; }
      }
      ha = false;
    }
    if (hb && b1.w > 0.0){
      int s = int(b0.w + 0.5), cnt = int(b1.w + 0.5);
      for (int i = 0; i < cnt; i++){
        vec3 lp, ln; int fl;
        float t = boxHit(s + i, ro, rd, 1e-4, lp, ln, fl);
        if (t > 0.0 && t < h.t && (camRay || (fl & 1) == 0)){ h.t = t; h.id = s + i; h.lp = lp; h.ln = ln; }
      }
      hb = false;
    }
    if (ha && hb){
      int na = int(a0.w + 0.5), nb = int(b0.w + 0.5);
      if (ta.x < tb.x){ stack[sp++] = nb; stack[sp++] = na; } else { stack[sp++] = na; stack[sp++] = nb; }
    } else if (ha) stack[sp++] = int(a0.w + 0.5);
    else if (hb) stack[sp++] = int(b0.w + 0.5);
  }
}
void traceRounded(vec3 ro, vec3 rd, vec3 inv, bool camRay, int root, inout Hit h){
  int stack[32]; int sp = 0; stack[sp++] = root;
  while (sp > 0){
    int ni = stack[--sp];
    vec4 a0 = texelFetch(uNodes, nUV(ni, 0), 0), a1 = texelFetch(uNodes, nUV(ni, 1), 0);
    vec4 b0 = texelFetch(uNodes, nUV(ni, 2), 0), b1 = texelFetch(uNodes, nUV(ni, 3), 0);
    vec2 ta = aabb(a0.xyz, a1.xyz, ro, inv), tb = aabb(b0.xyz, b1.xyz, ro, inv);
    bool ha = ta.x <= ta.y && ta.y >= 0.0 && ta.x <= h.t;
    bool hb = tb.x <= tb.y && tb.y >= 0.0 && tb.x <= h.t;
    if (ha && a1.w > 0.0){
      int s = int(a0.w + 0.5), cnt = int(a1.w + 0.5);
      for (int i = 0; i < cnt; i++){
        vec3 lp, ln; int fl;
        float t = rboxHit(s + i, ro, rd, 1e-4, lp, ln, fl);
        if (t > 0.0 && t < h.t && (camRay || (fl & 1) == 0)){ h.t = t; h.id = s + i; h.lp = lp; h.ln = ln; }
      }
      ha = false;
    }
    if (hb && b1.w > 0.0){
      int s = int(b0.w + 0.5), cnt = int(b1.w + 0.5);

        vec3 lp, ln; int fl;
        float t = rboxHit(s + i, ro, rd, 1e-4, lp, ln, fl);
        if (t > 0.0 && t < h.t && (camRay || (fl & 1) == 0)){ h.t = t; h.id = s + i; h.lp = lp; h.ln = ln; }
      }
      hb = false;
    }
    if (ha && hb){
      int na = int(a0.w + 0.5), nb = int(b0.w + 0.5);
      if (ta.x < tb.x){ stack[sp++] = nb; stack[sp++] = na; } else { stack[sp++] = na; stack[sp++] = nb; }
    } else if (ha) stack[sp++] = int(a0.w + 0.5);
    else if (hb) stack[sp++] = int(b0.w + 0.5);
  }
}
void traceShapes(vec3 ro, vec3 rd, vec3 inv, bool camRay, int root, inout Hit h){
  int stack[32]; int sp = 0; stack[sp++] = root;
  while (sp > 0){
    int ni = stack[--sp];
    vec4 a0 = texelFetch(uNodes, nUV(ni, 0), 0), a1 = texelFetch(uNodes, nUV(ni, 1), 0);
    vec4 b0 = texelFetch(uNodes, nUV(ni, 2), 0), b1 = texelFetch(uNodes, nUV(ni, 3), 0);
    vec2 ta = aabb(a0.xyz, a1.xyz, ro, inv), tb = aabb(b0.xyz, b1.xyz, ro, inv);
    bool ha = ta.x <= ta.y && ta.y >= 0.0 && ta.x <= h.t;
    bool hb = tb.x <= tb.y && tb.y >= 0.0 && tb.x <= h.t;
    if (ha && a1.w > 0.0){
      int s = int(a0.w + 0.5), cnt = int(a1.w + 0.5);
      for (int i = 0; i < cnt; i++){
        vec3 lp, ln; int fl;
        float t = primHit(s + i, ro, rd, 1e-4, lp, ln, fl);
        if (t > 0.0 && t < h.t && (camRay || (fl & 1) == 0)){ h.t = t; h.id = s + i; h.lp = lp; h.ln = ln; }
      }
      ha = false;
    }
    if (hb && b1.w > 0.0){
      int s = int(b0.w + 0.5), cnt = int(b1.w + 0.5);
      for (int i = 0; i < cnt; i++){
        vec3 lp, ln; int fl;
        float t = primHit(s + i, ro, rd, 1e-4, lp, ln, fl);
        if (t > 0.0 && t < h.t && (camRay || (fl & 1) == 0)){ h.t = t; h.id = s + i; h.lp = lp; h.ln = ln; }
      }
      hb = false;
    }
    if (ha && hb){
      int na = int(a0.w + 0.5), nb = int(b0.w + 0.5);
      if (ta.x < tb.x){ stack[sp++] = nb; stack[sp++] = na; } else { stack[sp++] = na; stack[sp++] = nb; }
    } else if (ha) stack[sp++] = int(a0.w + 0.5);
    else if (hb) stack[sp++] = int(b0.w + 0.5);
  }
}

// closest hit. camRay: include camera-only primitives.
bool trace(vec3 ro, vec3 rd, float tmax, bool camRay, out Hit h){
  h.t = tmax; h.id = -1;
  vec3 inv = 1.0/vec3(abs(rd.x) < 1e-9 ? 1e-9 : rd.x, abs(rd.y) < 1e-9 ? 1e-9 : rd.y, abs(rd.z) < 1e-9 ? 1e-9 : rd.z);
  if (rd.y < 0.0){ float tg = (GROUND_Y - ro.y)/rd.y; if (tg > 1e-4 && tg < h.t){ h.t = tg; h.id = -2; h.lp = ro + rd*tg; h.ln = vec3(0, 1, 0); } }
  traceBoxes(ro, rd, inv, camRay, uRoot0, h);
  traceRounded(ro, rd, inv, camRay, uRoot1, h);
  traceShapes(ro, rd, inv, camRay, uRoot2, h);
  return h.id != -1;
}

// ------------------------------------------------ materials
struct Mat { vec3 alb; float rough; float metal; float spec; vec3 emit; vec3 n; float trans; };

vec3 unpackCol(float v, vec3 def){
  if (v < 0.5) return def;
  float r = floor(v/65536.0), g = floor(mod(v/256.0, 256.0)), b = mod(v, 256.0);
  return srgb2lin(vec3(r, g, b)/255.0);
}

void faceUV(vec3 p, vec3 n, out vec2 uv, out vec3 tu, out vec3 tv){
  vec3 a = abs(n);
  if (a.y >= a.x && a.y >= a.z){ uv = p.xz; tu = vec3(1, 0, 0); tv = vec3(0, 0, 1); }
  else if (a.x >= a.z){ uv = vec2(p.z, p.y); tu = vec3(0, 0, 1); tv = vec3(0, 1, 0); }
  else { uv = p.xy; tu = vec3(1, 0, 0); tv = vec3(0, 1, 0); }
}

// grain frame: g.x along the longest axis of the prim
vec3 grainFrame(vec3 p, vec3 hs){
  if (hs.x >= hs.y && hs.x >= hs.z) return p;
  if (hs.y >= hs.z) return p.yzx;
  return p.zxy;
}

float woodTone(vec3 g, float seed, out float late){
  vec2 c = g.yz + vec2(0.35 + seed*0.37, -0.22 + seed*0.21);
  vec3 gp = g*vec3(0.5, 4.0, 4.0);
  c += 0.05*vec2(vnoise3(gp + seed), vnoise3(gp + seed + 7.3)) - 0.025;
  float r = length(c)*42.0 + 1.6*vnoise3(g*vec3(0.25, 3.0, 3.0) + seed);
  float f = fract(r);
  late = smoothstep(0.45, 0.85, f)*smoothstep(1.0, 0.9, f);
  float streak = vnoise3(g*vec3(1.5, 40.0, 40.0) + seed)*0.6;
  float pores = vnoise3(g*vec3(12.0, 400.0, 400.0));
  return 1.0 - 0.13*late - 0.1*streak - 0.05*pores*late;
}

// generic irregular block pattern (stone courses, flagstones)
float blocks(vec2 uv, float rowH, float minL, float maxL, float wob, float seed, out vec2 cell, out vec2 local, out vec2 size){
  vec2 w = uv + wob*vec2(vnoise2(uv*2.3 + seed), vnoise2(uv*2.3 + seed + 17.3)) - wob*0.5;
  w.y += rowH*0.45*vnoise2(vec2(w.y/rowH*0.37, seed + 3.0));   // courses of varying height
  float row = floor(w.y/rowH);
  float bl = minL + (maxL - minL)*hash11(row*1.37 + 2.1 + seed);
  float xo = w.x + hash11(row + 5.3 + seed)*7.0;
  float col = floor(xo/bl);
  local = vec2(fract(xo/bl)*bl, fract(w.y/rowH)*rowH);
  size = vec2(bl, rowH);
  cell = vec2(col, row);
  // random-ashlar: some stones are split into two courses or two shorter stones
  float hs = hash12(cell + seed*1.7);
  if (hs < 0.3){ float up = step(rowH*0.5, local.y); local.y -= up*rowH*0.5; size.y = rowH*0.5; cell += vec2(0.0, up*0.5); }
  else if (hs > 0.78){ float rt = step(bl*0.45, local.x); local.x -= rt*bl*0.45; size.x = mix(bl*0.45, bl*0.55, rt); cell += vec2(rt*0.5, 0.0); }
  return min(min(local.x, size.x - local.x), min(local.y, size.y - local.y));
}

float stoneHeight(vec2 uv, float seed, float rowH, float minL, float maxL, float wob, out vec2 cell, out float dE){
  vec2 local, size;
  dE = blocks(uv, rowH, minL, maxL, wob, seed, cell, local, size);
  float rnd1 = hash12(cell + seed);
  float pillow = smoothstep(0.0, 0.06 + 0.04*rnd1, dE);
  float rough = vnoise2(uv*18.0 + cell*3.1)*0.25 + vnoise2(uv*55.0)*0.1;
  return pillow*0.9 + rough*pillow;
}

// books on a shelf. local p in box space; hs half size. returns albedo & metal mask.
vec3 books(vec3 p, vec3 n, vec3 hs, float seed, out float metal, out float rough, out vec3 bump){
  metal = 0.0; rough = 0.55; bump = vec3(0);
  float x = p.x + hs.x + seed*3.1;
  float y = p.y + hs.y;
  float cellW = 0.043;
  float ci = floor(x/cellW); float fx = fract(x/cellW);
  float hc = hash11(ci*1.7 + seed);
  float split = 0.35 + 0.3*hash11(ci*3.1 + seed*1.3);
  float bi = ci*2.0 + (hc > 0.5 && fx > split ? 1.0 : 0.0);
  float bx0 = (hc > 0.5 && fx > split) ? split : 0.0;
  float bx1 = (hc > 0.5 && fx <= split) ? split : 1.0;
  float u = (fx - bx0)/(bx1 - bx0);
  float h1 = hash11(bi*0.73 + seed*2.0);
  float bh = (2.0*hs.y)*(0.64 + 0.33*hash11(bi*1.31 + seed));
  float gap = step(0.93, hash11(bi*5.3 + seed*0.7));
  if (y > bh || gap > 0.5){ return vec3(0.012, 0.009, 0.007); }
  if (n.z < 0.5){ return (n.y > 0.5) ? vec3(0.55, 0.5, 0.4) : vec3(0.1, 0.07, 0.05); }
  vec3 pal[8];
  pal[0] = vec3(0.23, 0.035, 0.03); pal[1] = vec3(0.04, 0.08, 0.05); pal[2] = vec3(0.03, 0.045, 0.1);
  pal[3] = vec3(0.35, 0.22, 0.11); pal[4] = vec3(0.02, 0.018, 0.016); pal[5] = vec3(0.42, 0.33, 0.2);
  pal[6] = vec3(0.16, 0.05, 0.02); pal[7] = vec3(0.3, 0.26, 0.2);
  vec3 c = pal[int(h1*7.99)];
  c *= 0.75 + 0.5*hash11(bi*9.1);
  float yy = y/bh;
  // gilt bands and labels
  float band = step(abs(yy - 0.9), 0.012) + step(abs(yy - 0.86), 0.006) + step(abs(yy - 0.12), 0.01);
  float label = step(abs(yy - 0.74), 0.045)*step(0.5, hash11(bi*2.9));
  c = mix(c, c*0.45 + vec3(0.12, 0.02, 0.01), label);
  if (band > 0.5 && hash11(bi*4.4) > 0.35){ metal = 1.0; rough = 0.35; c = vec3(0.75, 0.56, 0.25)*0.8; }
  // wear and dust
  c *= 0.85 + 0.3*vnoise2(vec2(x*40.0, y*9.0));
  // rounded spine
  float s = (u - 0.5)*2.0;
  bump = vec3(s*0.55, 0, 0);
  // dark gap between books
  float edge = min(u, 1.0 - u)*(bx1 - bx0)*cellW;
  c *= smoothstep(0.0, 0.0025, edge)*0.8 + 0.2;
  return c;
}

vec3 rugPattern(vec2 p, vec2 hs, float variant){
  // Persian / Heriz-style: guard stripes, rosette border, floral field, lobed central medallion, corner spandrels
  vec3 red = vec3(0.3, 0.07, 0.045), indigo = vec3(0.04, 0.055, 0.12), ivory = vec3(0.52, 0.45, 0.33), gold = vec3(0.4, 0.28, 0.12), rust = vec3(0.36, 0.14, 0.06);
  if (variant > 3.5){ red = vec3(0.36, 0.28, 0.2); indigo = vec3(0.08, 0.1, 0.15); rust = vec3(0.3, 0.2, 0.14); }
  else if (variant > 2.5){ red = vec3(0.22, 0.06, 0.04); indigo = vec3(0.05, 0.07, 0.13); }
  else if (variant > 1.5){ vec3 tt = red; red = indigo*1.3; indigo = tt*0.8; }
  vec2 d = hs - abs(p);
  float e = min(d.x, d.y);
  float bw = min(0.36, min(hs.x, hs.y)*0.28);
  vec3 c;
  if (e < 0.03) c = indigo*0.7;
  else if (e < 0.05) c = ivory*0.8;
  else if (e < bw){
    // main border: rosettes along the edge on an indigo ground with a meandering vine
    float along = d.x < d.y ? p.y : p.x;
    float t = (e - 0.05)/(bw - 0.05);
    vec2 q = vec2(fract(along/0.22) - 0.5, t - 0.5);
    float ros = smoothstep(0.26, 0.2, length(q*vec2(1.0, 0.9)));
    float petal = step(0.5, fract(atan(q.y, q.x)*1.27 + 0.5))*ros;
    c = indigo;
    float vine = smoothstep(0.06, 0.02, abs(q.y - 0.3*sin(along*28.0)));
    c = mix(c, gold, vine*0.7);
    c = mix(c, red, ros);
    c = mix(c, ivory, petal*0.7);
    if (t < 0.06 || t > 0.94) c = rust;
  } else if (e < bw + 0.04) c = ivory*0.75;
  else {
    vec2 f = p/(hs - bw);
    float med = length(f*vec2(1.0, 1.35));
    float ang = atan(f.y, f.x);
    float lobe = 0.42 + 0.05*cos(ang*8.0);
    // field: dense floral lattice
    vec2 g = fract(p*3.3) - 0.5;
    float fl = smoothstep(0.2, 0.12, length(g));
    float lat = smoothstep(0.04, 0.0, abs(abs(g.x) + abs(g.y) - 0.45));
    c = red;
    c = mix(c, indigo, lat*0.8);
    c = mix(c, mix(ivory, gold, step(0.5, hash12(floor(p*3.3)))), fl*0.75);
    // corner spandrels
    float cs = length((abs(f) - 1.0)*vec2(1.0, 1.3));
    if (cs < 0.45){ c = mix(indigo, ivory*0.7, smoothstep(0.05, 0.0, abs(cs - 0.3))); c = mix(c, red, smoothstep(0.12, 0.08, cs)); }
    if (med < lobe){
      c = mix(indigo, ivory*0.85, smoothstep(0.03, 0.0, abs(med - lobe + 0.05)));
      c = mix(c, red, smoothstep(0.2, 0.17, med));
      c = mix(c, gold, smoothstep(0.08, 0.05, med));
      float star = step(0.5, fract(ang*8.0/6.2832 + med*3.0));
      c = mix(c, c*0.75 + ivory*0.2, star*step(0.2, med)*0.4);
    }
  }
  // abrash (dye banding), wear and pile
  c *= 0.85 + 0.3*vnoise2(vec2(p.x*0.8, p.y*6.0));
  c *= 0.85 + 0.25*vnoise2(p*3.0) + 0.1*vnoise2(p*90.0);
  float fade = 0.25 + 0.2*vnoise2(p*1.3);
  c = mix(c, vec3(lum(c))*vec3(1.08, 1.0, 0.88), fade);
  float worn = smoothstep(0.55, 0.8, fbm2(p*1.1 + 3.0));
  c = mix(c, vec3(0.3, 0.25, 0.19), worn*0.35);
  return c;
}

vec3 paintingColor(vec2 uv, float variant, float seed){
  vec3 c;
  if (variant > 3.5){
    // verdure tapestry: foliage field, faded, with a woven border
    vec2 e = min(uv, 1.0 - uv);
    float border = step(min(e.x, e.y*1.3), 0.07);
    float f1 = fbm2(uv*vec2(7.0, 5.0) + seed), f2 = fbm2(uv*vec2(16.0, 12.0) + seed + 4.0);
    c = mix(vec3(0.07, 0.1, 0.07), vec3(0.2, 0.22, 0.12), smoothstep(0.35, 0.7, f1));
    c = mix(c, vec3(0.32, 0.27, 0.15), smoothstep(0.62, 0.8, f2)*0.8);
    c = mix(c, vec3(0.1, 0.12, 0.16), smoothstep(0.55, 0.75, fbm2(uv*3.0 + 9.0))*0.5*step(0.55, uv.y));
    vec3 bc = mix(vec3(0.25, 0.12, 0.07), vec3(0.4, 0.32, 0.18), step(0.5, fract((uv.x + uv.y)*18.0)));
    c = mix(c, bc, border);
    c *= 0.85 + 0.15*step(0.5, fract(uv.x*260.0))*step(0.5, fract(uv.y*200.0)) + 0.1*vnoise2(uv*300.0);
    return mix(c, vec3(lum(c)), 0.2)*1.1;
  }
  if (variant > 2.5){
    // seascape
    float hor = 0.38;
    vec3 sky = mix(vec3(0.52, 0.46, 0.34), vec3(0.2, 0.24, 0.27), smoothstep(hor, 1.0, uv.y));
    float cl = fbm2(uv*vec2(3.0, 7.0) + seed);
    sky = mix(sky, vec3(0.65, 0.58, 0.44), smoothstep(0.5, 0.8, cl)*0.7);
    sky = mix(sky, vec3(0.15, 0.15, 0.14), smoothstep(0.55, 0.85, fbm2(uv*vec2(2.0, 5.0) + seed + 3.0))*0.5);
    vec3 sea = mix(vec3(0.07, 0.1, 0.09), vec3(0.18, 0.2, 0.16), vnoise2(uv*vec2(4.0, 40.0)));
    sea += vec3(0.25, 0.22, 0.15)*smoothstep(0.72, 0.95, vnoise2(uv*vec2(12.0, 90.0)))*smoothstep(0.1, hor, uv.y);
    c = uv.y > hor ? sky : sea;
    // ship
    vec2 s = uv - vec2(0.62, hor);
    if (s.y > 0.0 && s.y < 0.22 && abs(s.x) < 0.07*(1.0 - s.y*3.0) + 0.01 && s.y > 0.03) c = mix(c, vec3(0.6, 0.55, 0.42), 0.7);
    if (s.y > -0.01 && s.y < 0.03 && abs(s.x) < 0.08) c = vec3(0.08, 0.06, 0.04);
  } else if (variant > 1.5){
    // ancestral portrait
    c = vec3(0.045, 0.035, 0.025)*(0.8 + 0.5*fbm2(uv*3.0 + seed));
    c += vec3(0.05, 0.035, 0.015)*smoothstep(0.6, 0.0, length(uv - vec2(0.35, 0.75)));
    vec2 f = (uv - vec2(0.5, 0.68))*vec2(1.0, 0.78);
    float face = smoothstep(0.13, 0.12, length(f));
    vec3 skin = vec3(0.56, 0.4, 0.3)*(0.8 + 0.3*(0.5 - f.x*2.0));
    vec2 bdy = uv - vec2(0.5, 0.0);
    float body = step(bdy.y, 0.52)*step(abs(bdy.x), 0.18 + (0.52 - bdy.y)*0.55);
    vec3 coat = vec3(0.04, 0.04, 0.05) + vec3(0.03)*vnoise2(uv*20.0);
    if (seed > 50.0) coat = vec3(0.12, 0.03, 0.02);
    float collar = step(abs(uv.x - 0.5), 0.06)*step(abs(uv.y - 0.5), 0.04);
    c = mix(c, coat, body);
    c = mix(c, vec3(0.6, 0.57, 0.5), collar);
    c = mix(c, skin, face);
    float hair = smoothstep(0.15, 0.13, length((uv - vec2(0.5, 0.74))*vec2(1.0, 0.9)))*step(0.73, uv.y + f.x*0.1);
    c = mix(c, vec3(0.08, 0.06, 0.04), hair*0.9);
  } else {
    // pastoral landscape
    float hor = 0.42 + 0.05*vnoise2(vec2(uv.x*3.0, seed));
    vec3 sky = mix(vec3(0.62, 0.55, 0.4), vec3(0.3, 0.36, 0.38), smoothstep(hor, 1.0, uv.y));
    float cl = fbm2(uv*vec2(3.0, 6.0) + seed);
    sky = mix(sky, vec3(0.72, 0.66, 0.52), smoothstep(0.45, 0.75, cl)*0.8);
    float hill = hor + 0.06*fbm2(vec2(uv.x*4.0, seed + 2.0)) - 0.02;
    vec3 land = mix(vec3(0.22, 0.24, 0.14), vec3(0.3, 0.3, 0.18), vnoise2(uv*6.0));
    land = mix(land, vec3(0.35, 0.33, 0.25), smoothstep(hill - 0.08, hill, uv.y)*0.6);
    c = uv.y > hill ? sky : land;
    float fg = smoothstep(0.3, 0.05, uv.y);
    c = mix(c, vec3(0.1, 0.08, 0.04), fg*0.8);
    float trees = step(0.52, fbm2(uv*vec2(7.0, 9.0) + seed*1.7))*step(uv.y, hill + 0.22*smoothstep(0.55, 0.0, abs(uv.x - 0.2)))*step(0.25, uv.y);
    c = mix(c, vec3(0.06, 0.07, 0.03)*(0.7 + 0.6*vnoise2(uv*40.0)), trees);
    // cattle
    for (int i = 0; i < 3; i++){
      vec2 cp = vec2(0.55 + float(i)*0.09, 0.3 + float(i%2)*0.02);
      vec2 d = (uv - cp)*vec2(1.0, 1.8);
      if (length(d) < 0.022) c = mix(vec3(0.3, 0.2, 0.12), vec3(0.55, 0.5, 0.4), float(i == 1));
    }
  }
  // aged varnish, darkened edges, craquelure
  c *= vec3(1.0, 0.9, 0.66)*0.85;
  vec2 e = min(uv, 1.0 - uv);
  c *= 0.55 + 0.45*smoothstep(0.0, 0.18, min(e.x, e.y));
  vec2 vg = uv*vec2(28.0, 34.0);
  vec2 fv = fract(vg) - 0.5 + 0.3*(hash22(floor(vg)) - 0.5);
  c *= 0.9 + 0.1*smoothstep(0.02, 0.06, min(abs(fv.x), abs(fv.y)));
  c *= 0.9 + 0.2*vnoise2(uv*120.0);
  return c;
}

vec3 globeColor(vec3 n){
  float lat = asin(clamp(n.y, -1.0, 1.0));
  float lon = atan(n.z, n.x);
  float land = fbm3(n*2.2 + 3.0);
  vec3 sea = vec3(0.34, 0.33, 0.24);
  vec3 ground = mix(vec3(0.45, 0.3, 0.15), vec3(0.38, 0.35, 0.2), vnoise3(n*9.0));
  vec3 c = land > 0.55 ? ground : sea;
  if (abs(land - 0.55) < 0.008) c *= 0.4;
  float grid = min(abs(fract(lat*6.0/PI) - 0.5), abs(fract(lon*6.0/PI) - 0.5));
  c *= 0.85 + 0.15*smoothstep(0.0, 0.02, 0.5 - grid);
  return c*vec3(1.0, 0.92, 0.72);
}

float sootAt(vec3 p){
  float s = 0.0;
  vec3 d = (p - vec3(-14.0, 2.55, -5.15))/vec3(0.4, 1.1, 1.5); s = max(s, 1.0 - dot(d, d));
  d = (p - vec3(-14.0, 2.6, 5.15))/vec3(0.4, 1.2, 1.8); s = max(s, 1.0 - dot(d, d));
  d = (p - vec3(10.65, 1.25, 0.97))/vec3(0.7, 0.6, 0.25); s = max(s, 1.0 - dot(d, d));
  return clamp(s, 0.0, 1.0);
}
bool insideCastle(vec3 p){ return abs(p.x) < 15.02 && abs(p.z) < 10.02 && p.y < 10.85 && p.y > -0.45; }
int roomId(vec3 p){
  if (!(abs(p.x) < 15.67 && abs(p.z) < 10.67 && p.y < 10.9 && p.y > -0.45)) return 0;
  if (p.z < 0.0) return p.x < 4.0 ? 1 : 2;
  if (p.x < -3.0) return 3;
  return p.x < 6.0 ? 4 : 5;
}

vec3 ember(vec3 p, float amt){
  float n = vnoise3(p*28.0 + vec3(0.0, uTime*0.7, 0.0));
  float n2 = vnoise3(p*9.0 - vec3(uTime*0.3));
  float g = pow(clamp(n*0.7 + n2*0.5 - 0.2, 0.0, 1.0), 3.0)*3.0;
  return uFireCol*uFireI*g*amt*0.5;
}

Mat getMat(int mid, vec3 wp, vec3 lp, vec3 ln, vec3 hs, vec4 prm, vec4 q, int type, bool hq){
  Mat m; m.alb = vec3(0.5); m.rough = 0.8; m.metal = 0.0; m.spec = 0.04; m.emit = vec3(0); m.trans = 0.0;
  vec3 bump = vec3(0);   // in local space
  float seed = prm.y;
  vec2 uv; vec3 tu, tv;

  if (mid == 0 || mid == 1){
    // ---- stone walls (rubble courses) / dressed trim
    bool trim = mid == 1;
    vec3 wn = qrot(q, ln);
    vec3 wa = abs(wn);
    vec2 wuv; vec3 wtu, wtv;
    if (wa.y >= wa.x && wa.y >= wa.z){ wuv = wp.xz; wtu = vec3(1,0,0); wtv = vec3(0,0,1); }
    else if (wa.x >= wa.z){ wuv = vec2(wp.z, wp.y); wtu = vec3(0,0,1); wtv = vec3(0,1,0); }
    else { wuv = wp.xy; wtu = vec3(1,0,0); wtv = vec3(0,1,0); }
    bool inside = insideCastle(wp);
    vec2 cell; float dE;
    if (!trim){
      float rowH = inside ? 0.27 : 0.33;
      float e = 0.006;
      float h0 = stoneHeight(wuv, 0.0, rowH, 0.32, 0.85, 0.05, cell, dE);
      if (hq){
        vec2 c2; float d2;
        float h1 = stoneHeight(wuv + vec2(e, 0), 0.0, rowH, 0.32, 0.85, 0.05, c2, d2);
        float h2 = stoneHeight(wuv + vec2(0, e), 0.0, rowH, 0.32, 0.85, 0.05, c2, d2);
        vec2 gr = vec2(h1 - h0, h2 - h0)/e;
        vec3 bw = -(wtu*gr.x + wtv*gr.y)*0.055;
        bump = qinv(q, bw);
      }
      float r1 = hash12(cell), r2 = hash12(cell + 7.7), r3 = hash12(cell + 3.3);
      vec3 st;
      if (inside){
        st = mix(vec3(0.35, 0.3, 0.23), vec3(0.5, 0.44, 0.35), r1);
        st = mix(st, vec3(0.38, 0.3, 0.21), step(0.82, r2)*0.6);
        st = mix(st, vec3(0.3, 0.28, 0.25), step(0.88, r3)*0.6);
      } else {
        st = mix(vec3(0.3, 0.28, 0.24), vec3(0.47, 0.43, 0.37), r1);
        st = mix(st, vec3(0.4, 0.33, 0.24), step(0.8, r2)*0.6);
      }
      float surf = hq ? fbm2(wuv*5.0 + cell*1.7) : 0.5;
      st *= 0.78 + 0.42*surf;
      if (hq) st *= 0.9 + 0.2*vnoise2(wuv*40.0);
      vec3 mortar = inside ? vec3(0.6, 0.56, 0.48) : vec3(0.52, 0.5, 0.45);
      mortar *= 0.85 + 0.3*vnoise2(wuv*30.0);
      float mj = 1.0 - smoothstep(0.008, 0.022, dE);
      m.alb = mix(st, mortar*0.72, mj);
      m.rough = mix(0.82, 0.95, mj);
      // limewashed rooms (kitchen, bedroom): lime over the stone, joints still read through
      bool lime = inside && ((wp.x > 6.25 && wp.z > 0.25) || (wp.x < -3.25 && wp.z > 0.25));
      if (lime){
        float lw = 0.86 + 0.1*(hq ? fbm2(wuv*1.7 + 3.0) : 0.5);
        vec3 limec = vec3(0.79, 0.73, 0.62)*lw;
        limec = mix(limec, limec*0.88, mj*0.25);
        limec *= 0.94 + 0.08*(hq ? vnoise2(wuv*3.0 + 7.0) : 0.5);
        limec *= 0.97 + 0.06*r1;
        m.alb = limec; m.rough = 0.95;
        bump *= 0.3;
        m.alb *= 0.9 + 0.1*smoothstep(0.0, 0.5, wp.y);
      } else if (inside){
        m.alb *= 0.82 + 0.18*smoothstep(0.0, 0.9, wp.y);
        m.alb *= 1.0 - 0.25*smoothstep(3.0, 9.0, wp.y)*(hq ? fbm2(wuv*0.7) : 0.5);
      } else {
        float lich = smoothstep(0.62, 0.78, fbm2(wuv*1.3 + 5.0));
        m.alb = mix(m.alb, vec3(0.55, 0.55, 0.45), lich*0.5);
        float streak = vnoise2(vec2(wuv.x*6.0, wuv.y*0.25));
        m.alb *= 0.8 + 0.25*streak;
        // rain staining under the parapet and a damp band at the foot of the wall
        float drip = smoothstep(0.55, 0.8, vnoise2(vec2(wuv.x*3.0, 0.0)))*smoothstep(6.0, 10.5, wp.y);
        m.alb *= 1.0 - 0.35*drip*vnoise2(vec2(wuv.x*12.0, wuv.y*0.6));
        m.alb *= mix(0.62, 1.0, smoothstep(-0.5, 1.4, wp.y + 0.6*vnoise2(wuv*1.5)));
        m.alb = mix(m.alb, m.alb*vec3(0.8, 0.95, 0.7), smoothstep(1.2, -0.3, wp.y)*0.6);
        float moss = smoothstep(1.0, -0.4, wp.y)*smoothstep(0.4, 0.7, fbm2(wuv*3.0));
        m.alb = mix(m.alb, vec3(0.12, 0.15, 0.06), moss*0.7);
      }
    } else {
      // dressed limestone ashlar
      faceUV(lp, ln, uv, tu, tv);
      float r1 = hash11(seed*3.7);
      vec3 st = mix(vec3(0.55, 0.5, 0.41), vec3(0.64, 0.59, 0.49), r1);
      bool inside2 = insideCastle(wp);
      if (!inside2) st = mix(st, vec3(0.52, 0.5, 0.46), 0.5);
      float n1 = fbm2(wuv*4.0 + seed);
      st *= 0.82 + 0.3*n1;
      float tool = vnoise2(vec2(wuv.x*90.0, wuv.y*6.0));
      st *= 0.95 + 0.08*tool;
      // ashlar joints on trim every ~0.6m
      vec2 jl, js; vec2 jc;
      float jd = blocks(wuv, 0.42, 0.5, 0.9, 0.0, 31.0, jc, jl, js);
      float jm = 1.0 - smoothstep(0.003, 0.009, jd);
      m.alb = mix(st, vec3(0.45, 0.42, 0.36), jm*0.8);
      m.rough = 0.72;
      bump = qinv(q, (wtu*(vnoise2(wuv*60.0) - 0.5) + wtv*(vnoise2(wuv*60.0 + 3.0) - 0.5))*0.06);
      if (!inside2){
        float lich = smoothstep(0.65, 0.8, fbm2(wuv*1.7 + 9.0));
        m.alb = mix(m.alb, vec3(0.58, 0.58, 0.48), lich*0.5);
        m.alb *= 0.8 + 0.2*vnoise2(vec2(wuv.x*5.0, wuv.y*0.3));
      }
    }
    if (!inside && uWet > 0.0){ m.alb *= mix(1.0, 0.55, uWet); m.rough = mix(m.rough, 0.3, uWet); }
    if (inside){ float so = sootAt(wp); if (so > 0.0) m.alb *= 1.0 - 0.8*so*(0.6 + 0.4*vnoise3(wp*6.0)); }
  }
  else if (mid == 2){
    // ---- wide plank oak floor (x = 0 along x, 1 along z, 2 chevron)
    vec2 fp = prm.w > 0.5 && prm.w < 1.5 ? wp.zx : wp.xz;
    float u, v, pw, fu, fv, plen; vec2 id; vec3 g;
    if (prm.w > 1.5){
      float W = 0.62;
      float c = floor(fp.x/W); float fx = fract(fp.x/W);
      float dir = mod(c, 2.0) < 1.0 ? 1.0 : -1.0;
      float along = fp.y + (dir > 0.0 ? fx : 1.0 - fx)*W;
      pw = 0.11;
      float pi2 = floor(along/pw); fv = fract(along/pw);
      id = vec2(c, pi2);
      fu = dir > 0.0 ? fx : 1.0 - fx;
      g = vec3(fu*W*1.414, fv*pw, 0.0);
      float eu = min(fx, 1.0 - fx)*W*0.707;
      float gapE = min(eu, min(fv, 1.0 - fv)*pw);
      float gap = 1.0 - smoothstep(0.0007, 0.0022, gapE);
      fu = 0.5; u = fx; plen = 1.0; v = gapE;
      float h = hash12(id);
      float late = 0.0; float wt = hq ? woodTone(g + vec3(h*17.0, h*3.0, 0.0), h*10.0, late) : 0.9;
      vec3 base = mix(vec3(0.3, 0.17, 0.08), vec3(0.42, 0.26, 0.13), h);
      m.alb = base*wt*(0.85 + 0.25*vnoise2(wp.xz*0.8));
      m.alb *= 1.0 - gap*0.85;
      m.rough = 0.32 + 0.25*vnoise2(wp.xz*2.0) + gap*0.4;
      m.spec = 0.045;
      bump = vec3(0.0, 0.0, 0.0);
    } else {
      pw = 0.27;
      float yw = fp.y + 0.1*vnoise2(vec2(fp.y*1.9, 3.0));
      float pi = floor(yw/pw); fv = fract(yw/pw);
      float off = hash11(pi*1.3)*9.0;
      plen = 2.1 + 1.9*hash11(pi*2.7 + 1.0);
      float seg = floor((fp.x + off)/plen); fu = fract((fp.x + off)/plen);
      id = vec2(seg, pi);
      float h = hash12(id + 0.5);
      g = vec3(fp.x + off + h*50.0, fv*pw + h*7.0, 0.3 + h);
      float late = 0.0; float wt = hq ? woodTone(g, h*13.0, late) : 0.9;
      vec3 base = mix(vec3(0.3, 0.17, 0.08), vec3(0.44, 0.27, 0.13), h);
      base = mix(base, vec3(0.33, 0.24, 0.16), 0.25*step(0.8, hash12(id + 9.0)));
      float knot = 0.0;
      vec2 kc = vec2(hash12(id + 3.0), hash12(id + 4.0));
      vec2 kd = (vec2(fu*plen, fv*pw) - kc*vec2(plen, pw))*vec2(1.0, 2.5);
      knot = smoothstep(0.025, 0.0, length(kd))*step(0.6, hash12(id + 5.0));
      m.alb = base*wt*(1.0 - 0.6*knot);
      float edge = min(min(fv, 1.0 - fv)*pw, min(fu, 1.0 - fu)*plen);
      float gap = 1.0 - smoothstep(0.0008, 0.003, edge);
      m.alb *= 1.0 - 0.85*gap;
      float wear = fbm2(wp.xz*0.35);
      m.alb *= 0.85 + 0.25*wear;
      m.rough = 0.42 + 0.28*smoothstep(0.3, 0.8, wear) + 0.3*gap + 0.1*hash12(id + 7.0);
      // cupping + worn grain relief
      float cup = (fv - 0.5)*0.12;
      vec3 bw = prm.w > 0.5 ? vec3(cup, 0.0, 0.0) : vec3(0.0, 0.0, cup);
      bw += vec3(vnoise2(fp*7.0) - 0.5, 0.0, vnoise2(fp*7.0 + 5.0) - 0.5)*0.03;
      bump = bw;
    }
    if (insideCastle(wp)) m.alb *= 0.9 + 0.1*smoothstep(0.0, 0.5, min(min(wp.x + 15.0, 15.0 - wp.x), min(wp.z + 10.0, 10.0 - wp.z)));
  }
  else if (mid == 3){
    // ---- flagstones
    vec2 cell; float dE;
    vec2 fuv = wp.xz + seed;
    float e = 0.005;
    float h0 = stoneHeight(fuv, 5.0, 0.62, 0.5, 1.05, 0.03, cell, dE);
    if (hq){
      vec2 c2; float d2;
      float h1 = stoneHeight(fuv + vec2(e, 0), 5.0, 0.62, 0.5, 1.05, 0.03, c2, d2);
      float h2 = stoneHeight(fuv + vec2(0, e), 5.0, 0.62, 0.5, 1.05, 0.03, c2, d2);
      vec2 gr = vec2(h1 - h0, h2 - h0)/e;
      bump = -vec3(gr.x, 0.0, gr.y)*0.02;
    }
    float r1 = hash12(cell), r2 = hash12(cell + 2.2);
    vec3 st = mix(vec3(0.3, 0.26, 0.2), vec3(0.47, 0.4, 0.3), r1);
    st = mix(st, vec3(0.33, 0.33, 0.32), step(0.72, r2)*0.6);
    st = mix(st, vec3(0.45, 0.33, 0.22), step(0.9, hash12(cell + 5.5))*0.6);
    st *= 0.8 + 0.35*fbm2(fuv*3.0 + cell);
    float worn = fbm2(fuv*0.6);
    float mj = 1.0 - smoothstep(0.005, 0.014, dE);
    m.alb = mix(st, vec3(0.2, 0.19, 0.17), mj);
    m.rough = mix(0.45 + 0.3*worn, 0.95, mj);
  }
  else if (mid == 4 || mid == 20){
    // ---- aged oak beams / boards
    vec3 g = grainFrame(lp, hs);
    if (mid == 20){
      // boards: planks along longest axis, width across 2nd axis
      vec3 ghs = grainFrame(hs, hs);
      float across = (ghs.y > ghs.z ? g.y : g.z) + 17.0;
      float bw = 0.19;
      float bi = floor(across/bw); float fb = fract(across/bw);
      g += vec3(hash11(bi)*30.0, hash11(bi + 1.0)*3.0, 0.0);
      float late = 0.0; float wt = hq ? woodTone(g, seed + bi, late) : 0.9;
      vec3 base = unpackCol(prm.z, vec3(0.2, 0.12, 0.065));
      m.alb = base*wt*(0.8 + 0.4*hash11(bi*3.3));
      float gap = 1.0 - smoothstep(0.004, 0.009, min(fb, 1.0 - fb)*bw);
      m.alb *= 1.0 - gap*0.85;
      m.rough = 0.7;
    } else {
      float late = 0.0; float wt = hq ? woodTone(g*vec3(1.0, 0.7, 0.7), seed, late) : 0.9;
      vec3 base = unpackCol(prm.z, vec3(0.15, 0.095, 0.055));
      float n = hq ? fbm3l(g*vec3(0.6, 3.0, 3.0) + seed) : 0.5;
      m.alb = base*wt*(0.7 + 0.6*n);
      // checks (drying cracks) along grain
      float ck = abs(vnoise3(vec3(g.x*0.9, g.y*7.0, g.z*7.0) + seed) - 0.5);
      float crack = smoothstep(0.018, 0.0, ck)*step(0.45, vnoise2(vec2(g.x*0.6, seed)));
      m.alb *= 1.0 - 0.8*crack;
      m.rough = 0.72 - 0.1*n;
      // adze facets
      float af = vnoise3(vec3(g.x*5.0, g.y*1.5, g.z*1.5) + seed);
      vec3 bl = vec3(0.0, af - 0.5, vnoise3(vec3(g.x*5.0, g.y*1.5, g.z*1.5) + seed + 5.0) - 0.5)*0.12;
      if (hs.x >= hs.y && hs.x >= hs.z) bump = bl;
      else if (hs.y >= hs.z) bump = bl.zxy;

    }

  else if (mid == 5){

    vec3 base = unpackCol(prm.z, vec3(0.74, 0.7, 0.62));
    float n = fbm2(wp.xz*1.3 + wp.y);
    m.alb = base*(0.88 + 0.16*n);
    m.alb *= 0.92 + 0.08*vnoise2(wp.xz*25.0);
    m.rough = 0.95;

  else if (mid == 6 || mid == 18){
    // ---- linen (and lampshade linen)
    vec3 base = unpackCol(prm.z, vec3(0.62, 0.56, 0.46));
    float slub = vnoise3(lp*vec3(10.0, 70.0, 10.0) + seed);
    float slub2 = vnoise3(lp*vec3(70.0, 10.0, 70.0) + seed);
    m.alb = base*(0.9 + 0.1*slub + 0.06*slub2);
    m.alb *= 0.93 + 0.1*fbm3l(lp*6.0 + seed);
    m.rough = 0.92;
    bump = (vec3(vnoise3(lp*5.0 + seed), vnoise3(lp*5.0 + seed + 9.0), vnoise3(lp*5.0 + seed + 19.0)) - 0.5)*0.35;
    bump += (vec3(vnoise3(lp*260.0), 0.0, vnoise3(lp*260.0 + 3.0)) - 0.5)*0.12;
    if (prm.w > 1.5 && mid == 6){
      float ph = lp.x*46.0 + 1.3*vnoise2(vec2(lp.y*0.8, seed));
      bump += vec3(cos(ph)*0.75, 0.0, 0.0);
      m.alb *= 0.8 + 0.2*(0.5 + 0.5*sin(ph));
      m.alb *= 0.9 + 0.1*smoothstep(-hs.y, hs.y, lp.y);

      m.emit = uLampCol*uLampI*prm.w*0.55*base*1.6;

  }
  else if (mid == 7){
    // ---- wool (tartan / herringbone)
    vec3 base = unpackCol(prm.z, vec3(0.2, 0.25, 0.18));
    faceUV(lp, ln, uv, tu, tv);
    vec2 s = fract(uv*2.6);
    vec3 c = base;
    if (prm.w < 0.5){
      float a = step(0.38, s.x)*step(s.x, 0.62), b = step(0.38, s.y)*step(s.y, 0.62);
      float a2 = step(0.08, s.x)*step(s.x, 0.12), b2 = step(0.08, s.y)*step(s.y, 0.12);
      c = mix(c, vec3(0.03, 0.04, 0.08), 0.5*(a + b));
      c = mix(c, vec3(0.3, 0.05, 0.03), 0.6*max(a2, b2));
      c = mix(c, vec3(0.45, 0.38, 0.22), 0.4*step(abs(s.x - 0.8), 0.01));
    } else {
      float hb = step(0.5, fract(uv.x*14.0 + abs(fract(uv.y*14.0) - 0.5)));
      c *= 0.85 + 0.2*hb;
    }
    m.alb = c*(0.85 + 0.25*vnoise3(lp*120.0));
    m.rough = 1.0;
    bump = (vec3(vnoise3(lp*80.0), vnoise3(lp*80.0 + 4.0), vnoise3(lp*80.0 + 8.0)) - 0.5)*0.5;
  }
  else if (mid == 8){
    // ---- worn leather
    vec3 base = unpackCol(prm.z, vec3(0.3, 0.12, 0.045));
    float n1 = fbm3l(lp*5.0 + seed);
    float wear = smoothstep(0.52, 0.78, fbm3l(lp*3.2 + seed*2.0));
    // edge wear on rounded boxes
    vec3 inner = max(abs(lp) - (hs - prm.x - 0.02), 0.0);
    float edgeW = smoothstep(0.0, 0.05, length(inner))*0.8;
    wear = clamp(wear + edgeW*0.7*vnoise3(lp*25.0), 0.0, 1.0);
    m.alb = base*(0.78 + 0.45*n1);
    m.alb = mix(m.alb, base*1.9 + vec3(0.03, 0.015, 0.0), wear*0.6);
    float cr = 1.0 - abs(vnoise3(lp*vec3(11.0, 16.0, 11.0) + seed)*2.0 - 1.0);
    m.alb *= 1.0 - 0.35*smoothstep(0.9, 0.99, cr);
    m.rough = mix(0.33, 0.62, wear) + 0.1*vnoise3(lp*40.0);

      vec2 d = dot(d1, d1) < dot(d2, d2) ? d1 : d2;
      float r = length(d);

      m.alb *= mix(1.0, 0.45, smoothstep(0.1, 0.0, r));

  else if (mid == 9){

    float late = 0.0; float wt = hq ? woodTone(g*vec3(1.0, 1.4, 1.4), seed, late) : 0.9;

  else if (mid == 10 || mid == 30){

  else if (mid == 21){
